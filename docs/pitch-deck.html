  <meta name="description" content="Nota pitch deck — a market for urgent notarial acts." />
  <title>Nota · Pitch deck</title>
  <style>
    /* ADR 0048 tokens + ADR 0050 type, copied from apps/web/public/styles.css :root
       so the deck is greppable with the app. Two registers live here:
       · the SHELL (app bar, title, controls, thumbnails strip, footnote) follows the
         theme with the product's exact mechanism — light on bare :root, dark under
         the guarded media query, dark again under [data-theme="dark"];
       · the STAGE (the slide frame and everything drawn inside it, plus each
         thumbnail) is a dark room by design, like the signing room: the slides are
         rendered on midnight, so its tokens are pinned to the dark set on .stage /
         .thumb below and never flip. */
    :root{color-scheme:light;
      /* ADR 0048 ramp, step for step; the short names further down are this document's shorthand and hold no value of their own. */
      --nota-blue-50:#ebf1f5;--nota-blue-100:#e5eef3;--nota-blue-300:#a7c1cd;--nota-blue-400:#78a9bf;--nota-blue-500:#407598;--nota-blue-600:#386888;--nota-blue-800:#274a62;--nota-blue-900:#264961;--nota-blue-950:#101b26;--nota-orange-600:#b45309;--nota-orange-400:#f79009;
      /* Shell roles, light = styles.css :root */
      --bg:#eef5f7;--bg-rgb:238 245 247;--bg-glow:#dcecf2;--surface:#fbfdfd;--surface-inset:#e6f0f4;--ink:#173b52;--ink-soft:var(--nota-blue-800);--ink-muted:#526b78;--subtitle-ink:#000000;--border:#c5d8df;--brand:var(--nota-blue-600);--accent-warm:var(--nota-orange-600);--accent-warm-rgb:180 83 9;--accent-warm-hover:color-mix(in srgb,var(--accent-warm) 85%,var(--ink));--brand-word-ink:var(--nota-blue-950);--on-accent:#ffffff;
      --tswitch-x:0;--tswitch-sun:var(--brand);--tswitch-moon:var(--ink-muted);--shadow-sm:0 1px 2px rgb(16 27 38 / .05);
      --font-sans:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--font-display:'Sora',var(--font-sans);--weight-display:700;

\" text-anchor=\"start\" letter-spacing=\"1.8px\">SCALING<\/text>\n<text x=\"1528\" y=\"108\" fill=\"#afc2cf\" font-family=\"Inter\" font-size=\"18px\" font-weight=\"600\" text-anchor=\"end\" letter-spacing=\"0px\">07 / 09<\/text>\n<text x=\"72\" y=\"196\" fill=\"#f4f8fa\" font-family=\"Sora\" font-size=\"54px\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"-2.16px\">Grow with capacity.<\/text>\n<text x=\"72\" y=\"251\" fill=\"#afc2cf\" font-family=\"Inter\" font-size=\"24px\" font-weight=\"500\" text-anchor=\"start\" letter-spacing=\"0px\">Concentrate on Québec City, then expand as evidence supports it.<\/text>\n<g data-motion=\"projection\" style=\"--delay:0ms\"><text x=\"72\" y=\"357\" fill=\"#f4f8fa\" font-family=\"Inter\" font-size=\"18px\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"1.8px\">YEAR 1<\/text><text x=\"72\" y=\"437\" fill=\"#f4f8fa\" font-family=\"Inter\" font-size=\"79px\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0px\">244<\/text><text x=\"72\" y=\"481\" fill=\"#afc2cf\" font-family=\"Inter\" font-size=\"24px\" font-weight=\"500\" text-anchor=\"start\" letter-spacing=\"0px\">completed acts<\/text><line x1=\"72\" y1=\"530\" x2=\"514\" y2=\"530\" stroke=\"#294353\" stroke-width=\"2\" /><text x=\"72\" y=\"607\" fill=\"#f4f8fa\" font-family=\"Inter\" font-size=\"43px\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0px\">−$204,623<\/text><text x=\"72\" y=\"657\" fill=\"#afc2cf\" font-family=\"Inter\" font-size=\"24px\" font-weight=\"500\" text-anchor=\"start\" letter-spacing=\"0px\">operating result<\/text><\/g>\n<g data-motion=\"projection\" style=\"--delay:800ms\"><text x=\"569\" y=\"357\" fill=\"#f4f8fa\" font-family=\"Inter\" font-size=\"18px\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"1.8px\">YEAR 2<\/text><text x=\"569\" y=\"437\" fill=\"#f4f8fa\" font-family=\"Inter\" font-size=\"79px\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0px\">2,800<\/text><text x=\"569\" y=\"481\" fill=\"#afc2cf\" font-family=\"Inter\" font-size=\"24px\" font-weight=\"500\" text-anchor=\"start\" letter-spacing=\"0px\">completed acts<\/text><line x1=\"569\" y1=\"530\" x2=\"1011\" y2=\"530\" stroke=\"#294353\" stroke-width=\"2\" /><text x=\"569\" y=\"607\" fill=\"#f4f8fa\" font-family=\"Inter\" font-size=\"43px\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0px\">−$200,496<\/text><text x=\"569\" y=\"657\" fill=\"#afc2cf\" font-family=\"Inter\" font-size=\"24px\" font-weight=\"500\" text-anchor=\"start\" letter-spacing=\"0px\">operating result<\/text><\/g>\n<g data-motion=\"projection\" style=\"--delay:1600ms\"><text x=\"1066\" y=\"357\" fill=\"#f4f8fa\" font-family=\"Inter\" font-size=\"18px\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"1.8px\">YEAR 3<\/text><text x=\"1066\" y=\"437\" fill=\"#f4f8fa\" font-family=\"Inter\" font-size=\"79px\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0px\">11,000<\/text><text x=\"1066\" y=\"481\" fill=\"#afc2cf\" font-family=\"Inter\" font-size=\"24px\" font-weight=\"500\" text-anchor=\"start\" letter-spacing=\"0px\">completed acts<\/text><line x1=\"1066\" y1=\"530\" x2=\"1508\" y2=\"530\" stroke=\"#294353\" stroke-width=\"2\" /><text x=\"1066\" y=\"607\" fill=\"#f79009\" font-family=\"Inter\" font-size=\"43px\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0px\">$194,851<\/text><text x=\"1066\" y=\"657\" fill=\"#afc2cf\" font-family=\"Inter\" font-size=\"24px\" font-weight=\"500\" text-anchor=\"start\" letter-spacing=\"0px\">operating result<\/text><\/g>\n<text x=\"72\" y=\"737\" fill=\"#78a9bf\" font-family=\"Inter\" font-size=\"27px\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0px\">Verified capacity → measured acquisition → funded expansion.<\/text>\n<line x1=\"72\" y1=\"784\" x2=\"1528\" y2=\"784\" stroke=\"#294353\" stroke-width=\"2\" />\n<text x=\"72\" y=\"818\" fill=\"#afc2cf\" font-family=\"Inter\" font-size=\"18px\" font-weight=\"500\" text-anchor=\"start\" letter-spacing=\"0px\">Scenarios, not traction. Y3 requires substantial provincial expansion. No AI or signing revenue included; additional funding is needed.<\/text>\n<text x=\"72\" y=\"871\" fill=\"#afc2cf\" font-family=\"Inter\" font-size=\"16px\" font-weight=\"500\" text-anchor=\"start\" letter-spacing=\"0px\">Nota vision and assumptions · September 2026<\/text>\n<\/svg>"},{"title":"Value grows through use.","subtitle":"Connect distribution, learning and file completion.","note":"Intended advantage, to measure in cohorts. Voluntary, authorized feedback. Nota earns its own fees and, later, software subscriptions.","sources":["csn"],"transcript":"01 Client A need addressed. A clear next step. 02 Notary Qualified work. Time for professional expertise. 03 Partner A tracked referral. An attributed reward. Demand + professional feedback → more capacity → recurring use","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Value grows through use.\" data-frame=\"8\">\n<rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"3\" fill=\"#101820\" stroke=\"none\" stroke-width=\"2\" opacity=\"1\" />\n<text x=\"72\" y=\"108\" fill=\"#f4f8fa\" font-family=\"Inter\" font-size=\"18px\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"1.8px\">DIFFERENTIATION · THREE WINNERS<\/text>\n<text x=\"1528\" y=\"108\" fill=\"#afc2cf\" font-family=\"Inter\" font-size=\"18px\" font-weight=\"600\" text-anchor=\"end\" letter-spacing=\"0px\">08 / 09<\/text>\n<text x=\"72\" y=\"196\" fill=\"#f4f8fa\" font-family=\"Sora\" font-size=\"54px\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"-2.16px\">Value grows through use.<\/text>\n<text x=\"72\" y=\"251\" fill=\"#afc2cf\" font-family=\"Inter\" font-size=\"24px\" font-weight=\"500\" text-anchor=\"start\" letter-spacing=\"0px\">Connect distribution, learning and file completion.<\/text>\n<g data-motion=\"reveal\" style=\"--delay:0ms\"><rect x=\"72\" y=\"335\" width=\"461\" height=\"242\" rx=\"8\" fill=\"#0f2030\" stroke=\"#294353\" stroke-width=\"2\" opacity=\"1\" /><text x=\"100\" y=\"377\" fill=\"#f4f8fa\" font-family=\"Inter\" font-size=\"18px\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"1.8px\">01<\/text><text x=\"100\" y=\"430\" fill=\"#f4f8fa\" font-family=\"Sora\" font-size=\"36px\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0px\">Client<\/text><text x=\"100\" y=\"495.0\" fill=\"#afc2cf\" font-family=\"Inter\" font-size=\"24px\" font-weight=\"500\" text-anchor=\"start\" letter-spacing=\"0px\">A need addressed.<\/text><text x=\"100\" y=\"529.8\" fill=\"#afc2cf\" font-family=\"Inter\" font-size=\"24px\" font-weight=\"500\" text-anchor=\"start\" letter-spacing=\"0px\">A clear next step.<\/text><\/g>\n<g data-motion=\"reveal\" style=\"--delay:500ms\"><rect x=\"569\" y=\"335\" width=\"461\" height=\"242\" rx=\"8\" fill=\"#0f2030\" stroke=\"#294353\" stroke-width=\"2\" opacity=\"1\" /><text x=\"597\" y=\"377\" fill=\"#f4f8fa\" font-family=\"Inter\" font-size=\"18px\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"1.8px\">02<\/text><text x=\"597\" y=\"430\" fill=\"#f4f8fa\" font-family=\"Sora\" font-size=\"36px\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0px\">Notary<\/text><text x=\"597\" y=\"495.0\" fill=\"#afc2cf\" font-family=\"Inter\" font-size=\"24px\" font-weight=\"500\" text-anchor=\"start\" letter-spacing=\"0px\">Qualified work.<\/text><text x=\"597\" y=\"529.8\" fill=\"#afc2cf\" font-family=\"Inter\" font-size=\"24px\" font-weight=\"500\" text-anchor=\"start\" letter-spacing=\"0px\">Time for professional expertise.<\/text><\/g>\n<g data-motion=\"reveal\" style=\"--delay:1000ms\"><rect x=\"1066\" y=\"335\" width=\"461\" height=\"242\" rx=\"8\" fill=\"#0f2030\" stroke=\"#294353\" stroke-width=\"2\" opacity=\"1\" /><text x=\"1094\" y=\"377\" fill=\"#f4f8fa\" font-family=\"Inter\" font-size=\"18px\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"1.8px\">03<\/text><text x=\"1094\" y=\"430\" fill=\"#f4f8fa\" font-family=\"Sora\" font-size=\"36px\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0px\">Partner<\/text><text x=\"1094\" y=\"495.0\" fill=\"#afc2cf\" font-family=\"Inter\" font-size=\"24px\" font-weight=\"500\" text-anchor=\"start\" letter-spacing=\"0px\">A tracked referral.<\/text><text x=\"1094\" y=\"529.8\" fill=\"#afc2cf\" font-family=\"Inter\" font-size=\"24px\" font-weight=\"500\" text-anchor=\"start\" letter-spacing=\"0px\">An attributed reward.<\/text><\/g>\n<g data-motion=\"feedback\" style=\"--delay:1800ms\"><path d=\"M301 611 V649 H1299 V611 M799 649 V691\" pathLength=\"1\" fill=\"none\" stroke=\"#78a9bf\" stroke-width=\"3\"/><\/g>\n<g data-motion=\"integrate\" style=\"--delay:2400ms\"><text x=\"800\" y=\"731\" fill=\"#78a9bf\" font-family=\"Inter\" font-size=\"28px\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0px\">Demand + professional feedback → more capacity → recurring use<\/text><\/g>\n<line x1=\"72\" y1=\"784\" x2=\"1528\" y2=\"784\" stroke=\"#294353\" stroke-width=\"2\" />\n<text x=\"72\" y=\"818\" fill=\"#afc2cf\" font-family=\"Inter\" font-size=\"18px\" font-weight=\"500\" text-anchor=\"start\" letter-spacing=\"0px\">Intended advantage, to measure in cohorts. Voluntary, authorized feedback. Nota earns its own fees and, later, software subscriptions.<\/text>\n<a href=\"https://www.csn.notaires.fr/fr/actualites/intelligence-artificielle-le-conseil-superieur-du-notariat-choisit-mistral-ai-et\" target=\"_blank\"><text x=\"72.0\" y=\"871\" fill=\"#afc2cf\" font-family=\"Inter\" font-size=\"16px\" font-weight=\"500\" text-anchor=\"start\" letter-spacing=\"0px\">CSN · 2026-07-09<\/text><\/a>\n<\/svg>"},{"title":"Fund the proof. Open the next stage.","subtitle":"An initial market, a capacity engine, an international ambition.","note":"Base: $45,377 at Y1 end; at least $180,119 more before unmodeled obligations. info@gonota.ca","sources":[],"transcript":"$250,000 to launch the pilot 12 months to turn the product into evidence. Deliver A cohort and actual completed acts. Measure Preparation savings and contribution. Validate The protocol and its requirements.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Fund the proof. Open the next stage.\" data-frame=\"9\">\n<rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"3\" fill=\"#101820\" stroke=\"none\" stroke-width=\"2\" opacity=\"1\" />\n<text x=\"72\" y=\"108\" fill=\"#f4f8fa\" font-family=\"Inter\" font-size=\"18px\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"1.8px\">INVESTMENT<\/text>\n<text x=\"1528\" y=\"108\" fill=\"#afc2cf\" font-family=\"Inter\" font-size=\"18px\" font-weight=\"600\" text-anchor=\"end\" letter-spacing=\"0px\">09 / 09<\/text>\n<text x=\"72\" y=\"196\" fill=\"#f4f8fa\" font-family=\"Sora\" font-size=\"54px\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"-2.16px\">Fund the proof. Open the next stage.<\/text>\n<text x=\"72\" y=\"251\" fill=\"#afc2cf\" font-family=\"Inter\" font-size=\"24px\" font-weight=\"500\" text-anchor=\"start\" letter-spacing=\"0px\">An initial market, a capacity engine, an international ambition.<\/text>\n<text x=\"72\" y=\"435\" fill=\"#f4f8fa\" font-family=\"Inter\" font-size=\"100px\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0px\">$250,000<\/text>\n<text x=\"72\" y=\"500\" fill=\"#f4f8fa\" font-family=\"Sora\" font-size=\"36px\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0px\">to launch the pilot<\/text>\n<text x=\"72\" y=\"588.0\" fill=\"#afc2cf\" font-family=\"Inter\" font-size=\"29px\" font-weight=\"500\" text-anchor=\"start\" letter-spacing=\"0px\">12 months to turn<\/text><text x=\"72\" y=\"630.05\" fill=\"#afc2cf\" font-family=\"Inter\" font-size=\"29px\" font-weight=\"500\" text-anchor=\"start\" letter-spacing=\"0px\">the product into evidence.<\/text>\n<g data-motion=\"milestone\" style=\"--delay:0ms\"><rect x=\"909\" y=\"338\" width=\"619\" height=\"113\" rx=\"6\" fill=\"#0f2030\" stroke=\"#294353\" stroke-width=\"2\" opacity=\"1\" /><text x=\"937\" y=\"382\" fill=\"#f4f8fa\" font-family=\"Sora\" font-size=\"30px\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0px\">Deliver<\/text><text x=\"937\" y=\"424\" fill=\"#afc2cf\" font-family=\"Inter\" font-size=\"24px\" font-weight=\"500\" text-anchor=\"start\" letter-spacing=\"0px\">A cohort and actual completed acts.<\/text><\/g>\n<g data-motion=\"milestone\" style=\"--delay:700ms\"><rect x=\"909\" y=\"474\" width=\"619\" height=\"113\" rx=\"6\" fill=\"#0f2030\" stroke=\"#294353\" stroke-width=\"2\" opacity=\"1\" /><text x=\"937\" y=\"518\" fill=\"#f4f8fa\" font-family=\"Sora\" font-size=\"30px\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0px\">Measure<\/text><text x=\"937\" y=\"560\" fill=\"#afc2cf\" font-family=\"Inter\" font-size=\"24px\" font-weight=\"500\" text-anchor=\"start\" letter-spacing=\"0px\">Preparation savings and contribution.<\/text><\/g>\n<g data-motion=\"milestone\" style=\"--delay:1400ms\"><rect x=\"909\" y=\"610\" width=\"619\" height=\"113\" rx=\"6\" fill=\"#0f2030\" stroke=\"#294353\" stroke-width=\"2\" opacity=\"1\" /><text x=\"937\" y=\"654\" fill=\"#f4f8fa\" font-family=\"Sora\" font-size=\"30px\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0px\">Validate<\/text><text x=\"937\" y=\"696\" fill=\"#afc2cf\" font-family=\"Inter\" font-size=\"24px\" font-weight=\"500\" text-anchor=\"start\" letter-spacing=\"0px\">The protocol and its requirements.<\/text><\/g>\n<line x1=\"72\" y1=\"784\" x2=\"1528\" y2=\"784\" stroke=\"#294353\" stroke-width=\"2\" />\n<text x=\"72\" y=\"818\" fill=\"#afc2cf\" font-family=\"Inter\" font-size=\"18px\" font-weight=\"500\" text-anchor=\"start\" letter-spacing=\"0px\">Base: $45,377 at Y1 end; at least $180,119 more before unmodeled obligations. info@gonota.ca<\/text>\n<text x=\"72\" y=\"871\" fill=\"#afc2cf\" font-family=\"Inter\" font-size=\"16px\" font-weight=\"500\" text-anchor=\"start\" letter-spacing=\"0px\">Nota vision and assumptions · September 2026<\/text>\n<\/svg>"}]}}</script>
<style>@media(min-width:700px){.stage{max-height:calc(100svh - 250px)}.stage:fullscreen{max-height:none}}</style><script data-nota-presentation-controls>/* Shared, dependency-free presentation controls. Labels remain accessible. */
window.NotaPresentation = (() => {
  const paths = {
    previous:'M14 5 7 12l7 7M7 12h13', next:'m10 5 7 7-7 7M4 12h13',
    replay:'M4 10a8 8 0 1 1 1 7M4 4v6h6',
    pause:'M8 5v14M16 5v14', play:'m7 4 12 8-12 8Z',
    stop:'M6 6h12v12H6Z', fullscreen:'M9 4H4v5M15 4h5v5M20 15v5h-5M9 20H4v-5',

    info:'M12 11v6M12 7v.1M4 4h16v16H4Z',
    detail:'M8 6h12M8 12h12M8 18h12M3 6h1M3 12h1M3 18h1',
    transcript:'M4 5h16M4 10h16M4 15h10M4 20h10',
    download:'M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4',
    motionOff:'M4 4l16 16M8 11v8M16 5v6'
  };
  const icon = name => '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="' + paths[name] + '"/></svg>';
  function set(button, label, name) {

})();
</script><style data-nota-presentation-controls>/* The presentation starts with its content; controls are direct buttons. */
.deck-head,.plan-deck-head{position:absolute!important;width:1px!important;height:1px!important;margin:-1px!important;padding:0!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap}
.controls .hint,.footnote,.progress{display:none}
.presentation-icon{display:inline-flex!important;align-items:center!important;justify-content:center!important;min-width:44px;min-height:44px;padding:10px!important}
.presentation-icon svg{display:block;width:20px;height:20px;fill:none!important;stroke:currentColor;flex:none}
.controls,.plan-controls{gap:8px}
.stage,.plan-stage{max-height:calc(100svh - 192px)}
.stage:fullscreen,.plan-stage:fullscreen{max-height:none}
.thumbs{grid-template-columns:repeat(9,minmax(0,1fr));gap:6px}

.thumb[aria-current=true]{border-color:var(--brand);background:var(--surface-inset);box-shadow:inset 0 -2px 0 var(--brand)}
.evidence[hidden],.plan-detail-content[hidden],.plan-notes[hidden],.plan-transcript-panel[hidden]{display:none!important}
.plan-detail-content:not([hidden]),.plan-notes:not([hidden]),.plan-transcript-panel:not([hidden]){border-top:1px solid var(--border);padding-top:16px}
.plan-transcript-panel{font-size:14px;color:var(--ink-muted)}
.plan-experience{gap:14px}.plan-chapters{gap:6px}.plan-chapters button{font-size:12px}
.plan-experience .market-explorer{padding:10px 14px}.plan-experience .market-inputs{gap:12px}
@media(max-width:700px){.thumbs{grid-template-columns:repeat(3,minmax(0,1fr))}.plan-chapters{grid-template-columns:repeat(4,minmax(0,1fr))}.plan-chapters button{display:grid;gap:4px}.stage,.plan-stage{max-height:none}.plan-controls,.controls{gap:6px}.presentation-icon{padding:8px!important}.plan-experience .market-inputs{grid-template-columns:1fr}}

  --layout-section-gap: 32px;
  --layout-content-top: clamp(16px, 1.8vw, 24px);
  --logo-badge-min: 9px;
  --control-gap: 8px;
  --control-height: 44px;
  --type-control: 13px;
  --header-h: var(--layout-header-height);
  --admin-topbar-h: var(--layout-header-height);
  --brand-word-ink: var(--ink);
}

/* The outer bar spans the viewport. Its contents align with the page rail. */
.nota-header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--surface);
  border: 0;
  box-shadow: var(--shadow);
  backdrop-filter: none;
}
.nota-header-inner {
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--control-gap);
  width: 100%;
  min-height: var(--layout-header-height);
  height: auto;
  padding: 0 max(var(--layout-gutter), calc((100% - var(--layout-width)) / 2 + var(--layout-gutter)));
  margin: 0;
}
.site-header.nota-header .nota-header-inner {
  max-width: var(--layout-width);
  margin-inline: auto;
  padding-inline: var(--layout-gutter);
  height: var(--layout-header-height);
}
.nota-header :is(.brand, .admin-brand, .lockup, .plan-brand) {
  --lockup-tile: var(--logo-tile);
  color: var(--ink);
  margin-block: 0;
  text-decoration: none;
  flex-shrink: 0;
  min-height: var(--control-height);
}
.nota-header :is(.brand, .admin-brand) {
  --lockup-word: calc(var(--lockup-tile) * var(--logo-word-ratio));
  --lockup-gap: calc(var(--lockup-tile) * var(--logo-gap-ratio));
  --lockup-badge-gap: calc(var(--lockup-tile) * var(--logo-badge-gap-ratio));
}
.nota-header :is(.lockup, .plan-brand),
[data-nota-surface="pitch"] .nota-header .brand {
  --lockup-word: var(--logo-word-ratio);
  --lockup-gap: var(--logo-gap-ratio);
  --lockup-badge-gap: var(--logo-badge-gap-ratio);
}
.nota-header :is(.brand-word, .admin-brand-word, .plan-brand-word) { color: var(--ink); }
.nota-header :is(.brand-sub, .admin-brand-sub, .brand-region, .plan-brand-region) {
  font-size: max(var(--logo-badge-min), calc(var(--logo-tile) * .16));
  font-family: var(--font-sans);
  font-weight: 800;
  line-height: 1;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: .55em .7em;
  color: var(--ink-muted);
  background: var(--logo-badge-bg);
  border-radius: var(--radius-xs, 3px);
}
.nota-header-actions {
  display: flex;
  flex-wrap: wrap;
  flex-direction: row;
  align-items: center;
  justify-content: flex-end;
  gap: var(--control-gap);
  margin-left: auto;
  min-width: 0;
}
.nota-menu { margin-left: auto; }
.nota-menu > summary { display: none; }
.nota-menu > .nota-header-actions { display: flex; }
.nota-header .nota-header-actions :is(a, button):not(.tswitch) {
  min-height: var(--control-height);
  font-family: var(--font-sans);
  font-size: var(--type-control);
  font-weight: 600;
  letter-spacing: 0;
  color: var(--ink);
}
.nota-header .nota-header-actions :is(a, button):hover { color: var(--brand); }
.nota-header .nota-header-actions [aria-pressed="true"] { color: var(--brand); }

/* Content rails share their outer margins; long prose retains its own measure. */
[data-nota-surface="brand"] .page,
[data-nota-surface="plan"] > main,
[data-nota-surface="pitch"] > main {
  box-sizing: border-box;
  width: 100%;
  max-width: var(--layout-width);
  margin-inline: auto;
  padding: var(--layout-content-top) var(--layout-gutter) calc(var(--layout-section-gap) * 2);
}
[data-nota-surface="brand"] .hero { padding-top: 0; }
[data-nota-surface="brand"] .section { margin-top: var(--layout-section-gap); padding-top: var(--layout-section-gap); }
[data-nota-surface="brand"] .section-head { margin-bottom: 16px; gap: 24px; }
[data-nota-surface="brand"] .section-head p { font-size: var(--type-body); line-height: var(--type-body-lh); }
[data-nota-surface="brand"] .lede { max-width: 47ch; }
[data-nota-surface="pitch"] .deck-head h1 { font-size: var(--type-h1); line-height: var(--type-h1-lh); letter-spacing: var(--type-h1-ls); }
[data-nota-surface="pitch"] .deck-head p:not(.deck-kicker) { font-size: var(--type-lead); line-height: var(--type-lead-lh); }
[data-nota-surface="plan"] .language-bar {
  position: static;
  padding: 0;
  margin-block: 0;
  border: 0;
  box-shadow: none;
  background: transparent;
}
[data-nota-surface="plan"] .language-bar .deck-link,
[data-nota-surface="plan"] .language-bar [data-plan-focus] { margin-inline: 0; }
[data-nota-surface="plan"] .language-bar > span { display: none; }
[data-nota-surface="plan"] :is(.section-body, .french-summary) > :is(p, ul, ol) { max-width: 76ch; }

@media (max-width: 700px) {
  .nota-header.nota-header-inner { flex-wrap: wrap; }
  .nota-menu > summary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--control-gap);
    min-height: var(--control-height);
    min-width: var(--control-height);
    padding-inline: 8px;
    color: var(--ink);
    cursor: pointer;
    font: 600 var(--type-control)/1 var(--font-sans);
    list-style: none;
  }
  .nota-menu > summary::-webkit-details-marker { display: none; }
  .nota-menu:not([open]) > .nota-header-actions { display: none; }
  .nota-menu > .nota-header-actions {
    position: absolute;
    top: 100%;
    inset-inline: var(--layout-gutter);
    padding: 16px;
    margin: 0;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  [data-nota-surface="plan"] .nota-menu > .language-bar { position: absolute; padding: 16px; background: var(--surface); }
  .nota-header .top-links { flex-direction: row; align-items: center; }
}
@media print {
  .nota-header { position: static; box-shadow: none; }
  .nota-header-actions { display: none; }
}

[data-nota-surface="acquisition"] .search-page { max-width: var(--layout-width); padding: var(--layout-content-top) var(--layout-gutter) 64px; }
[data-nota-surface="acquisition"] .search-page :is(p, ol, ul) { max-width: 76ch; }
.nota-header > .lang-link { display: inline-flex; align-items: center; min-height: var(--control-height); padding-inline: 12px; color: var(--ink); }
</style>

<script>(() => {
  const data=JSON.parse(document.getElementById('deck-data').textContent);
  const ui=window.NotaPresentation;
  const shortTitles={fr:['Urgence','Marché','Partenaires','IA','Signature','Marge','Échelle','Valeur','Pilote'],en:['Urgency','Market','Partners','AI','Signing','Margin','Scale','Value','Pilot']};
  const $=id=>document.getElementById(id), stage=$('stage'), motionQuery=matchMedia('(prefers-reduced-motion: reduce)');
  const systemTheme=matchMedia('(prefers-color-scheme: dark)');
  const copy={
    fr:{title:'Présentation investisseurs',subtitle:'Mise en relation. Automatisation. Signature électronique.',previous:'Diapositive précédente',next:'Diapositive suivante',replay:'Rejouer l’animation',pause:'Pause',resume:'Reprendre',disabled:'Animation désactivée',auto:'Défilement automatique',stop:'Arrêter le défilement',full:'Plein écran',exit:'Quitter le plein écran',plan:'Plan d’affaires',pdf:'Télécharger le PDF',takeaway:'À retenir',sources:'Sources et hypothèses',transcript:'Lire le contenu de la diapositive',hypothesis:'Vision, cibles ou hypothèses internes. Détails dans le plan d’affaires.',hint:'← → : diapositives · F : plein écran',slide:'Diapositive',theme:'Thème'},
    en:{title:'Investor presentation',subtitle:'Matching. Automation. Electronic signing.',previous:'Previous slide',next:'Next slide',replay:'Replay animation',pause:'Pause',resume:'Resume',disabled:'Animation disabled',auto:'Auto-advance',stop:'Stop auto-advance',full:'Full screen',exit:'Exit full screen',plan:'Business plan',pdf:'Download PDF',takeaway:'Key takeaway',sources:'Sources and assumptions',transcript:'Read the slide content',hypothesis:'Internal vision, targets or assumptions. Details in the business plan.',hint:'← →: slides · F: full screen',slide:'Slide',theme:'Theme'}
  };
  const readSaved=key=>{try {let value=localStorage.getItem(key);try {value=JSON.parse(value)}catch{}return value}catch{return null}};
  const query=new URLSearchParams(location.search).get('lang');
  let language=[query,readSaved('nota.lang'),readSaved('nota.pitch.lang'),'fr'].find(x=>x==='fr'||x==='en');
  let current=1, timer=null, playing=false, paused=false;
  const entries=()=>data.editions[language];
  const safe=value=>Math.max(1,Math.min(entries().length,Math.trunc(Number(value))||1));
  function setPlaying(value){playing=value;clearInterval(timer);timer=null;if(value)timer=setInterval(()=>{if(current===entries().length){setPlaying(false);return}setSlide(current+1)},12000);$('play').setAttribute('aria-pressed',String(value));ui.set($('play'),copy[language][value?'stop':'auto'],value?'stop':'play');}
  function syncMotion(){const off=motionQuery.matches;stage.classList.toggle('motion-paused',paused||document.hidden);for(const button of [$('motion'),stage.querySelector('[data-fs=motion]')]){ui.set(button,copy[language][off?'disabled':paused?'resume':'pause'],off?'motionOff':paused?'play':'pause');button.disabled=off;button.setAttribute('aria-pressed',String(paused||off))}$('replay').disabled=off;stage.querySelector('[data-fs=replay]').disabled=off;}
  function setSlide(value,writeHash=true){current=safe(value);const item=entries()[current-1];$('slide').innerHTML=item.svg;$('counter').textContent=`${current} / ${entries().length}`;$('stage').setAttribute('aria-label',`${copy[language].slide} ${current}: ${item.title}`);$('slideSubtitle').textContent=item.subtitle;$('slideNote').textContent=item.note;$('transcript').textContent=item.title+'. '+item.transcript;
    $('sourceLinks').replaceChildren();if(!item.sources.length){const p=document.createElement('p');p.textContent=copy[language].hypothesis;$('sourceLinks').append(p)}
    for(const id of item.sources){const source=data.sources[id],a=document.createElement('a');a.href=source.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=source.label;$('sourceLinks').append(a)}
    for(const button of [$('prevControl'),stage.querySelector('[data-fs=prev]')])button.disabled=current===1;
    for(const button of [$('nextControl'),stage.querySelector('[data-fs=next]')])button.disabled=current===entries().length;
    $('progress').setAttribute('aria-valuenow',String(current));$('progressBar').style.width=`${current/entries().length*100}%`;
    for(const thumb of $('thumbs').children)thumb.setAttribute('aria-current',String(Number(thumb.dataset.slide)===current));
    if(writeHash)history.replaceState(null,'',`#slide-${current}`);syncMotion();
  }
  function effectiveTheme(){return document.documentElement.getAttribute('data-theme')||(systemTheme.matches?'dark':'light')}
  function syncTheme(){const b=$('theme-toggle');b.setAttribute('aria-checked',String(effectiveTheme()==='dark'));b.setAttribute('aria-label',copy[language].theme)}
  function setLanguage(lang){language=lang;document.documentElement.lang=lang==='fr'?'fr-CA':'en-CA';const c=copy[lang];document.title=`Nota · ${c.title}`;for(const [id,key] of Object.entries({deckTitle:'title',deckSubtitle:'subtitle',replay:'replay',evidenceTitle:'takeaway',sourcesTitle:'sources',transcriptLabel:'transcript',hint:'hint',businessPlanLink:'plan',planLink:'plan',summaryLink:'pdf'}))$(id).textContent=c[key];
    for(const b of [$('prevControl'),stage.querySelector('[data-fs=prev]')])ui.set(b,c.previous,'previous');for(const b of [$('nextControl'),stage.querySelector('[data-fs=next]')])ui.set(b,c.next,'next');for(const b of [$('replay'),stage.querySelector('[data-fs=replay]')])ui.set(b,c.replay,'replay');ui.set(stage.querySelector('[data-fs=exit]'),c.exit,'exit');ui.set($('summaryLink'),c.pdf,'download');ui.set(evidenceToggle,c.sources,'info');
    document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
    $('summaryLink').href=`/nota-pitch-deck${lang==='fr'?'-fr':''}.pdf`;
    const planUrl=location.hostname==='pitch.gonota.ca'?'https://plan.gonota.ca/':'/business-plan.html';for(const id of ['businessPlanLink','planLink'])$(id).href=planUrl+`?lang=${lang}`;
    $('thumbs').replaceChildren();for(const [index,item] of entries().entries()){const button=document.createElement('button');button.type='button';button.className='thumb';button.dataset.slide=index+1;button.setAttribute('aria-label',`${c.slide} ${index+1}: ${item.title}`);const img=document.createElement('img');img.alt='';img.loading='lazy';img.src=`/pitch-deck/dark-slide-${lang==='fr'?'fr-':''}${index+1}.png`;const label=document.createElement('span');label.textContent=String(index+1).padStart(2,'0')+' · '+shortTitles[lang][index];button.append(img,label);button.addEventListener('click',()=>{setPlaying(false);setSlide(index+1)});$('thumbs').append(button)}
    try{localStorage.setItem('nota.lang',lang)}catch{}setPlaying(false);setSlide(current);syncFullscreen();syncTheme();
  }
  function syncFullscreen(){const text=copy[language][document.fullscreenElement?'exit':'full'];ui.set($('fullscreen'),text,document.fullscreenElement?'exit':'fullscreen');$('fullscreenTop').setAttribute('aria-label',text);$('fullscreenTop').title=text;}
  async function toggleFullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await stage.requestFullscreen()}catch{}}
  const move=delta=>{setPlaying(false);setSlide(current+delta)};
  $('prevControl').addEventListener('click',()=>move(-1));$('nextControl').addEventListener('click',()=>move(1));
  $('replay').addEventListener('click',()=>{paused=false;setSlide(current)});$('motion').addEventListener('click',()=>{paused=!paused;syncMotion()});$('play').addEventListener('click',()=>setPlaying(!playing));
  for(const id of ['fullscreen','fullscreenTop'])$(id).addEventListener('click',toggleFullscreen);
  document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLanguage(b.dataset.lang)));
  stage.querySelectorAll('[data-fs]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.fs==='prev')move(-1);if(b.dataset.fs==='next')move(1);if(b.dataset.fs==='exit')toggleFullscreen();if(b.dataset.fs==='motion')$('motion').click();if(b.dataset.fs==='replay')$('replay').click()}));
  window.addEventListener('keydown',event=>{if(event.ctrlKey||event.altKey||event.metaKey||event.target.closest('input,textarea,select,[contenteditable=true],summary'))return;if(event.key==='ArrowLeft'){event.preventDefault();move(-1)}if(event.key==='ArrowRight'){event.preventDefault();move(1)}if(event.key==='Home'){event.preventDefault();setSlide(1)}if(event.key==='End'){event.preventDefault();setSlide(entries().length)}if(event.key.toLowerCase()==='f'&&!event.target.closest('button,a'))toggleFullscreen();});
  let touchX=null;stage.addEventListener('touchstart',e=>{if(!e.target.closest('button'))touchX=e.changedTouches[0].clientX},{passive:true});stage.addEventListener('touchend',e=>{if(touchX!==null){const delta=e.changedTouches[0].clientX-touchX;if(Math.abs(delta)>70)move(delta<0?1:-1)}touchX=null},{passive:true});
  window.addEventListener('hashchange',()=>{setPlaying(false);setSlide(location.hash.match(/^#slide-(\d+)$/)?.[1]||1,false)});
  document.addEventListener('fullscreenchange',syncFullscreen);motionQuery.addEventListener('change',syncMotion);document.addEventListener('visibilitychange',()=>{if(document.hidden)setPlaying(false);syncMotion()});
  $('theme-toggle').addEventListener('click',()=>{const next=effectiveTheme()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',next);try{localStorage.setItem('nota.theme', JSON.stringify(next))}catch{}syncTheme()});systemTheme.addEventListener('change',syncTheme);
  const evidenceToggle=document.createElement('button');evidenceToggle.id='evidenceToggle';evidenceToggle.type='button';evidenceToggle.setAttribute('aria-controls','deckEvidence');evidenceToggle.setAttribute('aria-expanded','false');document.querySelector('.controls').append(evidenceToggle);
  evidenceToggle.addEventListener('click',()=>{const panel=$('deckEvidence');panel.hidden=!panel.hidden;evidenceToggle.setAttribute('aria-expanded',String(!panel.hidden));});
  current=safe(location.hash.match(/^#slide-(\d+)$/)?.[1]);setLanguage(language);

})();
</script><script data-nota-navigation>
(() => {
  const menu = document.querySelector('.nota-menu');
  if (!menu) return;
  const mobile = matchMedia('(max-width: 700px)');
  const sync = () => { menu.open = !mobile.matches; };
  sync();
  mobile.addEventListener('change', sync);
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && mobile.matches && menu.open) {
      menu.open = false;
      menu.querySelector('summary').focus();
    }
  });
  document.addEventListener('click', event => {
    if (mobile.matches && menu.open && !menu.contains(event.target)) menu.open = false;
  });
})();
</script>

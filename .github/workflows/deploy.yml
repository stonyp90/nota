# Deploy — build + ship Nota to AWS on every push to main, using short-lived
# credentials obtained through OIDC (aws-actions/configure-aws-credentials).
# No long-lived AWS access keys are stored in GitHub.
#
# Configuration lives in GitHub Actions *variables* (not secrets — none of
# these are sensitive; they are public identifiers). Set them once with:
#
#   gh variable set AWS_DEPLOY_ROLE_ARN --repo stonyp90/nota \
#     --body "arn:aws:iam::436136277668:role/nota-github-deploy"   # from `terraform output github_deploy_role_arn`
#   gh variable set WEB_BUCKET          --repo stonyp90/nota --body "nota-web-17087f79"
#   gh variable set CF_DISTRIBUTION_ID  --repo stonyp90/nota --body "E1Z4E4PF2FD9VG"
#
# Required variables:
#   AWS_DEPLOY_ROLE_ARN  - the OIDC deploy role ARN (terraform output)
#   WEB_BUCKET           - S3 web assets bucket name
#   CF_DISTRIBUTION_ID   - CloudFront distribution id

name: Deploy

on:
  push:
    branches: [main]

# OIDC needs id-token: write to mint the token; contents: read to checkout.
permissions:
  id-token: write
  contents: read

# Never run two deploys against the same environment at once; let the newest
# push win but don't cancel a deploy mid-flight (could leave assets half-synced).
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ca-central-1

jobs:
  # Les trois gardes (tests rapides · parcours navigateur · Terraform) vivent
  # dans ci.yml et sont APPELÉES ici, pour que le contrôle pré-fusion, la
  # livraison publique et la livraison admin partagent une seule définition.
  # Elles ne demandent que la lecture du dépôt : le jeton OIDC reste au seul
  # job qui parle à AWS.
  checks:
    name: Gardes avant livraison
    uses: ./.github/workflows/ci.yml
    with:
      e2e: true
    permissions:
      contents: read

  deploy:
    name: Build + deploy to AWS
    # Gate the ship on the fast suite, the browser journeys AND the infra
    # validation: a red in any of the three means nothing reaches production.
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Build web (SPA)
        run: npm run build --workspace @nota/web

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          # Fail early if the build produced nothing to deploy.
          if [ ! -d apps/web/dist ] || [ -z "$(ls -A apps/web/dist)" ]; then
            echo "::error::apps/web/dist is missing or empty — build failed to produce assets" >&2
            exit 1
          fi

      - name: Configure AWS credentials (OIDC — no secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package + deploy the Lambdas (api + reminders)
        shell: bash
        run: |
          set -euo pipefail
          # Vendor EVERY production dependency of @nota/api into the package.
          # `npm ci` hoists them to the ROOT node_modules, so a naive zip of
          # apps/api ships an EMPTY node_modules. Until 2026-09-03 only
          # @nota/domain was hand-copied: `stripe` (required lazily by
          # stripe-port.js) never reached the Lambda, and the AWS SDK rode on
          # whatever copy the runtime happened to bundle. The resolved
          # production tree (dev deps excluded) is copied through symlinks
          # (-L) so the workspace-linked domain comes along too.
          rm -rf apps/api/node_modules
          npm ls --omit=dev --all --parseable --workspace @nota/api 2>/dev/null \
            | grep '/node_modules/' | sort -u \
            | while read -r p; do
                rel="${p#*/node_modules/}"
                case "$rel" in @nota/api) continue ;; esac   # the package itself
                mkdir -p "apps/api/node_modules/$(dirname "$rel")"
                cp -RL "$p" "apps/api/node_modules/$rel"
              done

          # LE GARDE-FOU NE REGARDAIT QUE TROIS DÉPENDANCES SUR SEPT
          # (corrigé le 2026-09-04). Il vérifiait stripe, @nota/domain et
          # @aws-sdk/client-dynamodb en dur ; @aws-sdk/client-s3 et
          # @aws-sdk/s3-request-presigner — dont dépend le port de stockage des
          # documents (ADR 0032) — n'étaient vérifiés nulle part, et toute
          # dépendance ajoutée plus tard échappait au contrôle par construction.
          # La liste se lit maintenant DANS apps/api/package.json : ajouter une
          # dépendance ajoute son garde-fou.
          deps=$(node -p 'Object.keys(require("./apps/api/package.json").dependencies || {}).join(" ")')
          test -n "$deps"
          missing=""
          for dep in $deps; do
            [ -f "apps/api/node_modules/$dep/package.json" ] || missing="$missing $dep"
          done
          if [ -n "$missing" ]; then
            echo "::error::dépendances de production absentes du paquet Lambda :$missing" >&2
            exit 1
          fi
          # Le domaine est un lien d'espace de travail : on vérifie en plus que
          # cp -RL a bien déréférencé le lien et copié le code lui-même.
          test -f apps/api/node_modules/@nota/domain/index.js

          # Tests and their fixtures never run in production — keep the zip lean.
          ( cd apps/api && zip -qr /tmp/api.zip . -x '*.git*' 'test/*' 'test-support/*' 'node_modules/@nota/domain/test/*' )
          ls -la /tmp/api.zip
          aws lambda update-function-code \
            --function-name nota-api \
            --zip-file fileb:///tmp/api.zip \
            --publish

          # LES RAPPELS TOURNAIENT DU CODE FIGÉ (corrigé le 2026-09-02).
          #
          # `nota-reminders` porte `ignore_changes = [filename, source_code_hash]`
          # dans infra/notifications.tf — Terraform ne touche donc jamais à son
          # code, c'est délibéré et c'est la bonne règle. Mais AUCUN workflow ne
          # le mettait à jour non plus : son code datait du dernier `apply`
          # antérieur, et il envoyait chaque jour des courriels écrits à partir
          # d'un gabarit que le dépôt avait déjà corrigé.
          #
          # Le même paquet sert les deux fonctions : `reminders.js` vit dans
          # apps/api et importe le même domaine vendoré ci-dessus.
          aws lambda update-function-code \
            --function-name nota-reminders \
            --zip-file fileb:///tmp/api.zip \
            --publish

      - name: Sync web assets to S3
        shell: bash
        run: |
          set -euo pipefail
          # UN AN D'IMMUABLE SUR DES FICHIERS QUI CHANGENT (corrigé le
          # 2026-09-04). La synchro posait `max-age=31536000, immutable` sur
          # TOUT sauf index.html, sw.js, robots.txt et sitemap.xml. Or
          # llms.txt, les deux manifestes, og.png, og.svg, favicon.svg et les
          # icônes gardent leur nom d'un déploiement à l'autre : une og.png
          # corrigée restait épinglée un an dans les navigateurs — ce qui a
          # déjà mordu le projet une fois, quand og.png portait une
          # affirmation fausse.
          #
          # La règle est donc inversée : le défaut est COURT, et seul ce dont
          # le nom porte l'empreinte du contenu est promu immuable.
          #
          # Passe 1 — tout, en cache court. --delete élague les fichiers
          # empreintés du build précédent. index.html et sw.js sont exclus pour
          # qu'ils ne portent JAMAIS, même une seconde, autre chose que
          # no-cache ; --delete ne les efface pas non plus, et la passe 3 les
          # republie de toute façon.
          aws s3 sync apps/web/dist "s3://${{ vars.WEB_BUCKET }}" \
            --delete \
            --cache-control "public,max-age=3600" \
            --exclude index.html \
            --exclude sw.js

          # Passe 2 — les seuls fichiers dont le NOM change avec les octets
          # (apps/web/build.mjs les renomme app.<10 hex>.js, styles.<…>.css…).
          # Un navigateur ne peut donc jamais servir une version périmée sous
          # un nom courant : eux seuls méritent l'année immuable.
          hashed=$(find apps/web/dist -maxdepth 1 -type f | grep -E '\.[0-9a-f]{10}\.(js|css)$' || true)
          if [ -z "$hashed" ]; then
            echo "::error::aucun asset empreinté dans apps/web/dist — le build a changé de forme, la règle de cache ne tient plus" >&2
            exit 1
          fi
          for f in $hashed; do
            aws s3 cp "$f" "s3://${{ vars.WEB_BUCKET }}/$(basename "$f")" \
              --cache-control "public,max-age=31536000,immutable"
          done

          # Passe 3 — index.html et sw.js : jamais mis en cache. Ce sont les
          # deux fichiers non empreintés qui DÉSIGNENT les empreintes courantes ;
          # un déploiement doit être vu tout de suite.
          aws s3 cp apps/web/dist/index.html "s3://${{ vars.WEB_BUCKET }}/index.html" \
            --cache-control "no-cache"
          # sw.js is optional — only upload it if the build emitted one.
          if [ -f apps/web/dist/sw.js ]; then
            aws s3 cp apps/web/dist/sw.js "s3://${{ vars.WEB_BUCKET }}/sw.js" \
              --cache-control "no-cache"
          fi

      - name: Invalidate CloudFront cache
        shell: bash
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}" \
            --paths "/*"

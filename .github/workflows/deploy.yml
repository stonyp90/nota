# Deploy — build + ship Nota to AWS on every push to main, using short-lived
# credentials obtained through OIDC (aws-actions/configure-aws-credentials).
# No long-lived AWS access keys are stored in GitHub.
#
# Configuration lives in GitHub Actions *variables* (not secrets — none of
# these are sensitive; they are public identifiers). Set them once with:
#
#   gh variable set AWS_DEPLOY_ROLE_ARN --repo stonyp90/nota \
#     --body "arn:aws:iam::436136277668:role/nota-github-deploy"   # from `terraform output github_deploy_role_arn`
#   gh variable set WEB_BUCKET          --repo stonyp90/nota --body "nota-web-17087f79"
#   gh variable set CF_DISTRIBUTION_ID  --repo stonyp90/nota --body "E1Z4E4PF2FD9VG"
#
# Required variables:
#   AWS_DEPLOY_ROLE_ARN  - the OIDC deploy role ARN (terraform output)
#   WEB_BUCKET           - S3 web assets bucket name
#   CF_DISTRIBUTION_ID   - CloudFront distribution id

name: Deploy

on:
  push:
    branches: [main]

# OIDC needs id-token: write to mint the token; contents: read to checkout.
permissions:
  id-token: write
  contents: read

# Never run two deploys against the same environment at once; let the newest
# push win but don't cancel a deploy mid-flight (could leave assets half-synced).
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ca-central-1

jobs:
  test:
    name: Tests (domain + api + contract + BDD + web + admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Unit tests (domain + api)
        run: npm test

      - name: BDD suite (Cucumber)
        run: npm ci --prefix features && npm test --prefix features

      - name: Web smoke test (jsdom)
        run: npm test --workspace @nota/web

      - name: Admin console tests (jsdom + dev proxy)
        run: npm test --workspace @nota/admin

  # L6 — the only slow layer, kept OFF pull requests (see ci.yml) and run here
  # on the push to main, BEFORE the deploy job, so a broken critical journey
  # blocks the ship. Playwright boots the demo API + web itself (webServer in
  # playwright.config.js); CI=true makes it start fresh servers on clean ports.
  e2e:
    name: E2E browser journeys (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run critical journeys (client booking, notary sign-in, partner claim, home numbers)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The infra that the code ships INTO. ci.yml validates Terraform on branches
  # only, and since everything lands directly on main, nothing validated the
  # infra of a shipped commit (2026-09-03 audit). fmt + validate are cheap
  # (no backend, no credentials) and catch a broken .tf before the next apply.
  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Format check
        run: terraform -chdir=infra fmt -check

      - name: Init (no backend)
        run: terraform -chdir=infra init -backend=false

      - name: Validate
        run: terraform -chdir=infra validate

  deploy:
    name: Build + deploy to AWS
    # Gate the ship on the fast suite, the browser journeys AND the infra
    # validation: a red in any of the three means nothing reaches production.
    needs: [test, e2e, terraform]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Build web (SPA)
        run: npm run build --workspace @nota/web

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          # Fail early if the build produced nothing to deploy.
          if [ ! -d apps/web/dist ] || [ -z "$(ls -A apps/web/dist)" ]; then
            echo "::error::apps/web/dist is missing or empty — build failed to produce assets" >&2
            exit 1
          fi

      - name: Configure AWS credentials (OIDC — no secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package + deploy the Lambdas (api + reminders)
        shell: bash
        run: |
          set -euo pipefail
          # Vendor EVERY production dependency of @nota/api into the package.
          # `npm ci` hoists them to the ROOT node_modules, so a naive zip of
          # apps/api ships an EMPTY node_modules. Until 2026-09-03 only
          # @nota/domain was hand-copied: `stripe` (required lazily by
          # stripe-port.js) never reached the Lambda, and the AWS SDK rode on
          # whatever copy the runtime happened to bundle. The resolved
          # production tree (dev deps excluded) is copied through symlinks
          # (-L) so the workspace-linked domain comes along too.
          rm -rf apps/api/node_modules
          npm ls --omit=dev --all --parseable --workspace @nota/api 2>/dev/null \
            | grep '/node_modules/' | sort -u \
            | while read -r p; do
                rel="${p#*/node_modules/}"
                case "$rel" in @nota/api) continue ;; esac   # the package itself
                mkdir -p "apps/api/node_modules/$(dirname "$rel")"
                cp -RL "$p" "apps/api/node_modules/$rel"
              done
          test -f apps/api/node_modules/stripe/package.json
          test -f apps/api/node_modules/@nota/domain/index.js
          test -f apps/api/node_modules/@aws-sdk/client-dynamodb/package.json
          # Tests and their fixtures never run in production — keep the zip lean.
          ( cd apps/api && zip -qr /tmp/api.zip . -x '*.git*' 'test/*' 'test-support/*' 'node_modules/@nota/domain/test/*' )
          ls -la /tmp/api.zip
          aws lambda update-function-code \
            --function-name nota-api \
            --zip-file fileb:///tmp/api.zip \
            --publish

          # LES RAPPELS TOURNAIENT DU CODE FIGÉ (corrigé le 2026-09-02).
          #
          # `nota-reminders` porte `ignore_changes = [filename, source_code_hash]`
          # dans infra/notifications.tf — Terraform ne touche donc jamais à son
          # code, c'est délibéré et c'est la bonne règle. Mais AUCUN workflow ne
          # le mettait à jour non plus : son code datait du dernier `apply`
          # antérieur, et il envoyait chaque jour des courriels écrits à partir
          # d'un gabarit que le dépôt avait déjà corrigé.
          #
          # Le même paquet sert les deux fonctions : `reminders.js` vit dans
          # apps/api et importe le même domaine vendoré ci-dessus.
          aws lambda update-function-code \
            --function-name nota-reminders \
            --zip-file fileb:///tmp/api.zip \
            --publish

      - name: Sync web assets to S3
        shell: bash
        run: |
          set -euo pipefail
          # JS/CSS are content-hashed by the build (app.<hash>.js …), so their
          # names change whenever their bytes do — cache them immutably for a
          # year. Stable icons ride along. index.html + sw.js are the un-hashed
          # source of truth that points at the current hashes: never cache them,
          # so a new deploy is picked up immediately. --delete prunes the prior
          # build's hashed files. /* is still invalidated at the end.
          aws s3 sync apps/web/dist "s3://${{ vars.WEB_BUCKET }}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude index.html \
            --exclude sw.js \
            --exclude robots.txt \
            --exclude sitemap.xml
          # SEO text files change without a hash — keep them only briefly cached.
          for f in robots.txt sitemap.xml; do
            if [ -f "apps/web/dist/$f" ]; then
              aws s3 cp "apps/web/dist/$f" "s3://${{ vars.WEB_BUCKET }}/$f" \
                --cache-control "public,max-age=3600"
            fi
          done
          aws s3 cp apps/web/dist/index.html "s3://${{ vars.WEB_BUCKET }}/index.html" \
            --cache-control "no-cache"
          # sw.js is optional — only upload it if the build emitted one.
          if [ -f apps/web/dist/sw.js ]; then
            aws s3 cp apps/web/dist/sw.js "s3://${{ vars.WEB_BUCKET }}/sw.js" \
              --cache-control "no-cache"
          fi

      - name: Invalidate CloudFront cache
        shell: bash
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}" \
            --paths "/*"

name: CI

# Fast pre-merge checks (tests + terraform validate, NO deploy). Runs on pull
# requests and on pushes to any branch EXCEPT main — pushes to main are covered
# by deploy.yml, which runs the same test suite before shipping, so ignoring
# main here avoids a redundant duplicate run.
on:
  push:
    branches-ignore: [main]
  pull_request:

# Cancel superseded runs on the same ref to keep the queue fast.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (domain + api + BDD + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Unit tests (domain + api)
        run: npm test

      - name: BDD suite (Cucumber)
        run: npm install --prefix features && npm test --prefix features

      - name: Web smoke test (jsdom)
        run: npm test --workspace @nota/web

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Format check
        run: terraform -chdir=infra fmt -check

      - name: Init (no backend)
        run: terraform -chdir=infra init -backend=false

      - name: Validate
        run: terraform -chdir=infra validate

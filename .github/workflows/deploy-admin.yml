# Deploy Admin — build + ship the Nota ADMIN surface (admin.nota.ca) to AWS.
#
# Mirrors deploy.yml (OIDC short-lived creds, no long-lived keys), but for the
# SEPARATE admin stack authored in infra/admin.tf + infra/admin-cdn.tf. That
# stack only exists when Terraform is applied with enable_admin = true; this
# workflow does NOT create infrastructure — it publishes code/assets into it.
#
# GATING (defence in depth):
#   1. Triggers only via manual dispatch OR pushes to main that touch the admin
#      SPA / shared api bundle / the shared dependency tree (path filter below).
#   2. The ship waits on the SAME three gates as the public deploy — tests,
#      Playwright journeys, Terraform fmt+validate — called from ci.yml.
#      Jusqu'au 2026-09-04 cette porte-ci n'en franchissait qu'une (`needs:
#      test`). Les deux Lambdas embarquent pourtant le MÊME paquet apps/api :
#      la console pouvait donc livrer du code API que le navigateur ou
#      Terraform auraient refusé côté public.
#   3. The deploy job runs in the GitHub Environment "admin-production". That
#      environment currently has NO required reviewers — verified 2026-09-03 via
#      `gh api repos/stonyp90/nota/environments` (protection_rules: []) — so an
#      admin deploy ships WITHOUT a human approval. This is the owner's explicit
#      choice (2026-09-03): everything that lands on main goes to production.
#      The environment still earns its keep: it is what the OIDC role's trust
#      policy binds to (point 4). To require an approval later, add yourself as
#      a required reviewer in repo Settings -> Environments -> admin-production;
#      no workflow change is needed, and this comment must then be updated.
#   4. The AWS role it assumes (ADMIN_DEPLOY_ROLE_ARN) is a dedicated
#      least-privilege OIDC role whose trust policy only accepts the
#      "admin-production" environment (see aws_iam_role.admin_github_deploy).
#
# Required GitHub Actions *variables* (public identifiers, not secrets) — from
# `terraform output` after applying with enable_admin = true:
#   gh variable set ADMIN_DEPLOY_ROLE_ARN    --repo stonyp90/nota --body "$(terraform -chdir=infra output -raw admin_github_deploy_role_arn)"
#   gh variable set ADMIN_WEB_BUCKET         --repo stonyp90/nota --body "$(terraform -chdir=infra output -raw admin_web_bucket)"
#   gh variable set ADMIN_CF_DISTRIBUTION_ID --repo stonyp90/nota --body "$(terraform -chdir=infra output -raw admin_cloudfront_distribution_id)"
#   gh variable set ADMIN_LAMBDA_NAME        --repo stonyp90/nota --body "$(terraform -chdir=infra output -raw admin_lambda_name)"

name: Deploy Admin

on:
  # The admin surface is stood up (Terraform applied with enable_admin = true,
  # the four ADMIN_* repo variables set, two green dispatched deploys) — so
  # since 2026-09-03 a push to main that touches the console, the shared api
  # bundle or the domain ships it, exactly like the public surface. The manual
  # dispatch stays for a re-ship without a code change.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/admin/**
      - apps/api/**
      - packages/domain/**
      # LES DEUX LAMBDAS POUVAIENT DÉRIVER (corrigé le 2026-09-04). Un
      # changement de dépendance qui ne touche QUE le verrou — un `npm install`
      # qui remonte une version, un correctif de sécurité transitif — ne
      # passait aucun de ces filtres. La Lambda publique repartait alors sur le
      # nouvel arbre de dépendances et la Lambda admin restait sur l'ancien,
      # alors qu'elles embarquent le même paquet apps/api.
      - package.json
      - package-lock.json
      - .github/workflows/deploy-admin.yml
      # Les gardes elles-mêmes : si elles changent, on revalide et on relivre.
      - .github/workflows/ci.yml

# OIDC needs id-token: write to mint the token; contents: read to checkout.
permissions:
  id-token: write
  contents: read

# Never run two admin deploys at once; newest wins but don't cancel mid-flight.
concurrency:
  group: deploy-admin-production
  cancel-in-progress: false

env:
  AWS_REGION: ca-central-1

jobs:
  # Exactement les mêmes gardes que la livraison publique, et la MÊME
  # définition : ci.yml. Rien à réinventer ici, donc rien qui puisse diverger.
  checks:
    name: Gardes avant livraison
    uses: ./.github/workflows/ci.yml
    with:
      e2e: true
    permissions:
      contents: read

  deploy:
    name: Build + deploy admin to AWS
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The environment the OIDC trust policy binds to (infra/admin.tf: the role
    # only accepts `...:environment:admin-production`). It carries NO required
    # reviewer today — see the GATING note at the top of this file.
    environment: admin-production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Build admin (SPA)
        run: node apps/admin/build.mjs

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          # Fail early if the build produced nothing to deploy.
          if [ ! -d apps/admin/dist ] || [ -z "$(ls -A apps/admin/dist)" ]; then
            echo "::error::apps/admin/dist is missing or empty — admin build failed to produce assets" >&2
            exit 1
          fi

      - name: Configure AWS credentials (OIDC — no secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ADMIN_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package + deploy the admin Lambda
        shell: bash
        run: |
          set -euo pipefail
          # The admin Lambda ships the SAME apps/api bundle as the public API
          # (handler admin.handler), vendored the same way as deploy.yml: the
          # whole production dependency tree, through symlinks, tests excluded.
          rm -rf apps/api/node_modules
          npm ls --omit=dev --all --parseable --workspace @nota/api 2>/dev/null \
            | grep '/node_modules/' | sort -u \
            | while read -r p; do
                rel="${p#*/node_modules/}"
                case "$rel" in @nota/api) continue ;; esac   # the package itself
                mkdir -p "apps/api/node_modules/$(dirname "$rel")"
                cp -RL "$p" "apps/api/node_modules/$rel"
              done

          # Même garde-fou que deploy.yml, et pour la même raison : la liste des
          # dépendances de production se lit DANS apps/api/package.json plutôt
          # que d'être recopiée à la main. Ici elle ne couvrait que deux noms
          # sur sept — @aws-sdk/client-s3 et @aws-sdk/s3-request-presigner, dont
          # dépend le port de stockage des documents (ADR 0032), n'étaient
          # vérifiés nulle part.
          deps=$(node -p 'Object.keys(require("./apps/api/package.json").dependencies || {}).join(" ")')
          test -n "$deps"
          missing=""
          for dep in $deps; do
            [ -f "apps/api/node_modules/$dep/package.json" ] || missing="$missing $dep"
          done
          if [ -n "$missing" ]; then
            echo "::error::dépendances de production absentes du paquet Lambda :$missing" >&2
            exit 1
          fi
          test -f apps/api/node_modules/@nota/domain/index.js

          ( cd apps/api && zip -qr /tmp/admin-api.zip . -x '*.git*' 'test/*' 'test-support/*' 'node_modules/@nota/domain/test/*' )
          ls -la /tmp/admin-api.zip
          aws lambda update-function-code \
            --function-name "${{ vars.ADMIN_LAMBDA_NAME }}" \
            --zip-file fileb:///tmp/admin-api.zip \
            --publish

      - name: Sync admin assets to S3
        shell: bash
        run: |
          set -euo pipefail
          # Même règle de cache que la surface publique, inversée le 2026-09-04 :
          # le défaut est COURT, et seul ce dont le nom porte l'empreinte du
          # contenu est promu immuable. favicon.svg et robots.txt gardent leur
          # nom d'un déploiement à l'autre — ils prenaient pourtant l'année
          # immuable de la synchro en masse (robots.txt exclu à part).
          #
          # Passe 1 — tout, en cache court. --delete élague les fichiers
          # empreintés du build précédent. index.html est exclu pour qu'il ne
          # porte JAMAIS autre chose que no-cache ; la passe 3 le republie.
          aws s3 sync apps/admin/dist "s3://${{ vars.ADMIN_WEB_BUCKET }}" \
            --delete \
            --cache-control "public,max-age=3600" \
            --exclude index.html

          # Passe 2 — les seuls fichiers dont le NOM change avec les octets
          # (apps/admin/build.mjs les renomme admin.<10 hex>.js, tokens.<…>.css…).
          hashed=$(find apps/admin/dist -maxdepth 1 -type f | grep -E '\.[0-9a-f]{10}\.(js|css)$' || true)
          if [ -z "$hashed" ]; then
            echo "::error::aucun asset empreinté dans apps/admin/dist — le build a changé de forme, la règle de cache ne tient plus" >&2
            exit 1
          fi
          for f in $hashed; do
            aws s3 cp "$f" "s3://${{ vars.ADMIN_WEB_BUCKET }}/$(basename "$f")" \
              --cache-control "public,max-age=31536000,immutable"
          done

          # Passe 3 — index.html : jamais mis en cache. C'est le seul fichier
          # non empreinté qui DÉSIGNE les empreintes courantes.
          aws s3 cp apps/admin/dist/index.html "s3://${{ vars.ADMIN_WEB_BUCKET }}/index.html" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        shell: bash
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.ADMIN_CF_DISTRIBUTION_ID }}" \
            --paths "/*"

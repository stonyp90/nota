# docker-compose.yml — the whole Nota stack, locally, with NO AWS account.
#
#     docker compose up
#
# brings up DynamoDB Local, creates the two tables, SEEDS them with the demo
# world, runs both APIs against them, and serves both front ends — a
# self-contained mirror of the same-origin CloudFront layout you can iterate on
# independently.
#
# Two things this file is deliberately opinionated about, because the local
# stack had silently lied about both:
#
#   1. IT IS SEEDED. `create-table.js` only ever creates tables, and the dev
#      servers seed their in-memory branch only (`useDynamo = !!TABLE_NAME`),
#      which docker never takes — so a cold start used to serve an empty carnet
#      and an empty admin console. The one-shot `seed` service writes the demo
#      world through the real DynamoDB adapter, and the APIs wait for it.
#      Re-run it whenever: `docker compose run --rm seed`.
#
#   2. IT PICKS UP EDITS. Every node service runs under `dev-watch.js`, which
#      polls a content digest of the source (`node --watch` relies on inotify
#      and never fires for a host write over a bind mount). Each API also stamps
#      that digest on every response as `x-nota-source`, so if a process ever
#      does go stale, `npm run local:check` names it instead of an agent
#      trusting a two-day-old answer.
#
# The data survives a restart: DynamoDB Local and MinIO both write to named
# volumes. `docker compose down -v` is the deliberate way to start clean.
name: nota

services:
  # DynamoDB Local — the single-table backing store on :8000. -sharedDb makes
  # every client see the same table regardless of credentials.
  #
  # -dbPath, NOT -inMemory: with the old flag every table, every offer and every
  # seeded notary vanished on `docker compose restart`, so the stack was
  # unusable for anything spanning a restart and nothing said why. The data now
  # lives in a named volume. `user: root` because the image's default user
  # cannot create the file inside a fresh volume.
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    user: root
    working_dir: /home/dynamodblocal
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    ports:
      - "8000:8000"

  # MinIO — un stockage compatible S3, pour que la messagerie porte des
  # documents EN LOCAL comme en production (ADR 0032). Ce n'est pas un décor :
  # c'est la preuve que le port de stockage est réellement portable — le même
  # adaptateur, un autre fournisseur, zéro ligne changée ailleurs.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    # Same reason as DynamoDB: a document deposited through the messagerie
    # (ADR 0032) must still be there after a restart.
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: local
      MINIO_ROOT_PASSWORD: locallocal
    # Publié sur 9100/9101 : le port 9000 est souvent déjà pris sur une machine
    # de développement. L'adresse INTERNE reste http://minio:9000, donc rien ne
    # change pour l'API.
    ports:
      - "9100:9000"
      - "9101:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot : crée le seau des documents. Idempotent.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 local locallocal &&
             mc mb --ignore-existing local/nota-documents &&
             mc anonymous set none local/nota-documents &&
             echo 'seau des documents prêt'"

  # One-shot: install workspace deps into the mounted node_modules, then create
  # the "nota" table (idempotent) and exit. Retries until DynamoDB Local answers.
  dynamo-init:
    image: node:20-alpine
    working_dir: /repo
    volumes:
      - ./:/repo
    environment:
      TABLE_NAME: nota
      ADMIN_TABLE_NAME: nota-admin
      DYNAMO_ENDPOINT: http://dynamodb-local:8000
      AWS_REGION: ca-central-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: locallocal
    command: >
      sh -c "npm install --no-audit --no-fund &&
             until node apps/api/scripts/create-table.js; do
               echo 'waiting for dynamodb-local...'; sleep 2;
             done"
    depends_on:
      - dynamodb-local

  # One-shot: SEED the tables with the demo world (offers, referral codes,
  # notaries, a 28-day analytics history) through the real DynamoDB adapter.
  # Idempotent — replaying it rewrites the same items and skips the analytics
  # counters it already wrote. Re-run it any time:
  #
  #     docker compose run --rm seed              # same fixtures again
  #     docker compose run --rm seed --force      # analytics history too
  #
  # Without this service the whole stack comes up green and empty.
  seed:
    image: node:20-alpine
    working_dir: /repo
    volumes:
      - ./:/repo
    environment:
      TABLE_NAME: nota
      ADMIN_TABLE_NAME: nota-admin
      DYNAMO_ENDPOINT: http://dynamodb-local:8000
      AWS_REGION: ca-central-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: locallocal
    entrypoint: ["node", "apps/api/scripts/seed.js"]
    depends_on:
      dynamo-init:
        condition: service_completed_successfully

  # The Nota API on :8788, talking to DynamoDB Local. Dummy AWS creds satisfy the
  # SDK; nothing leaves the machine. Starts once the table exists.
  api:
    image: node:20-alpine
    working_dir: /repo
    volumes:
      - ./:/repo
    environment:
      PORT: 8788
      TABLE_NAME: nota
      DYNAMO_ENDPOINT: http://dynamodb-local:8000
      AWS_REGION: ca-central-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: locallocal
      # ADR 0032 — la messagerie porte des documents. Sans ces deux variables,
      # les portes de document répondent 503 et la messagerie reste texte.
      NOTA_DOCS_BUCKET: nota-documents
      NOTA_DOCS_ENDPOINT: http://minio:9000
      # L'adresse que le NAVIGATEUR atteint. Elle diffère de l'interne ici, et
      # c'est ce qui rend la pile locale fidèle : la signature couvre l'hôte,
      # donc c'est celle-ci qui doit signer.
      NOTA_DOCS_PUBLIC_ENDPOINT: http://localhost:9100
      # Pile de DÉVELOPPEMENT : le lien magique est renvoyé dans la réponse et
      # la porte notaire s'ouvre sans compte Stripe. Le handler refuse les deux
      # dès que NODE_ENV vaut « production » — ce n'est pas une porte dérobée,
      # c'est un mode explicitement borné.
      NOTA_DEMO_OPEN: "true"
      # L'origine que le NAVIGATEUR atteint : c'est elle qui doit figurer dans
      # les liens des courriels (#cauth=, #nauth=, #pauth=), pas l'adresse
      # interne du conteneur. Sans elle, les liens partaient vides.
      NOTA_SITE_URL: http://localhost:4173
      # La pile locale n'avait aucun mailer : tout ce qui passe par le courriel
      # était intestable ici. Les messages sont écrits dans ce dossier (monté
      # depuis le dépôt) et le lien est imprimé dans les logs du conteneur.
      NOTA_LOCAL_MAIL_DIR: /repo/.local-mail
      # ADR 0045 — le fournisseur d'identité. L'émetteur est l'adresse PUBLIQUE
      # du royaume (celle que le navigateur atteint), parce que c'est elle qui
      # signe la claim `iss` du jeton et donc celle que la vérification exige.
      # Sans ces variables, /auth/keycloak/* répond 503 et le reste de l'API ne
      # change pas d'un pouce.
      NOTA_KEYCLOAK_ISSUER: http://localhost:8081/realms/nota
      NOTA_KEYCLOAK_CLIENT_ID: nota-web
      # ADR 0046 — l'assistant de la messagerie. La clé se passe depuis le shell
      # (`export ANTHROPIC_API_KEY=...` puis `docker compose up`) et n'est
      # JAMAIS écrite ici : ce fichier est versionné. Sans clé, la messagerie
      # locale se comporte comme un déploiement non configuré — aucune réponse
      # automatique, la question part au « courriel » de l'opérateur, qui
      # atterrit dans .local-mail/. C'est la même dégradation qu'en production,
      # et c'est donc testable localement dans les deux états.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NOTA_ASSISTANT_MODEL: ${NOTA_ASSISTANT_MODEL:-}
      NOTA_ASSISTANT_TIMEOUT_MS: ${NOTA_ASSISTANT_TIMEOUT_MS:-12000}
      # Le prénom que l'assistant nomme en passant la main. Vide : « Nota ».
      NOTA_OPERATOR_NAME: ${NOTA_OPERATOR_NAME:-}
      NOTA_OPERATOR_EMAIL: ${NOTA_OPERATOR_EMAIL:-operateur@nota.local}
    # Under the watcher, never bare `node`: a bare process serves whatever it
    # required at boot, and this stack was caught answering with two-day-old
    # code while the tree had moved on. See apps/api/scripts/dev-watch.js.
    command: ["node", "apps/api/scripts/dev-watch.js", "apps/api/local-server.js"]
    ports:
      - "8788:8788"
    depends_on:
      seed:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  # The static web app on :4173. Zero runtime deps — plain node:http, no install.
  web:
    image: node:20-alpine
    working_dir: /repo
    volumes:
      - ./:/repo
    environment:
      PORT: 4173
      # public/ is re-read on every request, so only the server file itself can
      # go stale — watching the whole app would be a pointless digest of 2 MB.
      NOTA_WATCH_PATHS: apps/web/run-local.mjs
    command: ["node", "apps/api/scripts/dev-watch.js", "apps/web/run-local.mjs"]
    ports:
      - "4173:4173"
    depends_on:
      - api

  # The ADMIN API on :8790 — the admin.nota.ca Lambda, locally, against the same
  # DynamoDB Local plus the separate nota-admin table (mirroring production's
  # two-table split). Magic links are echoed in the response (devEcho) and land
  # on the admin console below.
  admin-api:
    image: node:20-alpine
    working_dir: /repo
    volumes:
      - ./:/repo
    environment:
      PORT: 8790
      TABLE_NAME: nota
      ADMIN_TABLE_NAME: nota-admin
      DYNAMO_ENDPOINT: http://dynamodb-local:8000
      AWS_REGION: ca-central-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: locallocal
      NOTA_ADMIN_BASE_URL: http://localhost:4174
      # Hors production, la porte admin renvoie le lien magique dans la réponse
      # (devLink) : la console s'ouvre sans boîte aux lettres. L'adresse par
      # défaut est admin@nota.local — NOTA_ADMIN_EMAILS la remplace.
      NOTA_ADMIN_EMAILS: admin@nota.local
    command: ["node", "apps/api/scripts/dev-watch.js", "apps/api/admin-local-server.js"]
    ports:
      - "8790:8790"
    depends_on:
      seed:
        condition: service_completed_successfully

  # The admin console on :4174, proxying /api/* same-origin to admin-api —
  # the same layout CloudFront gives admin.nota.ca.
  admin:
    image: node:20-alpine
    working_dir: /repo
    volumes:
      - ./:/repo
    environment:
      PORT: 4174
      NOTA_ADMIN_API: http://admin-api:8790
      NOTA_WATCH_PATHS: apps/admin/run-local.mjs,apps/admin/dev-server.mjs
    command: ["node", "apps/api/scripts/dev-watch.js", "apps/admin/run-local.mjs"]
    ports:
      - "4174:4174"
    depends_on:
      - admin-api

  # Keycloak — le fournisseur d'identité qui NE CAPTE QUE LE COURRIEL (ADR 0045).
  #
  # Le royaume importé (docker/keycloak/realm-nota.json) pose trois choses et
  # elles portent toute la décision : `verifyEmail: false` (c'est NOTRE base qui
  # prouve l'adresse, pas Keycloak), l'adresse comme seul identifiant, et un
  # client public avec PKCE obligatoire.
  #
  # Sur 8081, pas 8080 : le port 8080 est déjà pris par Docker Desktop sur une
  # machine de développement, et un port occupé fait échouer `up` sans dire
  # pourquoi. Le mode `start-dev` garde une base H2 embarquée — c'est une pile
  # locale, pas une production ; le volume nommé la fait survivre au restart,
  # comme DynamoDB et MinIO.
  #
  # AUCUN autre service ne dépend de lui : l'API répond 503 sur les routes
  # Keycloak quand l'émetteur n'est pas configuré, et tout le reste de la pile
  # (carnet, console, messagerie) continue de fonctionner sans lui. Le lien
  # magique de l'ADR 0026 reste la porte des cinq autres mécaniques.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # L'émetteur que le NAVIGATEUR atteint. C'est lui qui figure dans la
      # claim `iss` du jeton, donc c'est lui que l'API doit exiger — la même
      # distinction interne/publique que NOTA_DOCS_PUBLIC_ENDPOINT.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data
    ports:
      - "8081:8081"

volumes:
  # Named, so a restart is a restart and not a wipe. `docker compose down -v`
  # is the explicit way to throw the demo world away and re-seed from zero.
  dynamodb-data:
  minio-data:
  keycloak-data:

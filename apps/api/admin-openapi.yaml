openapi: 3.1.0
info:
  title: Nota Admin API
  version: 0.1.0
  description: >-
    HTTP API for the Nota admin console (admin.nota.ca). A separate surface from
    the public API — its own Lambda (apps/api/admin.js), its own signing secret,
    read-only IAM on the customer table and read/write only on the separate
    admin table. Auth is a passwordless magic link: request → e-mailed
    single-use link → short-lived server-backed session presented as a Bearer
    token on every call. Responses never reveal whether an address is an admin
    (no account enumeration), and every response carries
    `X-Robots-Tag: noindex`.


    NOTE: this specification is kept in sync with
    `apps/api/src/admin-handler.js` **by hand** for now. When a route or field
    changes there, update it here in the same change (see AGENTS.md).
  license:
    name: UNLICENSED
servers:
  - url: /api
    description: Same-origin path fronted by the admin CloudFront distribution.
  - url: http://localhost:8790
    description: Local dev admin API (apps/api/admin-local-server.js).
components:
  securitySchemes:
    adminSession:
      type: http
      scheme: bearer
      description: >-
        Admin session token minted by `/admin/auth/verify`. A valid signature is
        necessary but not sufficient — the server-side session must exist, be
        un-revoked, inside its 12 h absolute window and not idle past 30 min.
  schemas:
    AdminGroup:
      type: object
      required: [id, nom, permissions]
      properties:
        id: { type: string }
        nom: { type: string }
        description: { type: string }
        permissions:
          type: array
          items: { type: string }
        updatedAt: { type: string, format: date-time }
    AdminUser:
      type: object
      required: [email, id, groupes, permissions, effectives, disabled]
      properties:
        email: { type: string, format: email }
        id: { type: string }
        role:
          oneOf:
            - type: string
            - type: "null"
        disabled: { type: boolean }
        groupes:
          type: array
          items: { type: string }
        permissions:
          description: Les permissions accordees DIRECTEMENT a la personne.
          type: array
          items: { type: string }
        effectives:
          description: L'union du role, des grants directs et de chaque groupe.
          type: array
          items: { type: string }
        derniereConnexion:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
    Errors:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code:
                type: string
              message:
                type: string
    CommissionBareme:
      type: object
      description: >-
        The cote-earned split (ADR 0028): the base rate Nota keeps on a
        completed act (at most 15 %), the floor it never crosses however high a
        notary's cote (5 %, so the best notaries keep 95 %), and the ladder —
        each rung a `cote` out of 100 and the `taux` it earns. Rates are
        fractions (0.15 = 15 %).
      required: [taux, plancher, paliers]
      properties:
        taux:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1
        plancher:
          type: number
          minimum: 0
        paliers:
          type: array
          maxItems: 10
          items:
            type: object
            required: [cote, taux]
            properties:
              cote:
                type: integer
                minimum: 1
                maximum: 100
              taux:
                type: number
                minimum: 0
                exclusiveMaximum: 1
    CommissionBaremeStored:
      allOf:
        - $ref: "#/components/schemas/CommissionBareme"
        - type: object
          required: [updatedAt]
          properties:
            updatedAt:
              type: [string, "null"]
              description: ISO datetime of the last change.
    PrixNota:
      type: object
      description: >-
        La GRILLE du prix de Nota (ADR 0034, qui remplace le prix unique de
        l'ADR 0031) : une ligne par service, plus la garantie de date sur sa
        propre ligne, toutes en cents. Ni pourcentage, ni fonction de la valeur
        de l'acte, ni fonction du notaire — l'art. 29.1 du Code de deontologie
        interdit au notaire toute convention mettant en peril son
        desinteressement, et un prix indexe sur une note attribuee par Nota en
        serait une. Le service et le delai, eux, sont deux dimensions PUBLIEES
        que le client connait avant d'offrir. `defaut` est la cellule sur
        laquelle retombe un service hors catalogue — la plus basse.
      required: [defaut, services, garantieDate]
      properties:
        defaut:
          type: integer
          minimum: 0
        services:
          type: object
          additionalProperties:
            type: integer
            minimum: 1
          description: id du service -> prix de Nota, en cents (24900 = 249,00 $).
        garantieDate:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          description: id du palier de delai -> prix de la garantie de date, en cents.
    PrixNotaEdit:
      type: object
      description: >-
        Ce que la console ENVOIE : les seules cellules que Nota decide. Une
        cellule absente reste celle du catalogue. L'ancien corps a prix unique
        `{ prixCents }` (ADR 0031) reste accepte et s'applique a tous les
        services, sans garantie de date.
      properties:
        services:
          type: object
          additionalProperties:
            type: integer
            minimum: 1
        garantieDate:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        prixCents:
          type: integer
          minimum: 1
          description: Ancien contrat (ADR 0031) — un prix unique pour tout le catalogue.
    PrixNotaStored:
      allOf:
        - $ref: "#/components/schemas/PrixNotaEdit"
        - type: object
          required: [updatedAt]
          properties:
            updatedAt:
              type: [string, "null"]
              description: ISO datetime of the last change.
            ignorees:
              type: array
              items: { type: string }
              description: >-
                Les cellules STOCKEES que la tarification ecarte — un service
                retire du catalogue depuis, une valeur devenue illisible. La
                lecture est tolerante la ou l'ecriture est stricte : une cellule
                fautive est ecartee SEULE, jamais la grille entiere, et elle est
                nommee ici (« services.testament ») pour que la console le dise
                au lieu de le taire. Absent quand tout se relit.
    PrixNotaCatalogue:
      type: object
      description: >-
        Les lignes a editer, avec leurs noms — la console admin n'a pas le
        domaine, et sans cet echo elle coderait le catalogue en dur.
      required: [services, garantieDate]
      properties:
        services:
          type: array
          items:
            type: object
            required: [id, nom]
            properties:
              id: { type: string }
              nom: { type: string }
              nomEn: { type: string }
        garantieDate:
          type: array
          items:
            type: object
            required: [id, nom]
            properties:
              id: { type: string }
              nom: { type: string }
              nomEn: { type: string }
              maxJours: { type: [integer, "null"] }
    CancellationBareme:
      type: object
      description: >-
        The late-cancellation fee schedule (ADR 0023): ascending tiers, each a
        maximum number of days left before the signing (`maxJours`) and the
        fraction of the agreed montant retained (`taux`, 0.30 = 30 %). Beyond
        the last tier cancellation is free; an EMPTY list makes cancellation
        free everywhere (the kill-switch is data, not a flag).
      required: [paliers]
      properties:
        paliers:
          type: array
          maxItems: 10
          items:
            type: object
            required: [maxJours, taux]
            properties:
              maxJours:
                type: integer
                minimum: 0
              taux:
                type: number
                exclusiveMinimum: 0
                exclusiveMaximum: 1
    CancellationBaremeStored:
      allOf:
        - $ref: "#/components/schemas/CancellationBareme"
        - type: object
          required: [updatedAt]
          properties:
            updatedAt:
              type: [string, "null"]
              description: ISO datetime of the last change.
    EmailOverride:
      type: object
      description: >-
        The stored per-template override (ADR 0018). `actif: false` is a
        kill-switch — REFUSED on a transactional template, whose suppression
        would be "incomplete" advertising under art. 68 of the Code de
        deontologie. Four bilingual pairs are editable — subject, preheader,
        body paragraph and CTA label — each all-or-nothing across FR/EN, with
        `{{token}}` interpolation limited to the template's declared
        placeholders. HTML is refused at validation AND escaped at render. What
        stays code-guaranteed: the branded layout, the button URL, the CASL
        footer and the unsubscribe plumbing. `enabled` is a deprecated alias of
        `actif`, kept so an already-deployed client does not break.
      required: [key, actif, subjectFr, subjectEn, updatedAt]
      properties:
        key:
          type: string
        actif:
          type: boolean
        enabled:
          type: boolean
          deprecated: true
        subjectFr:
          type: [string, "null"]
        subjectEn:
          type: [string, "null"]
        preheaderFr:
          type: [string, "null"]
        preheaderEn:
          type: [string, "null"]
        corpsFr:
          type: [string, "null"]
        corpsEn:
          type: [string, "null"]
        ctaFr:
          type: [string, "null"]
        ctaEn:
          type: [string, "null"]
        updatedAt:
          type: [string, "null"]
          description: ISO datetime of the last change.
    EmailTemplate:
      type: object
      description: One registry entry (emails.js TEMPLATE_META) merged with its stored override.
      required: [key, audience, labelFr, labelEn, defaultSubjectFr, defaultSubjectEn, placeholders, transactionnel, override]
      properties:
        key:
          type: string
        audience:
          type: string
          enum: [client, notaire, partenaire, operateur, admin]
        labelFr:
          type: string
        labelEn:
          type: string
        defaultSubjectFr:
          type: string
        defaultSubjectEn:
          type: string
        placeholders:
          type: array
          description: The only `{{token}}` names a subject override may use.
          items:
            type: string
            enum: [montant, service, date, code, n, note, etude, email]
        transactionnel:
          type: boolean
          description: >-
            True when the template is the SOLE notice of a fact its recipient
            must know or act on. Such a template cannot be switched off; it can
            still be reworded.
        override:
          oneOf:
            - type: "null"
            - type: object
              required: [actif, subjectFr, subjectEn, updatedAt]
              properties:
                actif:
                  type: boolean
                enabled:
                  type: boolean
                  deprecated: true
                subjectFr:
                  type: [string, "null"]
                subjectEn:
                  type: [string, "null"]
                preheaderFr:
                  type: [string, "null"]
                preheaderEn:
                  type: [string, "null"]
                corpsFr:
                  type: [string, "null"]
                corpsEn:
                  type: [string, "null"]
                ctaFr:
                  type: [string, "null"]
                ctaEn:
                  type: [string, "null"]
                updatedAt:
                  type: [string, "null"]
    Segment:
      type: object
      description: >-
        Un segment CALCULE du catalogue de `apps/api/src/segments.js`. La
        console ne code aucun identifiant en dur : elle lit cette liste. `vise`
        dit qui le segment attrape et pourquoi ; `nature` decide si une base de
        consentement LCAP est exigee (commercial) ou non (transactionnel).
      required: [id, libelle, libelleEn, vise, audience, nature, params]
      properties:
        id: { type: string }
        libelle: { type: string }
        libelleEn: { type: string }
        vise: { type: string }
        audience:
          type: string
          enum: [notaire, client]
        nature:
          type: string
          enum: [commercial, transactionnel]
        params:
          description: Les seuils du segment, bornes. Un seuil hors bornes est refuse, jamais rabattu.
          type: array
          items:
            type: object
            required: [nom, defaut, min, max]
            properties:
              nom: { type: string }
              defaut: { type: integer }
              min: { type: integer }
              max: { type: integer }
              libelle: { type: string }
              libelleEn: { type: string }
    AudienceCible:
      description: >-
        Une cible : une personne nommee, un groupe d'audience stocke, ou un
        segment calcule. `POST /admin/campaigns` accepte aussi un TABLEAU de
        cibles, dont l'union est dedupliquee par adresse.
      oneOf:
        - type: object
          required: [type, email]
          properties:
            type: { type: string, const: user }
            email: { type: string, format: email }
            nature:
              type: string
              enum: [commercial, transactionnel]
        - type: object
          required: [type, groupId]
          properties:
            type: { type: string, const: group }
            groupId: { type: string }
        - type: object
          required: [type, segmentId]
          properties:
            type: { type: string, const: segment }
            segmentId: { type: string }
            params:
              type: object
              additionalProperties: { type: integer }
    AudienceSpec:
      oneOf:
        - $ref: "#/components/schemas/AudienceCible"
        - type: array
          items: { $ref: "#/components/schemas/AudienceCible" }
    AudienceGroup:
      type: object
      description: >-
        Un groupe d'AUDIENCE : une liste de DESTINATAIRES, rangee sous
        `AUDIENCE#GROUPES` (apps/api/src/keys.js). A NE PAS confondre avec le
        groupe RBAC de `/admin/groups`, qui reunit des PERMISSIONS et vit sur la
        table admin. La console peuplait sa liste "envoyer a un groupe" depuis
        la route RBAC : la cible existait dans l'ecran et n'atteignait jamais
        personne. Deux notions, deux partitions, deux routes.
        `audience` decide quelle table `segments.js` interroge pour retrouver le
        SUJET de chaque adresse — donc quelle base de consentement il peut
        etablir ; `nature` decide si la LCAP exige une base du tout.
      required: [id, libelle, audience, nature, membres]
      properties:
        id: { type: string }
        libelle: { type: string }
        audience:
          type: string
          enum: [notaire, client]
        nature:
          type: string
          enum: [commercial, transactionnel]
        membres:
          type: array
          items: { type: string, format: email }
        nbMembres: { type: integer }
        updatedAt:
          type: [string, "null"]
    CampaignMessage:
      type: object
      description: >-
        La copie que l'operateur ecrit POUR CETTE campagne. Elle vit avec la
        campagne et ne touche jamais au registre des gabarits : avant,
        "rediger" une relance voulait dire aller reformuler un gabarit dans
        l'ecran Courriels — donc changer ce courriel-la pour TOUS les envois
        suivants, y compris les transactionnels que l'art. 68 du Code de
        deontologie protege. Bilingue TOUT-OU-RIEN par paire (un courriel Nota
        porte toujours FR et EN), sans HTML (`para()` echappe de toute facon),
        sans formule de partage d'honoraires (art. 32 C.deont., art. 32.1 2 de
        la Loi sur le notariat), et un seul jeton connu : `{{email}}` — une
        campagne ne part d'aucune offre et ne connait rien d'autre.
      required: [sujetFr, sujetEn, corpsFr, corpsEn]
      properties:
        sujetFr: { type: string }
        sujetEn: { type: string }
        preheaderFr: { type: [string, "null"] }
        preheaderEn: { type: [string, "null"] }
        corpsFr:
          type: string
          description: Les lignes vides separent les paragraphes.
        corpsEn: { type: string }
        ctaFr: { type: [string, "null"] }
        ctaEn: { type: [string, "null"] }
        ctaUrl:
          type: [string, "null"]
          description: Adresse https complete. Sans elle, le bouton mene au carnet.
    CampaignRecipient:
      type: object
      description: >-
        UNE ligne par (campagne, destinataire), ecrite une seule fois — le rejeu
        d'un envoi ne repeint pas un "echoue" en "envoye". A ne pas confondre
        avec `CAMPAGNE#ENVOIS`, qui garde la DERNIERE campagne par adresse
        (l'etat du plafond de frequence) et ne peut donc pas repondre a "qui a
        recu la campagne X". Sans `pii:read`, `courriel` est masque.
      required: [courriel, statut]
      properties:
        courriel: { type: string }
        templateKey: { type: [string, "null"] }
        nature:
          type: [string, "null"]
          enum: [commercial, transactionnel, null]
        statut:
          type: [string, "null"]
          enum: [envoye, echoue, null]
        erreur: { type: [string, "null"] }
        at: { type: [string, "null"] }
    AudienceLimites:
      type: object
      description: >-
        Les bornes que le SERVEUR applique aux groupes d'audience, servies avec
        le catalogue. La console les recopiait (`AUD_ID_RE`, `AUD_LIBELLE_MAX`)
        et ignorait le plafond de membres : relever
        `NOTA_AUDIENCE_MEMBRES_MAX` sur un deploiement laissait l'ecran poser
        l'ancienne borne, et l'operateur decouvrait la vraie au refus. Le motif
        est rendu en SOURCE d'expression reguliere : la console le compile tel
        quel, donc il ne peut pas deriver.
      required: [identifiantMotif, libelleMax, membresMax]
      properties:
        identifiantMotif:
          type: string
          description: Source de l'expression reguliere appliquee a l'identifiant du groupe.
        libelleMax: { type: integer }
        membresMax:
          type: integer
          description: >-
            Au-dela, c'est un segment qu'il faut. Surchargeable par deploiement
            (`NOTA_AUDIENCE_MEMBRES_MAX`).
    Campaign:
      type: object
      description: >-
        UNE campagne passee, telle que le JOURNAL D'AUDIT la porte
        (`campagne_envoyee` / `campagne_echouee`). C'est la trace append-only
        ecrite a l'envoi qui sert cette liste, et non un second index : deux
        registres de campagnes seraient deux verites a tenir d'accord. Sans
        `pii:read`, les adresses des echecs sont masquees.
      required: [campagneId, statut, envoyes]
      properties:
        campagneId:
          type: string
          description: >-
            L'identifiant qui ouvre le registre des destinataires
            (`GET /admin/campaigns/{campagneId}/recipients`).
        at: { type: [string, "null"] }
        statut:
          type: string
          enum: [envoyee, echouee]
          description: >-
            `echouee` — la resolution avait des destinataires et AUCUN n'a ete
            joint. La campagne n'est PAS partie.
        audience:
          type: array
          items: { $ref: "#/components/schemas/AudienceCible" }
        templateKey: { type: [string, "null"] }
        message:
          description: >-
            La copie telle qu'elle est partie. "Qui a recu quoi" n'a pas de
            "quoi" si le message n'existe plus nulle part.
          oneOf:
            - $ref: "#/components/schemas/CampaignMessage"
            - type: "null"
        nature:
          type: [string, "null"]
          enum: [commercial, transactionnel, null]
        envoyes: { type: integer }
        total: { type: integer }
        echoues: { type: integer }
        echecs:
          type: array
          items: { $ref: "#/components/schemas/CampaignFailure" }
        exclus:
          oneOf:
            - $ref: "#/components/schemas/CampaignExclusions"
            - type: "null"
        registre:
          type: [object, "null"]
          properties:
            ecrits: { type: integer }
            echecs: { type: integer }
            frequenceEchecs: { type: integer }
        garde:
          type: [object, "null"]
          description: Sur quoi les deux gardes LCAP se sont appuyees au moment de l'envoi.
          properties:
            frequence: { type: [string, "null"] }
            consentement: { type: [string, "null"] }
    CampaignFailure:
      type: object
      required: [courriel, raison]
      properties:
        courriel: { type: string }
        raison:
          type: string
          description: >-
            Le motif REEL, tel que le notifieur l'a rendu — l'expediteur non
            configure et la boite pleine ne se reparent pas de la meme facon.
    CampaignExclusions:
      type: object
      description: >-
        Qui n'a PAS ete atteint, et pourquoi. On refuse en disant combien,
        jamais en cachant combien.
      required: [desabonnes, sansConsentement, frequence, doublons, sansCourriel]
      properties:
        desabonnes:
          type: integer
          description: Adresse retiree (LCAP art. 11 / Loi 25). Le retrait l'emporte sur toute nature.
        sansConsentement:
          type: integer
          description: Aucune base de consentement, expresse ni tacite (LCAP art. 10).
        frequence:
          type: integer
          description: Deja jointe dans la fenetre (art. 56 1 du Code de deontologie).
        doublons:
          type: integer
          description: Presente dans plusieurs cibles ; ecrite une seule fois.
        sansCourriel:
          type: integer
          description: Dans la cible mais injoignable ; comptee, jamais devinee.
    SessionGrant:
      type: object
      required: [ok, session, expiresAt]
      properties:
        ok:
          type: boolean
          const: true
        session:
          type: string
          description: Bearer token for subsequent admin calls.
        role:
          type: string
          enum: [super_admin, analyst]
        expiresAt:
          type: string
          format: date-time
          description: Absolute session expiry (hard 12 h cap; refresh never extends it).
    DossierUsagerSource:
      type: object
      required: [famille, joignable]
      description: >-
        Un registre que le dossier a interroge — ou qu'il ne PEUT pas encore
        joindre par sujet. Un dossier qui tait ce qu'il n'a pas regarde ment par
        omission : l'operateur croirait avoir tout vu.
      properties:
        famille:
          type: string
          description: Le nom de famille de la politique de conservation.
        joignable:
          type: boolean
          description: >-
            `false` quand le registre existe mais n'a aucun index par personne
            (les fils de soutien sont indexes par MOIS, le registre des
            destinataires par CAMPAGNE).
        note:
          type: [string, "null"]
    DossierUsagerOffre:
      type: object
      required: [id, dateISO, serviceId, montant]
      description: >-
        Une offre telle que le dossier la retient. Tout ce qui NOMME quelqu'un
        (nom, telephone, prefixe, dossier d'intake, reponses de tarification)
        est masque ou retire sans `pii:read`.
      properties:
        id: { type: string }
        dateISO: { type: string, format: date }
        serviceId: { type: string }
        montant: { type: number }
        statut: { type: [string, "null"] }
        createdAt: { type: [string, "null"] }
        anonyme: { type: boolean }
        nom: { type: [string, "null"] }
        telephone: { type: [string, "null"] }
        prefixe: { type: [string, "null"] }
        dossier: { type: [object, "null"], additionalProperties: true }
        pricing: { type: [object, "null"], additionalProperties: true }
        paiement:
          type: object
          properties:
            statut: { type: [string, "null"] }
            prixNotaServiceCents: { type: [integer, "null"] }
            prixNotaDateCents: { type: [integer, "null"] }
        acte:
          type: [object, "null"]
          properties:
            regleLe: { type: [string, "null"] }
            montant: { type: [number, "null"] }
            paye: { type: boolean }
        messagesCount:
          type: integer
          description: >-
            Combien de messages porte la messagerie de l'acte. Toujours lisible :
            un operateur sans `pii:read` doit savoir qu'une conversation existe,
            meme s'il n'a pas le droit de la lire.
        messages:
          type: [array, "null"]
          description: >-
            La conversation elle-meme. L'art. 27 donne acces aux renseignements,
            pas a leur decompte : un simple total ne repondrait pas a la demande.
            `null` sans `pii:read`.
          items:
            type: object
            properties:
              id: { type: [string, "null"] }
              de: { type: [string, "null"] }
              texte: { type: [string, "null"] }
              createdAt: { type: [string, "null"] }
        notaryId: { type: [string, "null"] }
        avis:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              kind: { type: [string, "null"] }
              titre: { type: [string, "null"] }
              at: { type: [string, "null"] }
              luLe: { type: [string, "null"] }
        conservationJusqua:
          type: [string, "null"]
          description: La date a laquelle la politique detruit cette offre (ttl DynamoDB).
        efface: { type: boolean }
        effaceLe: { type: [string, "null"] }
    DossierUsager:
      type: object
      required: [courriel, enClair, offres, sources]
      description: >-
        Ce que Nota detient sur UNE personne, assemble par une Query sur l'index
        CLIENT# — jamais par un balayage, que le role IAM refuse.
      properties:
        courriel:
          type: string
          description: Masquee (`r•••@exemple.ca`) sans `pii:read`.
        enClair:
          type: boolean
          description: Vrai quand l'appelant porte `pii:read`.
        offres:
          type: array
          items:
            $ref: "#/components/schemas/DossierUsagerOffre"
        consentement:
          type: [object, "null"]
          properties:
            base: { type: [string, "null"] }
            at: { type: [string, "null"] }
        journalConsentement:
          type: array
          items:
            type: object
            properties:
              at: { type: [string, "null"] }
              base: { type: [string, "null"] }
              source: { type: [string, "null"] }
        desabonne: { type: boolean }
        journalEnvois:
          type: array
          items:
            type: object
            properties:
              at: { type: [string, "null"] }
              kind: { type: [string, "null"] }
              templateKey: { type: [string, "null"] }
        journalAudit:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              ts: { type: [string, "null"] }
              action: { type: [string, "null"] }
              meta: { type: [object, "null"], additionalProperties: true }
        effacement:
          type: [object, "null"]
          description: >-
            La marque d'effacement. Presente, elle distingue « nous avons efface
            cette personne » de « nous ne l'avons jamais connue ».
          properties:
            at: { type: [string, "null"] }
        sources:
          type: array
          items:
            $ref: "#/components/schemas/DossierUsagerSource"
    RetentionLine:
      type: object
      required: [famille, jours, indefini]
      description: Une ligne de la politique de conservation, duree EFFECTIVE comprise.
      properties:
        famille: { type: string }
        jours:
          type: [integer, "null"]
          description: "`null` = conservation indefinie, et le motif dit pourquoi."
        indefini: { type: boolean }
        surchargee:
          type: boolean
          description: Vrai quand l'exploitation a regle cette famille par l'environnement.
        defaut: { type: [integer, "null"] }
        cle: { type: string }
        motif: { type: string }
        base: { type: string }
        applique:
          type: [boolean, "null"]
          description: >-
            La duree est-elle REELLEMENT posee par un adaptateur ? `null` pour
            une famille indefinie. Faux pour une duree DECIDEE mais pas encore
            appliquee (`journal_sujet`, `destinataire_campagne`, `fil_soutien`) :
            cette politique voyage dans l'export remis a la personne, et une
            promesse de destruction qui n'aura pas lieu est un mensonge de plus.
            `conservation-politique.test.mjs` relit la source des adaptateurs
            pour faire rougir tout drapeau qui mentirait.
        motifNonApplique: { type: [string, "null"] }
    ErasureLine:
      type: object
      required: [famille]
      properties:
        famille: { type: string }
        quoi: { type: string }
        ids:
          type: array
          items: { type: string }
        compte: { type: [integer, "null"] }
        motif: { type: string }
        base: { type: string }
        jusqua: { type: [string, "null"] }
        executable:
          type: boolean
          description: >-
            Sur une ligne d'`efface` seulement : l'executant SAIT-IL detruire
            cette famille ? Faux pour les registres qu'aucun adaptateur ne sait
            vider (journal des envois, destinataires de campagne, index par
            adresse, avis). Une ligne non executable n'est PAS effacee — elle est
            nommee pour que personne ne croie qu'elle l'a ete.
        identifiante:
          type: boolean
          description: >-
            Le residu NOMME-t-il encore la personne ? Seul un residu identifiant
            interdit de declarer l'effacement complet.
        note:
          type: [string, "null"]
          description: Pourquoi cette famille est hors de portee.
    ErasurePlan:
      type: object
      required: [courriel, efface, conserve, residus, complet]
      description: >-
        La frontiere de l'effacement, decidee par le DOMAINE. `efface` et
        `conserve` sont les deux moities, `residus` la troisieme — ce que le code
        ne sait pas encore detruire — et `complet` est faux des qu'une donnee
        identifiante survit, qu'elle soit gardee par obligation legale ou hors de
        portee de l'executant. Un effacement partiel doit se declarer partiel.
      properties:
        courriel: { type: string }
        at: { type: [string, "null"] }
        efface:
          type: array
          items:
            $ref: "#/components/schemas/ErasureLine"
        conserve:
          type: array
          items:
            $ref: "#/components/schemas/ErasureLine"
        residus:
          description: >-
            Les lignes d'`efface` non executables ET identifiantes, isolees pour
            qu'un ecran n'ait pas a les redecouvrir en filtrant.
          type: array
          items:
            $ref: "#/components/schemas/ErasureLine"
        complet: { type: boolean }
  responses:
    Unauthorized:
      description: Missing, invalid, expired, idled-out or revoked session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Errors"
          example:
            errors:
              - code: non_autorise
                message: Session invalide ou expirée.
    Forbidden:
      description: Authenticated, but the role lacks the required permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Errors"
          example:
            errors:
              - code: interdit
                message: Réservé à l’administrateur principal.
    NotFound:
      description: La ressource nommee n'existe pas.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Errors"
    ValidationError:
      description: Le corps est mal forme ou refuse par la validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Errors"
    TemplateNotFound:
      description: The template key is not in the registry (emails.js TEMPLATE_META).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Errors"
          example:
            errors:
              - code: modele_inconnu
                message: "Modèle de courriel inconnu : nope."
paths:
  /admin/auth/request:
    post:
      operationId: requestAdminLogin
      summary: Request a magic sign-in link.
      description: >-
        Always answers `200 {ok: true}` for a well-formed request, whether or
        not the address is on the admin allowlist — the body never distinguishes
        an admin from a stranger. Rate-limited per source IP. Outside
        production, the response additionally echoes the link as `devLink` so
        local dev completes the flow without a mailbox.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Accepted (regardless of allowlist membership).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
                  devLink:
                    type: string
                    description: Dev/test only — the magic link itself. Never present in production.
        "400":
          description: Malformed JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "429":
          description: Per-IP rate limit hit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
  /admin/auth/verify:
    post:
      operationId: verifyAdminMagicLink
      summary: Redeem a magic-link token for a session.
      description: >-
        Single-use — the challenge is consumed atomically, so a replayed link is
        rejected with 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Session established.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionGrant"
        "400":
          description: Malformed JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "401":
          description: Invalid, expired or already-used link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
  /admin/auth/refresh:
    post:
      operationId: refreshAdminSession
      summary: Slide the idle window and re-mint the session token.
      description: >-
        Keep-alive for an active operator. Never extends the absolute 12 h cap
        set at login.
      security:
        - adminSession: []
      responses:
        "200":
          description: Fresh token for the same session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionGrant"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/auth/logout:
    post:
      operationId: adminLogout
      summary: Revoke the server-side session.
      description: "Idempotent — always `200 {ok: true}`, even for an invalid token."
      security:
        - adminSession: []
      responses:
        "200":
          description: Session revoked (or was already invalid).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
  /admin/me:
    get:
      operationId: getAdminMe
      summary: The authenticated operator's identity and permissions.
      security:
        - adminSession: []
      responses:
        "200":
          description: Current principal.
          content:
            application/json:
              schema:
                type: object
                required: [email, role, permissions, idleTtlMs, expiresAt]
                properties:
                  email:
                    type: string
                  role:
                    type: string
                    enum: [super_admin, analyst]
                  permissions:
                    type: array
                    items:
                      type: string
                  idleTtlMs:
                    type: integer
                    description: >-
                      La fenetre d'inactivite de la session, en millisecondes
                      (30 min par defaut) : sans requete pendant ce delai, la
                      session meurt — bien avant le plafond absolu. La console
                      vise cette echeance-la (audit 2026-09-03, P1-15).
                  expiresAt:
                    type: string
                    format: date-time
                    description: Le plafond absolu de la session (12 h), jamais repousse par un refresh.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/notifications/templates:
    get:
      operationId: listAdminEmailTemplates
      summary: The email-template registry merged with the stored overrides.
      description: >-
        Every template in the emails.js registry (TEMPLATE_META) — audience,
        bilingual labels, default subjects and allowed `{{token}}` placeholders
        — each carrying its stored override, or `null` when the built-in
        behaviour stands. Open to ANY authenticated admin: an analyst sees the
        state read-only; only super_admin can write (ADR 0018 §3).
      security:
        - adminSession: []
      responses:
        "200":
          description: The merged template list.
          content:
            application/json:
              schema:
                type: object
                required: [templates, limites]
                properties:
                  limites:
                    type: object
                    description: >-
                      Les bornes de longueur, servies par le serveur pour que la
                      console pose ses `maxlength` sans recopier des valeurs qui
                      driveraient.
                    required: [sujet, preheader, corps, cta]
                    properties:
                      sujet: { type: integer }
                      preheader: { type: integer }
                      corps: { type: integer }
                      cta: { type: integer }
                  templates:
                    type: array
                    items:
                      $ref: "#/components/schemas/EmailTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/notifications/templates/{key}:
    put:
      operationId: putAdminEmailTemplate
      summary: Store (replace) one template's override.
      description: >-
        super_admin only (`notifications:write`) — an analyst gets 403. The
        body is a FULL replacement: `enabled` defaults to `true` when omitted,
        subjects must be provided both-or-neither (the notifier's bilingual
        contract needs both sides), each at most 200 characters and using only
        that template's declared `{{token}}` placeholders. Every change is
        audit-logged with its before/after.
      security:
        - adminSession: []
      parameters:
        - name: key
          in: path
          required: true
          description: A template key from the registry (e.g. `offerPublished`).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actif:
                  type: boolean
                  description: >-
                    `false` switches the template off. REFUSED when the template
                    is transactional.
                enabled:
                  type: boolean
                  deprecated: true
                  description: Alias of `actif`, kept for already-deployed clients.
                subjectFr: { type: string, maxLength: 200 }
                subjectEn: { type: string, maxLength: 200 }
                preheaderFr: { type: string, maxLength: 200 }
                preheaderEn: { type: string, maxLength: 200 }
                corpsFr: { type: string, maxLength: 1200 }
                corpsEn: { type: string, maxLength: 1200 }
                ctaFr: { type: string, maxLength: 60 }
                ctaEn: { type: string, maxLength: 60 }
      responses:
        "200":
          description: The stored override.
          content:
            application/json:
              schema:
                type: object
                required: [ok, override]
                properties:
                  ok:
                    type: boolean
                    const: true
                  override:
                    $ref: "#/components/schemas/EmailOverride"
        "400":
          description: Malformed JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TemplateNotFound"
        "422":
          description: >-
            Invalid override: a non-boolean switch, a text over its limit
            (subject/preheader 200, body 1200, CTA 60), an unknown `{{token}}`,
            HTML in a text field, a half-filled bilingual pair, an unknown
            field, or switching off a TRANSACTIONAL template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
    delete:
      operationId: resetAdminEmailTemplate
      summary: Remove one template's override (reset to the built-in behaviour).
      description: >-
        super_admin only (`notifications:write`). Idempotent; audit-logged with
        the removed record as `before`.
      security:
        - adminSession: []
      parameters:
        - name: key
          in: path
          required: true
          description: A template key from the registry.
          schema:
            type: string
      responses:
        "200":
          description: Override removed (or none existed).
          content:
            application/json:
              schema:
                type: object
                required: [ok, key]
                properties:
                  ok:
                    type: boolean
                    const: true
                  key:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TemplateNotFound"
  /admin/permissions:
    get:
      operationId: listAdminPermissions
      summary: Le catalogue des permissions, en deux langues.
      description: >-
        Le catalogue publie EST celui que le serveur applique (`rbac.can`). Une
        cle absente d'ici n'est jamais verifiee ; une cle verifiee sans etre ici
        serait invisible a la console. Depuis le 2026-09-03 la lecture exige
        `permissions:read` (la cle etait publiee sans etre appliquee), et
        `services:write` a quitte le catalogue — aucune route ne l'appliquait.
        Un groupe deja stocke qui la porte se charge encore ; elle n'est
        simplement plus offerte.
      security:
        - adminSession: []
      responses:
        "200":
          description: Les permissions connues.
          content:
            application/json:
              schema:
                type: object
                required: [ok, permissions]
                properties:
                  ok: { type: boolean }
                  permissions:
                    type: array
                    items:
                      type: object
                      required: [cle, libelle, libelleEn]
                      properties:
                        cle: { type: string }
                        libelle: { type: string }
                        libelleEn: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sans `permissions:read`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"

  /admin/groups:
    get:
      operationId: listAdminGroups
      summary: Les groupes et les permissions qu'ils portent.
      description: Requiert `groups:read`.
      security:
        - adminSession: []
      responses:
        "200":
          description: Les groupes connus.
          content:
            application/json:
              schema:
                type: object
                required: [ok, groupes]
                properties:
                  ok: { type: boolean }
                  groupes:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminGroup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/groups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Identifiant du groupe (minuscules, sans espace).
    put:
      operationId: putAdminGroup
      summary: Creer ou modifier un groupe.
      description: >-
        Requiert `groups:write`. Le joker `*` est REFUSE sur un groupe : il se
        donne nommement a une personne, sinon il se propage silencieusement a
        chaque nouveau membre. Journalise avec son etat avant et apres.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nom]
              properties:
                nom: { type: string, maxLength: 80 }
                description: { type: string, maxLength: 240 }
                permissions:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Le groupe enregistre.
          content:
            application/json:
              schema:
                type: object
                required: [ok, groupe]
                properties:
                  ok: { type: boolean }
                  groupe:
                    $ref: "#/components/schemas/AdminGroup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteAdminGroup
      summary: Supprimer un groupe.
      description: >-
        Requiert `groups:write`. Ses permissions disparaissent immediatement de
        ses membres — elles sont resolues a chaque requete, jamais figees.
      security:
        - adminSession: []
      responses:
        "200":
          description: Supprime.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users:
    get:
      operationId: listAdminUsers
      summary: Les comptes d'administration et leurs acces effectifs.
      description: >-
        Requiert `users:read`. La liste vient de la liste blanche de
        l'environnement (`NOTA_ADMIN_EMAILS`), qui reste la porte exterieure :
        une console compromise ne doit pas pouvoir se fabriquer des
        administrateurs. Ce qui se configure ici, c'est ce que chacun PEUT.
      security:
        - adminSession: []
      responses:
        "200":
          description: Les comptes connus.
          content:
            application/json:
              schema:
                type: object
                required: [ok, utilisateurs]
                properties:
                  ok: { type: boolean }
                  utilisateurs:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users/{email}:
    parameters:
      - name: email
        in: path
        required: true
        schema: { type: string, format: email }
    put:
      operationId: putAdminUserAccess
      summary: Attribuer groupes, permissions directes, role et etat d'un compte.
      description: >-
        Requiert `users:write`. Un champ absent du corps est LAISSE INTACT.
        Repond 409 `dernier_administrateur` si le changement laisserait la
        console sans aucun compte actif capable de l'administrer — une porte
        d'administration sans issue de secours est une panne, pas une politique.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  oneOf:
                    - type: string
                      enum: [super_admin, analyst]
                    - type: "null"
                groupes:
                  type: array
                  items: { type: string }
                permissions:
                  type: array
                  items: { type: string }
                disabled: { type: boolean }
      responses:
        "200":
          description: Les acces enregistres.
          content:
            application/json:
              schema:
                type: object
                required: [ok, utilisateur]
                properties:
                  ok: { type: boolean }
                  utilisateur:
                    $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Le dernier compte capable d'administrer la console.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "422":
          $ref: "#/components/responses/ValidationError"

  /admin/prix:
    get:
      operationId: getAdminPrixNota
      summary: La grille de Nota — defaut du deploiement, grille stockee, grille en vigueur.
      description: >-
        ADR 0034. `defaut` est la grille du deploiement (le catalogue, surcharge
        par `NOTA_PRIX_CENTS` ou `NOTA_PRIX_GRILLE`) ; `override` est ce que
        Nota a enregistre depuis cette console, ou `null` ; `effectif` est la
        grille complete avec laquelle la facturation tarife en ce moment ;
        `catalogue` porte les lignes a editer et leurs noms. Ouvert a TOUT admin
        authentifie — l'analyste voit l'etat en lecture seule.
      security:
        - adminSession: []
      responses:
        "200":
          description: Le prix tel que la facturation le resout.
          content:
            application/json:
              schema:
                type: object
                required: [defaut, override, effectif, catalogue]
                properties:
                  defaut:
                    $ref: "#/components/schemas/PrixNota"
                  override:
                    oneOf:
                      - $ref: "#/components/schemas/PrixNotaStored"
                      - type: "null"
                  effectif:
                    $ref: "#/components/schemas/PrixNota"
                  catalogue:
                    $ref: "#/components/schemas/PrixNotaCatalogue"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: putAdminPrixNota
      summary: Enregistrer (remplacer) la grille que Nota decide.
      description: >-
        super_admin seulement (`settings:write`) — un analyste recoit 403. La
        regle tient en une ligne : chaque cellule doit etre un entier de cents,
        strictement positif pour un service, zero accepte pour la garantie de
        date. Un service ou un palier hors catalogue est refuse
        (`service_inconnu` / `palier_inconnu`). Effet a la prochaine
        tarification, sans deploiement. Journalise avec son avant/apres.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrixNotaEdit"
      responses:
        "200":
          description: La grille enregistree.
          content:
            application/json:
              schema:
                type: object
                required: [ok, override]
                properties:
                  ok:
                    type: boolean
                    const: true
                  override:
                    $ref: "#/components/schemas/PrixNotaStored"
        "400":
          description: Malformed JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: "Prix invalide : `prix_invalide`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
    delete:
      operationId: resetAdminPrixNota
      summary: Retirer le prix enregistre (retour au defaut du deploiement).
      description: >-
        super_admin seulement (`settings:write`). Idempotent ; journalise avec
        le prix retire comme `before`.
      security:
        - adminSession: []
      responses:
        "200":
          description: Prix retire (ou aucun n'existait).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/notaries:
    get:
      operationId: listAdminNotaries
      summary: The notary register — who is on Nota, what cote they carry, what Nota billed them.
      description: >-
        The operator's counterpart to the disclosure the notary gets (ADR 0028).
        Every notary — onboarding ones included — with the cote out of 100 and
        its four axes (so a contested cote can be recomputed by hand), the rate
        that cote earns under the barème in force, the acts carried, what
        clients said, and the commission Nota actually collected. Nominative
        and financial: requires `pii:read` (super_admin); an analyst gets 403.
        Sorted by cote, highest first.
      security:
        - adminSession: []
      responses:
        "200":
          description: The register, and the barème it was priced under.
          content:
            application/json:
              schema:
                type: object
                required: [notaires, bareme]
                properties:
                  notaires:
                    type: array
                    items:
                      type: object
                      required: [id, cote, axes, tauxEffectif, part, actes, avis]
                      properties:
                        id:
                          type: string
                        email:
                          type: [string, "null"]
                        etude:
                          type: [string, "null"]
                        statut:
                          type: [string, "null"]
                          description: onboarding | active | restricted.
                        cote:
                          type: integer
                          minimum: 0
                          maximum: 100
                        axes:
                          type: array
                          description: The four axes, points and max, exactly as the notary sees them.
                          items:
                            type: object
                        tauxEffectif:
                          type: number
                          description: What Nota keeps on this notary's next act.
                        part:
                          type: number
                          description: What the notary keeps — the complement.
                        actes:
                          type: integer
                        actesParService:
                          type: object
                          additionalProperties:
                            type: integer
                        note:
                          type: [number, "null"]
                          description: One-decimal average, null before the first evaluation.
                        avis:
                          type: integer
                        commissionPercue:
                          type: number
                          description: Commission Nota has collected from this notary, in dollars.
                        commissionDue:
                          type: number
                          description: >-
                            What this notary still owes Nota, in dollars — acts
                            settled outside the platform (the client paid the
                            notary directly at signing). Collected and owed are
                            never conflated.
                        rayonKm:
                          type: integer
                        urgences:
                          type: boolean
                        cnq:
                          type: boolean
                        depuis:
                          type: [string, "null"]
                        vuLe:
                          type: [string, "null"]
                  bareme:
                    $ref: "#/components/schemas/CommissionBareme"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/notaries/{id}/activer:
    post:
      operationId: activateAdminNotary
      summary: Activate a notary — the operator has checked the Tableau de l'Ordre; this opens the console.
      description: >-
        A notary signs up with a CNQ number and waits (`en_attente`). The
        operator verifies the number against the Chambre's public roll, then
        activates: `approuveLe` is stamped, the status becomes `active`, an
        `notary_activated` audit entry is appended, and the notary receives
        the `notaryApproved` email with the console link (best effort — the
        access is open even if the email fails). Idempotent: a second call on
        an already-active notary answers `deja: true` and changes nothing.
        Requires `moderation:write`.
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The notary id.
      responses:
        "200":
          description: The notary, as activated (or as already active).
          content:
            application/json:
              schema:
                type: object
                required: [ok, deja, notaire]
                properties:
                  ok:
                    type: boolean
                    const: true
                  deja:
                    type: boolean
                    description: True when the notary was already active — nothing was changed.
                  notaire:
                    type: object
                    required: [id, statut, approuveLe]
                    properties:
                      id:
                        type: string
                      email:
                        type: [string, "null"]
                      etude:
                        type: [string, "null"]
                      statut:
                        type: [string, "null"]
                        description: en_attente | active | restricted.
                      approuveLe:
                        type: [string, "null"]
                        format: date-time
                      inscritLe:
                        type: [string, "null"]
                        format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/audit:
    get:
      operationId: readAdminAudit
      summary: Read the append-only audit log — one day, or a filtered window.
      description: >-
        A trail nobody can read is not an audit trail. Every meaningful action —
        admin logins, barème changes, card authorizations and their release,
        every Stripe state change, a notary's sign-up and perimeter edits, every
        cancellation, and every settled act (`acte_regle`, with the amount, the
        rate applied, the cote that earned it, Nota's share and the notary's
        net) — bucketed on the Québec business day. Requires `audit:read` —
        reading the trail and unmasking a client are two distinct capabilities,
        and a dedicated auditor must be able to hold the first without the
        second. Any principal without it gets 403. Newest first.


        Since 2026-09-05 the door also answers the two questions an
        investigation actually asks: `acteur` ("everything this person did" —
        matched against the public trail's `acteur.id`/`acteur.type` and the
        admin trail's `adminId`/`email`) and `sujet` ("everything done to this
        account" — matched against the values inside `meta`, whatever key
        carries them). Either can be combined with a `du`/`au` window of at most
        92 days, paginated with `limite` + `curseur`. `jour` alone remains the
        original behaviour. The parameters filter; they never widen the
        permission.
      security:
        - adminSession: []
      parameters:
        - name: jour
          in: query
          required: false
          description: >-
            The business day to read, as an ISO date (YYYY-MM-DD). Required
            unless `du`/`au` are given, which take precedence over it.
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        - name: du
          in: query
          required: false
          description: >-
            First business day of the window (inclusive). Defaults to `au` when
            only `au` is given.
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        - name: au
          in: query
          required: false
          description: >-
            Last business day of the window (inclusive). Defaults to `du` when
            only `du` is given. The window may not exceed 92 days — the trail is
            partitioned by day and nothing indexes actor or subject, so an
            unbounded window would be a table scan wearing a filter's clothes.
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        - name: acteur
          in: query
          required: false
          description: >-
            Keep only entries whose actor matches, case-insensitively: the
            public trail's `acteur.id` (a notary's derived id, the bid a
            client's dossier lives on, a partner's code) or `acteur.type`
            (`notaire` / `client` / `partenaire` / `systeme`), or the admin
            trail's `adminId` or `email`.
          schema:
            type: string
        - name: sujet
          in: query
          required: false
          description: >-
            Keep only entries whose `meta` carries this value, whatever key
            holds it (`bidId`, `notaryId`, `cible`, `code`, …). The actor is
            deliberately NOT matched here: a client's dossier is both the actor
            and the subject of its own gestures, and folding the two would make
            this a synonym of `acteur`.
          schema:
            type: string
        - name: limite
          in: query
          required: false
          description: Maximum entries in one page (default 100, ceiling 500).
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: curseur
          in: query
          required: false
          description: >-
            The `curseur` from a previous response, to fetch the next page. It
            is opaque and unsigned — it carries no secret and opens nothing:
            `audit:read` is verified on every request, cursor or not. A cursor
            that does not belong to the requested window is a 422.
          schema:
            type: string
      responses:
        "200":
          description: >-
            The window's entries, newest first — an empty list for a quiet
            window, never an error.
          content:
            application/json:
              schema:
                type: object
                required: [jour, entrees]
                properties:
                  jour:
                    type: string
                    description: >-
                      The most recent day of the window — equal to `au`, and to
                      the requested `jour` when a single day was asked for.
                  du:
                    type: string
                  au:
                    type: string
                  curseur:
                    type: string
                    description: >-
                      Present only when more entries remain. Absent means the
                      window is exhausted, so the console stops asking.
                  entrees:
                    type: array
                    items:
                      type: object
                      required: [action]
                      properties:
                        id:
                          type: string
                        ts:
                          type: string
                        day:
                          type: string
                        action:
                          type: string
                        adminId:
                          type: [string, "null"]
                        email:
                          type: [string, "null"]
                        ip:
                          type: [string, "null"]
                          description: >-
                            The origin address, on ADMINISTRATIVE entries only —
                            a named employee acting on the console. Always
                            `null` on entries written by the public gate: a
                            record kept for seven years, readable with
                            `audit:read` alone, carries no personal information
                            (ADR 0036). Origin belongs to incident
                            investigation, which the Lambda access logs serve
                            under their own twelve-month bound.
                        acteur:
                          type: [object, "null"]
                          description: >-
                            Who acted. Absent on entries written before
                            2026-09-03. `id` is the identifier the system
                            already holds — the notary's derived id, the bid a
                            client's dossier lives on, a partner's code — never
                            an email address and never an origin address: the
                            trail is kept for seven years and must stay minimal
                            while remaining joinable to the registries.
                          properties:
                            type:
                              type: string
                              enum: [notaire, client, partenaire, systeme]
                            id:
                              type: [string, "null"]
                        ttl:
                          type: integer
                          description: >-
                            Epoch SECONDS at which DynamoDB will reap this
                            entry — seven calendar years after `ts` (ADR 0036).
                            Absent on entries written before 2026-09-03, which
                            carry no expiry and never will: nothing is applied
                            retroactively. Surfaced deliberately, because "when
                            does this evidence disappear" is a question a
                            retention audit has to be able to answer.
                        meta:
                          type: [object, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >-
            `jour_invalide` (not an ISO date), `fenetre_invalide` (start after
            end), `fenetre_trop_large` (over 92 days), or `curseur_invalide`
            (a cursor that does not belong to the requested window).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
  /admin/annulation:
    get:
      operationId: getAdminCancellationSchedule
      summary: The cancellation-fee barème — defaults, stored override, and what is in force.
      description: >-
        ADR 0023 §2. `defaut` is the deployment's schedule (built-ins overlaid
        by the `NOTA_CANCELLATION_TIERS` environment); `override` is the barème
        Nota stored from this console, or `null`; `effectif` is whichever of
        the two the public cancel route resolves with right now. Open to ANY
        authenticated admin — an analyst sees the state read-only.
      security:
        - adminSession: []
      responses:
        "200":
          description: The barème as the cancel route resolves it.
          content:
            application/json:
              schema:
                type: object
                required: [defaut, override, effectif]
                properties:
                  defaut:
                    $ref: "#/components/schemas/CancellationBareme"
                  override:
                    oneOf:
                      - $ref: "#/components/schemas/CancellationBaremeStored"
                      - type: "null"
                  effectif:
                    $ref: "#/components/schemas/CancellationBareme"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: putAdminCancellationSchedule
      summary: Store (replace) the barème Nota decides.
      description: >-
        super_admin only (`settings:write`) — an analyst gets 403. The body is
        a FULL replacement, validated loudly: at most 10 paliers, each with an
        integer `maxJours` ≥ 0 and a `taux` in (0, 1), `maxJours` strictly
        ascending. An EMPTY list is valid — it makes cancellation free
        everywhere. Takes effect at the next cancellation — no deploy.
        Audit-logged with its before/after.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancellationBareme"
      responses:
        "200":
          description: The stored barème.
          content:
            application/json:
              schema:
                type: object
                required: [ok, override]
                properties:
                  ok:
                    type: boolean
                    const: true
                  override:
                    $ref: "#/components/schemas/CancellationBaremeStored"
        "400":
          description: Malformed JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >-
            Invalid barème: `paliers_invalides` (not a list of at most 10),
            `palier_invalide` (a malformed tier) or `paliers_desordonnes`
            (days not strictly ascending).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
    delete:
      operationId: resetAdminCancellationSchedule
      summary: Remove the stored barème (back to the environment defaults).
      description: >-
        super_admin only (`settings:write`). Idempotent; audit-logged with the
        removed barème as `before`.
      security:
        - adminSession: []
      responses:
        "200":
          description: Barème removed (or none existed).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/metrics/overview:
    get:
      operationId: getAdminMetricsOverview
      summary: The Overview dashboard payload.
      description: >-
        History (offers, retentions, completed acts) read from the sharded
        STATS# rollup counters over a date range, plus present-tense inventory
        computed live from the carnet — no table Scan anywhere. Requires
        `analytics:read` (403 otherwise). The partner `courriel` in
        `parrainages.codes[]` only travels with `pii:read`; it is `null` for
        everyone else (audit 2026-09-03, P0-10).
      security:
        - adminSession: []
      parameters:
        - name: from
          in: query
          required: false
          description: Range start, `YYYY-MM-DD`. Defaults to 29 days before `to`.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Range end, `YYYY-MM-DD`. Defaults to today.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Aggregated metrics for the range.
          content:
            application/json:
              schema:
                type: object
                required: [range, kpis, gauge, series, parrainages, annulations, creances]
                properties:
                  annulations:
                    type: object
                    description: >-
                      The late-cancellation money over the range (ADR 0033):
                      since the fee is the retaining NOTARY's compensation,
                      never Nota's revenue, it is reported as what was paid to
                      notaries and what was booked as owed to them. Read from
                      the transaction audit trail (`annulation_frais` rows),
                      day by day over the range.
                    required: [nombre, versesCents, dusCents]
                    properties:
                      nombre:
                        type: integer
                        description: Cancellations that carried a fee, in the range.
                      versesCents:
                        type: integer
                        description: "Fees transferred to notaries (`verse: true`), in cents."
                      dusCents:
                        type: integer
                        description: "Fees booked as owed to notaries (`verse: false`), in cents."
                  creances:
                    type: object
                    description: >-
                      The two receivable BALANCES right now, summed over the
                      notary roster — they ignore the range. `commissionCentsDue`
                      is what notaries still owe Nota for acts settled outside
                      the platform (ADR 0029); `dedommagementCentsDue` is what
                      Nota still owes notaries in cancellation compensation it
                      could not transfer (ADR 0033).
                    required: [commissionCentsDue, dedommagementCentsDue]
                    properties:
                      commissionCentsDue:
                        type: integer
                      dedommagementCentsDue:
                        type: integer
                  range:
                    type: object
                    required: [from, to, days]
                    properties:
                      from:
                        type: string
                        format: date
                      to:
                        type: string
                        format: date
                      days:
                        type: integer
                  kpis:
                    type: object
                    required: [offersPosted, offersRetained, retentionRate, commissionCents, actsCompleted]
                    properties:
                      offersPosted:
                        type: integer
                      offersRetained:
                        type: integer
                      retentionRate:
                        type: number
                        description: 0..1 fraction (the console also accepts 0..100).
                      commissionCents:
                        type: integer
                        description: >-
                          ADR 0031 — les cents que Nota a facturés pour SON
                          service. Nom hérité : ce n'est plus une part des
                          honoraires du notaire, et aucun taux ne l'accompagne.
                      actsCompleted:
                        type: integer
                  gauge:
                    type: object
                    required: [open, retained, activeNotaries, onboardingNotaries]
                    properties:
                      open:
                        type: integer
                      retained:
                        type: integer
                      activeNotaries:
                        type: integer
                      onboardingNotaries:
                        type: integer
                  series:
                    type: object
                    required: [offersPerDay, byService]
                    properties:
                      offersPerDay:
                        type: array
                        items:
                          type: object
                          required: [date, count]
                          properties:
                            date:
                              type: string
                              format: date
                            count:
                              type: integer
                      byService:
                        type: array
                        items:
                          type: object
                          required: [serviceId, nom, offers, retained]
                          properties:
                            serviceId:
                              type: string
                            nom:
                              type: string
                            offers:
                              type: integer
                            retained:
                              type: integer
                  parrainages:
                    type: object
                    description: >-
                      Partner referral ledger (ADR 0011). Amounts due (`du`,
                      `retenues`, `notairesActifs`) are ALL-TIME and monotonic:
                      they read the durable earning events recorded at retain
                      time, reconciled (max, never summed) with the live month
                      window that still enriches the softer columns (`demandes`,
                      `completes`). `client` / `notaire` are the flat per-track
                      reward amounts in DOLLARS; each code row is joined with
                      the POST /partenaires registry (type, courriel,
                      typeNom/typeNomEn present only when the code was claimed),
                      and every registered code appears even with zero activity.
                    required: [client, notaire, codes]
                    properties:
                      client:
                        type: integer
                        description: Flat reward (in dollars) per referred demand retained.
                      notaire:
                        type: integer
                        description: Flat reward (in dollars) when a referred notary retains their first act.
                      codes:
                        type: array
                        items:
                          type: object
                          required: [code, demandes, retenues, completes, notaires, notairesActifs, du, type, courriel]
                          properties:
                            code:
                              type: string
                            demandes:
                              type: integer
                            retenues:
                              type: integer
                            completes:
                              type: integer
                            notaires:
                              type: integer
                            notairesActifs:
                              type: integer
                            du:
                              type: integer
                              description: Total owed to this partner, in DOLLARS.
                            type:
                              type: string
                              nullable: true
                              description: REFERRAL.partners id, null while unclaimed.
                            courriel:
                              type: string
                              nullable: true
                              description: Only with `pii:read`; null otherwise.
                            typeNom:
                              type: string
                            typeNomEn:
                              type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sans `analytics:read`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
  /admin/segments:
    get:
      operationId: getAdminSegments
      summary: Le catalogue des segments d'audience, dans les deux langues.
      description: >-
        La specification EST cette liste (`apps/api/src/segments.js`) : ajouter
        un segment coute une entree, jamais une branche, et la console n'en code
        aucun en dur. Demande `analytics:read` — regarder une audience n'est pas
        lui ecrire.
      security:
        - adminSession: []
      responses:
        "200":
          description: Le catalogue tel que le serveur l'applique.
          content:
            application/json:
              schema:
                type: object
                required: [ok, segments]
                properties:
                  ok:
                    type: boolean
                    const: true
                  segments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Segment"
                  limites:
                    type: object
                    description: >-
                      Les bornes du compositeur, servies avec le catalogue : la
                      console pose ses `maxlength` depuis le serveur plutot que
                      de recopier des nombres qui derivent.
                    properties:
                      sujet: { type: integer }
                      preheader: { type: integer }
                      corps: { type: integer }
                      cta: { type: integer }
                      jetons:
                        type: array
                        items: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/audiences/groups:
    get:
      operationId: listAdminAudienceGroups
      summary: Les groupes d'AUDIENCE — des listes de destinataires.
      description: >-
        A ne pas confondre avec `/admin/groups`, qui rend les groupes RBAC
        (des paquets de PERMISSIONS, sur la table admin). Demande
        `audiences:read` : c'est une lecture NOMINATIVE — le groupe porte les
        adresses des gens a qui Nota ecrit — et elle s'accorde comme telle.
      security:
        - adminSession: []
      responses:
        "200":
          description: Les groupes d'audience stockes.
          content:
            application/json:
              schema:
                type: object
                required: [ok, groupes, limites]
                properties:
                  ok:
                    type: boolean
                    const: true
                  groupes:
                    type: array
                    items:
                      $ref: "#/components/schemas/AudienceGroup"
                  limites:
                    $ref: "#/components/schemas/AudienceLimites"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/audiences/groups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Minuscules, sans espace (lettres, chiffres, - et _), 40 caracteres au plus.
    put:
      operationId: putAdminAudienceGroup
      summary: Creer ou remplacer un groupe d'audience.
      description: >-
        Remplacement COMPLET de la liste — un groupe est ce que l'operateur
        vient d'ecrire, jamais une fusion silencieuse. Les adresses sont
        normalisees et dedupliquees a l'ecriture. Demande `audiences:write` :
        modifier la liste des gens a qui Nota ecrit est une decision d'envoi,
        pas un reglage, et elle est journalisee avec son avant/apres.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [libelle, audience, nature, membres]
              properties:
                libelle: { type: string }
                audience:
                  type: string
                  enum: [notaire, client]
                nature:
                  type: string
                  enum: [commercial, transactionnel]
                membres:
                  type: array
                  items: { type: string, format: email }
      responses:
        "200":
          description: Le groupe tel qu'il est stocke.
          content:
            application/json:
              schema:
                type: object
                required: [ok, groupe]
                properties:
                  ok:
                    type: boolean
                    const: true
                  groupe:
                    $ref: "#/components/schemas/AudienceGroup"
        "400":
          description: Malformed JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >-
            `identifiant_invalide`, `libelle_invalide`, `audience_invalide`,
            `nature_invalide`, `courriel_invalide`, `membres_vides`,
            `membres_invalides` ou `membres_trop_nombreux`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
    delete:
      operationId: deleteAdminAudienceGroup
      summary: Supprimer un groupe d'audience.
      description: >-
        Demande `audiences:write`, journalise avec l'etat d'avant. Un groupe
        inconnu est un 404 — jamais un succes silencieux, qui laisserait croire
        qu'une liste a ete retiree alors qu'elle n'existait pas sous ce nom.
      security:
        - adminSession: []
      responses:
        "200":
          description: Le groupe est supprime.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`groupe_introuvable`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
  /admin/campaigns/{campagneId}/recipients:
    parameters:
      - name: campagneId
        in: path
        required: true
        schema: { type: string }
      - name: limit
        in: query
        required: false
        schema: { type: integer }
      - name: cursor
        in: query
        required: false
        schema: { type: string }
        description: >-
          Curseur OPAQUE rendu par la page precedente. L'appelant boucle jusqu'a
          ce que `cursor` revienne nul.
    get:
      operationId: listAdminCampaignRecipients
      summary: QUI a recu la campagne X.
      description: >-
        La question a laquelle rien ne repondait. `markCampaignSent` ne garde
        que la DERNIERE campagne par adresse — l'etat du plafond de frequence de
        l'art. 56 1 — donc il ne pouvait dire ni qui avait recu quoi, ni
        dedupliquer un renvoi, ni servir une demande d'acces (Loi 25, art. 27).
        Ce registre-ci garde une ligne par (campagne, destinataire), avec son
        statut. Demande `analytics:read` ; sans `pii:read` les adresses sont
        MASQUEES comme l'echantillon de l'apercu — reconnaissable, jamais
        expediable.
      security:
        - adminSession: []
      responses:
        "200":
          description: Une page du registre.
          content:
            application/json:
              schema:
                type: object
                required: [ok, campagneId, destinataires]
                properties:
                  ok:
                    type: boolean
                    const: true
                  campagneId: { type: string }
                  destinataires:
                    type: array
                    items:
                      $ref: "#/components/schemas/CampaignRecipient"
                  cursor:
                    type: [string, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >-
            `campagne_invalide` — identifiant vide, identifiant reserve
            (`ENVOIS`, qui viserait la partition du plafond de frequence), ou
            curseur d'une AUTRE campagne.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "503":
          description: "`registre_indisponible` — le depot ne cable pas ce registre."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
  /admin/campaigns/preview:
    post:
      operationId: previewAdminCampaign
      summary: Resoudre une audience A BLANC — le compte, les exclusions, un echantillon masque.
      description: >-
        Essai a blanc : la resolution compte, detaille et montre, mais ne
        prepare RIEN d'envoyable et n'ecrit nulle part — regarder une audience
        ne consomme pas le quota de ses membres. L'echantillon est masque
        (`a...@etude.ca`) : reconnaissable, pas expediable. `plafond.depasse`
        annonce ce que l'envoi exigera de confirmer. Demande `analytics:read`.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audience]
              description: >-
                EXACTEMENT UNE source de copie : `message` (ce que l'operateur
                vient d'ecrire) ou `templateKey` (un gabarit du registre). Les
                deux ensemble sont refuses (`copie_ambigue`), aucune des deux
                aussi (`copie_manquante`).
              properties:
                audience:
                  $ref: "#/components/schemas/AudienceSpec"
                templateKey:
                  type: string
                  description: Une cle du registre `emails.TEMPLATE_META`.
                message:
                  $ref: "#/components/schemas/CampaignMessage"
      responses:
        "200":
          description: Ce que la campagne ferait.
          content:
            application/json:
              schema:
                type: object
                required: [ok, total, exclus, echantillon, plafond, nature, avertissements, garde]
                properties:
                  ok:
                    type: boolean
                    const: true
                  total:
                    type: integer
                    description: Le nombre REEL de destinataires retenus.
                  exclus:
                    $ref: "#/components/schemas/CampaignExclusions"
                  echantillon:
                    type: array
                    description: Adresse masquee et raison MESUREE, au plus cinq lignes.
                    items:
                      type: string
                  plafond:
                    type: object
                    required: [limite, depasse]
                    properties:
                      limite:
                        type: integer
                      depasse:
                        type: boolean
                  nature:
                    type: string
                    enum: [commercial, transactionnel]
                    description: La plus stricte des natures de la cible.
                  garde:
                    type: object
                    description: >-
                      Sur QUOI les deux gardes se sont appuyees. Sans cet echo,
                      la console affirmait "base de consentement verifiee" alors
                      que la resolution avait pu redescendre sur une deduction
                      faute de registre : une garantie qu'on ne peut pas
                      controler n'en est pas une.
                    required: [frequence, consentement]
                    properties:
                      frequence:
                        type: string
                        enum: [appliquee, non_verifiee, sans_objet]
                      consentement:
                        type: string
                        enum: [registre, deduit, sans_objet]
                  avertissements:
                    type: array
                    items:
                      type: string
        "400":
          description: Malformed JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TemplateNotFound"
        "422":
          description: >-
            Cible refusee (`spec_invalide`, `type_inconnu`, `segment_inconnu`,
            `groupe_inconnu`, `courriel_invalide`, `parametre_inconnu`,
            `parametre_invalide`) ou gabarit transactionnel detourne en reclame
            (`gabarit_transactionnel`, art. 68 du Code de deontologie).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
  /admin/campaigns:
    get:
      operationId: listAdminCampaigns
      summary: Les campagnes passees d'un jour — le chemin de retour vers "qui a recu".
      description: >-
        Sans cette porte, "voir exactement qui l'a recu" ne survivait pas au
        rendu : l'identifiant de campagne ne vivait que dans la reponse de
        l'envoi, et recharger la console — ou l'ouvrir sur un autre appareil —
        coupait le seul chemin vers un registre pourtant durable.
        La source est le JOURNAL D'AUDIT, qui porte deja chaque envoi avec sa
        copie, ses comptes, ses exclusions et ses gardes ; un second index de
        campagnes serait une deuxieme verite a tenir d'accord avec la premiere.
        Le journal est partitionne par jour, donc la liste l'est aussi : `jour`
        est un jour OUVRABLE DE QUEBEC (`domain.businessDay`, zone
        `NOTA_TIMEZONE`), jamais une tranche UTC — un envoi de 21 h vit dans la
        partition du LENDEMAIN UTC et reste du bon jour civil. Sans `jour`,
        c'est aujourd'hui. Memes permissions que le registre vers lequel elle
        mene : `analytics:read` pour poser la question, `pii:read` pour lire en
        clair les adresses que portent les echecs.
      parameters:
        - name: jour
          in: query
          required: false
          schema: { type: string }
          description: Jour ouvrable de Quebec (AAAA-MM-JJ). Par defaut, aujourd'hui.
      security:
        - adminSession: []
      responses:
        "200":
          description: Les campagnes de ce jour, la plus recente d'abord.
          content:
            application/json:
              schema:
                type: object
                required: [ok, jour, campagnes]
                properties:
                  ok:
                    type: boolean
                    const: true
                  jour: { type: string }
                  campagnes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Campaign"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: "`jour_invalide` — le jour doit etre une date ISO (AAAA-MM-JJ)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
    post:
      operationId: sendAdminCampaign
      summary: Envoyer la campagne.
      description: >-
        Demande `campaigns:send` — une capacite a part entiere, jamais un
        corollaire de `notifications:write` : ecrire un gabarit et l'envoyer a
        cent personnes ne sont pas la meme decision. L'envoi passe par
        `notifications.js`, seul chemin qui honore la liste de suppression et
        pose l'en-tete de retrait RFC 8058. Apres chaque envoi COMMERCIAL
        reussi, l'adresse est inscrite au registre de frequence (art. 56 1 du
        Code de deontologie : inciter de facon pressante ou repetee est
        derogatoire) ; sans cette ecriture le plafond serait decoratif. Chaque
        campagne est journalisee : qui, quelle audience, combien atteints,
        combien exclus et pourquoi.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audience]
              description: >-
                EXACTEMENT UNE source de copie : `message` ou `templateKey`.
              properties:
                audience:
                  $ref: "#/components/schemas/AudienceSpec"
                templateKey:
                  type: string
                  description: >-
                    Une cle du registre `emails.TEMPLATE_META`. Un gabarit
                    TRANSACTIONNEL est refuse pour une campagne commerciale.
                message:
                  $ref: "#/components/schemas/CampaignMessage"
                confirme:
                  type: boolean
                  description: Confirmation explicite exigee quand le plafond de taille est franchi.
      responses:
        "200":
          description: >-
            La campagne est partie — au moins un destinataire a ete joint. Le
            corps rend le compte REEL, les echecs un par un, et l'etat du
            registre des destinataires : un envoi qui s'annonce sans se compter
            est exactement le bogue que cette route a porte.
          content:
            application/json:
              schema:
                type: object
                required: [ok, envoyes, exclus, campagneId]
                properties:
                  ok:
                    type: boolean
                    const: true
                  envoyes:
                    type: integer
                  echoues:
                    type: integer
                  echecs:
                    type: array
                    items:
                      $ref: "#/components/schemas/CampaignFailure"
                  registre:
                    type: object
                    description: >-
                      Les lignes ecrites au registre des destinataires, et
                      celles perdues. Un registre muet qui se croit complet est
                      pire que pas de registre.
                    properties:
                      ecrits: { type: integer }
                      echecs: { type: integer }
                      frequenceEchecs:
                        type: integer
                        description: >-
                          Envois REUSSIS dont le quota de frequence (art. 56 1)
                          n'a pas pu etre inscrit : le courriel est parti, mais
                          la prochaine campagne retrouvera cette personne comme
                          si de rien n'etait. Ce n'est PAS un echec de
                          livraison, et cela ne compte pas dans `echoues`.
                  exclus:
                    $ref: "#/components/schemas/CampaignExclusions"
                  campagneId:
                    type: string
                    description: >-
                      L'identifiant que porte l'entree d'audit ET la partition
                      du registre des destinataires
                      (`GET /admin/campaigns/{campagneId}/recipients`).
        "400":
          description: Malformed JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TemplateNotFound"
        "409":
          description: >-
            `confirmation_requise` — l'audience depasse le plafond de taille.
            La demande est bien formee ; c'est l'ETAT de l'audience qui exige un
            second geste. L'erreur porte `total` et `limite`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "422":
          description: >-
            Cible refusee, gabarit transactionnel detourne en reclame
            (`gabarit_transactionnel`), copie absente (`copie_manquante`),
            copie double (`copie_ambigue`), ou copie composee invalide
            (`sujet_bilingue`, `corps_trop_long`, `html_interdit`,
            `partage_interdit`, `jeton_inconnu`, `champ_requis`…).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "502":
          description: >-
            `envoi_echoue` — la resolution a designe des destinataires et AUCUN
            n'a ete joint. Le mailer de la console rendait `undefined` sans
            lever quand l'expediteur n'etait pas configure, et cette route
            lisait "pas d'exception" comme "parti" : une production mal cablee
            annoncait "campagne envoyee" en n'ayant rien envoye. Le refus porte
            l'echec de CHAQUE destinataire.
          content:
            application/json:
              schema:
                type: object
                required: [errors]
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string }
                        message: { type: string }
                  echecs:
                    type: array
                    items:
                      $ref: "#/components/schemas/CampaignFailure"
                  campagneId: { type: string }
        "503":
          description: >-
            `envoi_indisponible` — aucun expediteur n'est cable sur cette
            console. Rien n'a ete envoye et aucun quota n'a ete consomme.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"

  /admin/usagers/{courriel}:
    parameters:
      - name: courriel
        in: path
        required: true
        schema: { type: string, format: email }
        description: >-
          L'adresse, encodee. Elle EST la cle de l'index CLIENT# : elle se
          normalise (minuscules, rognee) cote serveur, a un seul endroit.
    get:
      operationId: getAdminDossierUsager
      summary: Ouvrir le dossier d'une personne (Loi 25, art. 27).
      description: >-
        Ce que Nota detient sur UNE personne : ses offres, ce qu'elle a paye, ce
        que l'acte a regle, ses avis, ses consentements, ce qui lui a ete envoye
        et les entrees d'audit qui nomment ses offres. Assemble par une Query
        sur l'index CLIENT# — le pointeur ecrit a la publication — et jamais par
        un balayage, que le role IAM refuse.

        Demande `subjects:read`. Sans `pii:read` en plus, TOUT ce qui nomme
        quelqu'un est masque : adresse reconnaissable mais non expediable, nom
        et telephone remplaces, dossier d'intake et reponses de tarification
        retires. Une personne inconnue rend un dossier VIDE, jamais une erreur.

        JOURNALISE SOUS `dossier_usager_consulte`, avec l'empreinte du sujet et
        le regime de lecture (`enClair`). Cette porte rend le MEME dossier que
        l'export : ne tracer que l'export rendrait la trace facultative.
      security:
        - adminSession: []
      responses:
        "200":
          description: Le dossier, masque ou en clair selon `pii:read`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DossierUsager"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: "`courriel_invalide` — une adresse est requise pour ouvrir un dossier."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"

  /admin/usagers/{courriel}/export:
    parameters:
      - name: courriel
        in: path
        required: true
        schema: { type: string, format: email }
    get:
      operationId: exportAdminDossierUsager
      summary: Exporter le dossier d'une personne (droit a la portabilite).
      description: >-
        Le meme dossier, dans une enveloppe VERSIONNEE et datee, accompagne de la
        politique de conservation : la personne doit pouvoir lire combien de
        temps chaque chose est gardee sans avoir a le redemander.

        Demande `subjects:read`, et laisse une entree d'audit
        (`dossier_usager_exporte`) qui dit qui a exporte, combien, et quand. Le
        sujet y est nomme par une EMPREINTE, jamais par son adresse : le journal
        se lit avec `audit:read`, delibarement distinct de `pii:read`, et en
        faire un second annuaire d'adresses defierait ce decouplage.
      security:
        - adminSession: []
      responses:
        "200":
          description: L'enveloppe d'export.
          content:
            application/json:
              schema:
                type: object
                required: [format, genereLe, courriel, dossier, conservation]
                properties:
                  format:
                    type: string
                    const: nota.dossier-usager.v1
                    description: Un export sans version ne se relit pas dans dix ans.
                  genereLe: { type: string, format: date-time }
                  genereePar: { type: [string, "null"] }
                  courriel: { type: string }
                  enClair: { type: boolean }
                  dossier:
                    $ref: "#/components/schemas/DossierUsager"
                  conservation:
                    type: array
                    items:
                      $ref: "#/components/schemas/RetentionLine"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: "`courriel_invalide`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"

  /admin/usagers/{courriel}/effacement:
    parameters:
      - name: courriel
        in: path
        required: true
        schema: { type: string, format: email }
    post:
      operationId: eraseAdminDossierUsager
      summary: Effacer le dossier d'une personne (Loi 25, art. 28).
      description: >-
        POST et non DELETE, delibarement : ce geste porte un corps et rend un
        PLAN. Sans `confirmer: true` il ne detruit RIEN — pas meme la marque —
        et sert de previsualisation, le seul moyen honnete de montrer ce qui
        partira ET ce qui restera avant de trancher.

        L'EFFACEMENT N'EST PAS INCONDITIONNEL. La frontiere est decidee par le
        domaine : une offre dont l'acte est REGLE est conservee (piece comptable,
        et l'acte notarie engage les obligations professionnelles propres du
        notaire), un acte EN COURS aussi (effacer la partie a mi-mandat
        abandonnerait le notaire), le journal d'audit et les REFUS survivent
        toujours. `complet` est faux des qu'une donnee identifiante survit.

        RIEN N'EST ANNONCE COMME EFFACE SANS L'AVOIR ETE : une offre n'entre dans
        `effacees` qu'apres une ecriture reussie ; une ecriture refusee la met
        dans `enAttente`, avec un `avertissement`. En production, le role IAM de
        la console est en lecture seule sur la table des clients (infra/admin.tf)
        — voir la note de la region « usagers » dans admin.js.

        Demande `subjects:erase`, qui n'est JAMAIS un corollaire de
        `subjects:read` : lire un dossier et le detruire ne sont pas la meme
        decision. Journalise sous `dossier_usager_efface`.
      security:
        - adminSession: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmer:
                  type: boolean
                  description: >-
                    Absent ou faux : previsualisation, rien n'est touche. Vrai :
                    l'effacement s'execute.
      responses:
        "200":
          description: Le plan, et ce qui a reellement ete efface.
          content:
            application/json:
              schema:
                type: object
                required: [execute, courriel, plan, effacees, enAttente]
                properties:
                  execute:
                    type: boolean
                    description: Faux pour une previsualisation.
                  courriel: { type: string }
                  plan:
                    $ref: "#/components/schemas/ErasurePlan"
                  effacees:
                    type: array
                    items: { type: string }
                    description: Les offres REELLEMENT effacees, ecriture confirmee.
                  enAttente:
                    type: array
                    items: { type: string }
                    description: >-
                      Les offres que le plan autorisait a effacer et dont
                      l'ecriture a ete refusee. Jamais annoncees comme effacees.
                  marque:
                    type: [object, "null"]
                    properties:
                      courriel: { type: string }
                      at: { type: [string, "null"] }
                  avertissement:
                    type: [string, "null"]
                    description: Present des qu'une partie de l'effacement n'a pas pu etre ecrite.
        "400":
          description: Malformed JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: "`courriel_invalide`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"

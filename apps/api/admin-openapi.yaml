openapi: 3.1.0
info:
  title: Nota Admin API
  version: 0.1.0
  description: >-
    HTTP API for the Nota admin console (admin.nota.ca). A separate surface from
    the public API — its own Lambda (apps/api/admin.js), its own signing secret,
    read-only IAM on the customer table and read/write only on the separate
    admin table. Auth is a passwordless magic link: request → e-mailed
    single-use link → short-lived server-backed session presented as a Bearer
    token on every call. Responses never reveal whether an address is an admin
    (no account enumeration), and every response carries
    `X-Robots-Tag: noindex`.


    NOTE: this specification is kept in sync with
    `apps/api/src/admin-handler.js` **by hand** for now. When a route or field
    changes there, update it here in the same change (see AGENTS.md).
  license:
    name: UNLICENSED
servers:
  - url: /api
    description: Same-origin path fronted by the admin CloudFront distribution.
  - url: http://localhost:8790
    description: Local dev admin API (apps/api/admin-local-server.js).
components:
  securitySchemes:
    adminSession:
      type: http
      scheme: bearer
      description: >-
        Admin session token minted by `/admin/auth/verify`. A valid signature is
        necessary but not sufficient — the server-side session must exist, be
        un-revoked, inside its 12 h absolute window and not idle past 30 min.
  schemas:
    Errors:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code:
                type: string
              message:
                type: string
    CommissionBareme:
      type: object
      description: >-
        The rating-earned commission schedule (ADR 0016/0020): the base rate,
        the floor a bonus can never cross, and the tiers — each a minimum
        one-decimal average (`note`), a minimum number of evaluations (`avis`)
        and the rate reduction it earns (`bonus`). Rates are fractions
        (0.10 = 10 %).
      required: [taux, plancher, paliers]
      properties:
        taux:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1
        plancher:
          type: number
          minimum: 0
        paliers:
          type: array
          maxItems: 10
          items:
            type: object
            required: [note, avis, bonus]
            properties:
              note:
                type: number
                minimum: 1
                maximum: 5
              avis:
                type: integer
                minimum: 1
              bonus:
                type: number
                exclusiveMinimum: 0
    CommissionBaremeStored:
      allOf:
        - $ref: "#/components/schemas/CommissionBareme"
        - type: object
          required: [updatedAt]
          properties:
            updatedAt:
              type: [string, "null"]
              description: ISO datetime of the last change.
    CancellationBareme:
      type: object
      description: >-
        The late-cancellation fee schedule (ADR 0023): ascending tiers, each a
        maximum number of days left before the signing (`maxJours`) and the
        fraction of the agreed montant retained (`taux`, 0.30 = 30 %). Beyond
        the last tier cancellation is free; an EMPTY list makes cancellation
        free everywhere (the kill-switch is data, not a flag).
      required: [paliers]
      properties:
        paliers:
          type: array
          maxItems: 10
          items:
            type: object
            required: [maxJours, taux]
            properties:
              maxJours:
                type: integer
                minimum: 0
              taux:
                type: number
                exclusiveMinimum: 0
                exclusiveMaximum: 1
    CancellationBaremeStored:
      allOf:
        - $ref: "#/components/schemas/CancellationBareme"
        - type: object
          required: [updatedAt]
          properties:
            updatedAt:
              type: [string, "null"]
              description: ISO datetime of the last change.
    EmailOverride:
      type: object
      description: >-
        The stored per-template override (ADR 0018). `enabled: false` is a
        kill-switch for the template; `subjectFr`/`subjectEn` (both non-null,
        or both null) replace the built-in bilingual subject with `{{token}}`
        interpolation over the template's declared placeholder vocabulary.
        Bodies are never editable — the branded layout, CASL footer and
        unsubscribe plumbing stay guaranteed by code.
      required: [key, enabled, subjectFr, subjectEn, updatedAt]
      properties:
        key:
          type: string
        enabled:
          type: boolean
        subjectFr:
          type: [string, "null"]
        subjectEn:
          type: [string, "null"]
        updatedAt:
          type: [string, "null"]
          description: ISO datetime of the last change.
    EmailTemplate:
      type: object
      description: One registry entry (emails.js TEMPLATE_META) merged with its stored override.
      required: [key, audience, labelFr, labelEn, defaultSubjectFr, defaultSubjectEn, placeholders, override]
      properties:
        key:
          type: string
        audience:
          type: string
          enum: [client, notaire, partenaire, operateur, admin]
        labelFr:
          type: string
        labelEn:
          type: string
        defaultSubjectFr:
          type: string
        defaultSubjectEn:
          type: string
        placeholders:
          type: array
          description: The only `{{token}}` names a subject override may use.
          items:
            type: string
            enum: [montant, service, date, code, n, note, etude, email]
        override:
          oneOf:
            - type: "null"
            - type: object
              required: [enabled, subjectFr, subjectEn, updatedAt]
              properties:
                enabled:
                  type: boolean
                subjectFr:
                  type: [string, "null"]
                subjectEn:
                  type: [string, "null"]
                updatedAt:
                  type: [string, "null"]
    SessionGrant:
      type: object
      required: [ok, session, expiresAt]
      properties:
        ok:
          type: boolean
          const: true
        session:
          type: string
          description: Bearer token for subsequent admin calls.
        role:
          type: string
          enum: [super_admin, analyst]
        expiresAt:
          type: string
          format: date-time
          description: Absolute session expiry (hard 12 h cap; refresh never extends it).
  responses:
    Unauthorized:
      description: Missing, invalid, expired, idled-out or revoked session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Errors"
          example:
            errors:
              - code: non_autorise
                message: Session invalide ou expirée.
    Forbidden:
      description: Authenticated, but the role lacks the required permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Errors"
          example:
            errors:
              - code: interdit
                message: Réservé à l’administrateur principal.
    TemplateNotFound:
      description: The template key is not in the registry (emails.js TEMPLATE_META).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Errors"
          example:
            errors:
              - code: modele_inconnu
                message: "Modèle de courriel inconnu : nope."
paths:
  /admin/auth/request:
    post:
      operationId: requestAdminLogin
      summary: Request a magic sign-in link.
      description: >-
        Always answers `200 {ok: true}` for a well-formed request, whether or
        not the address is on the admin allowlist — the body never distinguishes
        an admin from a stranger. Rate-limited per source IP. Outside
        production, the response additionally echoes the link as `devLink` so
        local dev completes the flow without a mailbox.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Accepted (regardless of allowlist membership).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
                  devLink:
                    type: string
                    description: Dev/test only — the magic link itself. Never present in production.
        "400":
          description: Malformed JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "429":
          description: Per-IP rate limit hit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
  /admin/auth/verify:
    post:
      operationId: verifyAdminMagicLink
      summary: Redeem a magic-link token for a session.
      description: >-
        Single-use — the challenge is consumed atomically, so a replayed link is
        rejected with 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Session established.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionGrant"
        "400":
          description: Malformed JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "401":
          description: Invalid, expired or already-used link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
  /admin/auth/refresh:
    post:
      operationId: refreshAdminSession
      summary: Slide the idle window and re-mint the session token.
      description: >-
        Keep-alive for an active operator. Never extends the absolute 12 h cap
        set at login.
      security:
        - adminSession: []
      responses:
        "200":
          description: Fresh token for the same session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionGrant"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/auth/logout:
    post:
      operationId: adminLogout
      summary: Revoke the server-side session.
      description: "Idempotent — always `200 {ok: true}`, even for an invalid token."
      security:
        - adminSession: []
      responses:
        "200":
          description: Session revoked (or was already invalid).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
  /admin/me:
    get:
      operationId: getAdminMe
      summary: The authenticated operator's identity and permissions.
      security:
        - adminSession: []
      responses:
        "200":
          description: Current principal.
          content:
            application/json:
              schema:
                type: object
                required: [email, role, permissions]
                properties:
                  email:
                    type: string
                  role:
                    type: string
                    enum: [super_admin, analyst]
                  permissions:
                    type: array
                    items:
                      type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/notifications/templates:
    get:
      operationId: listAdminEmailTemplates
      summary: The email-template registry merged with the stored overrides.
      description: >-
        Every template in the emails.js registry (TEMPLATE_META) — audience,
        bilingual labels, default subjects and allowed `{{token}}` placeholders
        — each carrying its stored override, or `null` when the built-in
        behaviour stands. Open to ANY authenticated admin: an analyst sees the
        state read-only; only super_admin can write (ADR 0018 §3).
      security:
        - adminSession: []
      responses:
        "200":
          description: The merged template list.
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items:
                      $ref: "#/components/schemas/EmailTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/notifications/templates/{key}:
    put:
      operationId: putAdminEmailTemplate
      summary: Store (replace) one template's override.
      description: >-
        super_admin only (`notifications:write`) — an analyst gets 403. The
        body is a FULL replacement: `enabled` defaults to `true` when omitted,
        subjects must be provided both-or-neither (the notifier's bilingual
        contract needs both sides), each at most 200 characters and using only
        that template's declared `{{token}}` placeholders. Every change is
        audit-logged with its before/after.
      security:
        - adminSession: []
      parameters:
        - name: key
          in: path
          required: true
          description: A template key from the registry (e.g. `offerPublished`).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: "`false` disables the template entirely (kill-switch)."
                subjectFr:
                  type: string
                  maxLength: 200
                subjectEn:
                  type: string
                  maxLength: 200
      responses:
        "200":
          description: The stored override.
          content:
            application/json:
              schema:
                type: object
                required: [ok, override]
                properties:
                  ok:
                    type: boolean
                    const: true
                  override:
                    $ref: "#/components/schemas/EmailOverride"
        "400":
          description: Malformed JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TemplateNotFound"
        "422":
          description: >-
            Invalid override: non-boolean `enabled`, a subject over 200
            characters, an unknown `{{token}}` for this template, or a subject
            provided in only one language.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
    delete:
      operationId: resetAdminEmailTemplate
      summary: Remove one template's override (reset to the built-in behaviour).
      description: >-
        super_admin only (`notifications:write`). Idempotent; audit-logged with
        the removed record as `before`.
      security:
        - adminSession: []
      parameters:
        - name: key
          in: path
          required: true
          description: A template key from the registry.
          schema:
            type: string
      responses:
        "200":
          description: Override removed (or none existed).
          content:
            application/json:
              schema:
                type: object
                required: [ok, key]
                properties:
                  ok:
                    type: boolean
                    const: true
                  key:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TemplateNotFound"
  /admin/commission:
    get:
      operationId: getAdminCommissionSchedule
      summary: The commission barème — defaults, stored override, and what is in force.
      description: >-
        ADR 0021 §4. `defaut` is the deployment's schedule (built-ins overlaid
        by the `NOTA_COMMISSION_*` environment); `override` is the barème Nota
        stored from this console, or `null`; `effectif` is whichever of the two
        billing prices with right now. Open to ANY authenticated admin — an
        analyst sees the state read-only.
      security:
        - adminSession: []
      responses:
        "200":
          description: The barème as billing resolves it.
          content:
            application/json:
              schema:
                type: object
                required: [defaut, override, effectif]
                properties:
                  defaut:
                    $ref: "#/components/schemas/CommissionBareme"
                  override:
                    oneOf:
                      - $ref: "#/components/schemas/CommissionBaremeStored"
                      - type: "null"
                  effectif:
                    $ref: "#/components/schemas/CommissionBareme"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: putAdminCommissionSchedule
      summary: Store (replace) the barème Nota decides.
      description: >-
        super_admin only (`settings:write`) — an analyst gets 403. The body is
        a FULL replacement, validated loudly: `taux` in (0, 1), `plancher`
        between 0 and the taux, at most 10 paliers, each with a `note` between
        1 and 5, an integer `avis` ≥ 1 and a `bonus` in (0, taux]. Takes
        effect at the next pricing — no deploy. Audit-logged with its
        before/after.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommissionBareme"
      responses:
        "200":
          description: The stored barème.
          content:
            application/json:
              schema:
                type: object
                required: [ok, override]
                properties:
                  ok:
                    type: boolean
                    const: true
                  override:
                    $ref: "#/components/schemas/CommissionBaremeStored"
        "400":
          description: Malformed JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >-
            Invalid barème: `taux_invalide`, `plancher_invalide`,
            `paliers_invalides` (not a list of at most 10) or `palier_invalide`
            (a malformed tier).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
    delete:
      operationId: resetAdminCommissionSchedule
      summary: Remove the stored barème (back to the environment defaults).
      description: >-
        super_admin only (`settings:write`). Idempotent; audit-logged with the
        removed barème as `before`.
      security:
        - adminSession: []
      responses:
        "200":
          description: Barème removed (or none existed).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/annulation:
    get:
      operationId: getAdminCancellationSchedule
      summary: The cancellation-fee barème — defaults, stored override, and what is in force.
      description: >-
        ADR 0023 §2. `defaut` is the deployment's schedule (built-ins overlaid
        by the `NOTA_CANCELLATION_TIERS` environment); `override` is the barème
        Nota stored from this console, or `null`; `effectif` is whichever of
        the two the public cancel route resolves with right now. Open to ANY
        authenticated admin — an analyst sees the state read-only.
      security:
        - adminSession: []
      responses:
        "200":
          description: The barème as the cancel route resolves it.
          content:
            application/json:
              schema:
                type: object
                required: [defaut, override, effectif]
                properties:
                  defaut:
                    $ref: "#/components/schemas/CancellationBareme"
                  override:
                    oneOf:
                      - $ref: "#/components/schemas/CancellationBaremeStored"
                      - type: "null"
                  effectif:
                    $ref: "#/components/schemas/CancellationBareme"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: putAdminCancellationSchedule
      summary: Store (replace) the barème Nota decides.
      description: >-
        super_admin only (`settings:write`) — an analyst gets 403. The body is
        a FULL replacement, validated loudly: at most 10 paliers, each with an
        integer `maxJours` ≥ 0 and a `taux` in (0, 1), `maxJours` strictly
        ascending. An EMPTY list is valid — it makes cancellation free
        everywhere. Takes effect at the next cancellation — no deploy.
        Audit-logged with its before/after.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancellationBareme"
      responses:
        "200":
          description: The stored barème.
          content:
            application/json:
              schema:
                type: object
                required: [ok, override]
                properties:
                  ok:
                    type: boolean
                    const: true
                  override:
                    $ref: "#/components/schemas/CancellationBaremeStored"
        "400":
          description: Malformed JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >-
            Invalid barème: `paliers_invalides` (not a list of at most 10),
            `palier_invalide` (a malformed tier) or `paliers_desordonnes`
            (days not strictly ascending).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
    delete:
      operationId: resetAdminCancellationSchedule
      summary: Remove the stored barème (back to the environment defaults).
      description: >-
        super_admin only (`settings:write`). Idempotent; audit-logged with the
        removed barème as `before`.
      security:
        - adminSession: []
      responses:
        "200":
          description: Barème removed (or none existed).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/metrics/overview:
    get:
      operationId: getAdminMetricsOverview
      summary: The Overview dashboard payload.
      description: >-
        History (offers, retentions, completed acts) read from the sharded
        STATS# rollup counters over a date range, plus present-tense inventory
        computed live from the carnet — no table Scan anywhere.
      security:
        - adminSession: []
      parameters:
        - name: from
          in: query
          required: false
          description: Range start, `YYYY-MM-DD`. Defaults to 29 days before `to`.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Range end, `YYYY-MM-DD`. Defaults to today.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Aggregated metrics for the range.
          content:
            application/json:
              schema:
                type: object
                required: [range, kpis, gauge, series, parrainages]
                properties:
                  range:
                    type: object
                    required: [from, to, days]
                    properties:
                      from:
                        type: string
                        format: date
                      to:
                        type: string
                        format: date
                      days:
                        type: integer
                  kpis:
                    type: object
                    required: [offersPosted, offersRetained, retentionRate, commissionCents, commissionRate, actsCompleted]
                    properties:
                      offersPosted:
                        type: integer
                      offersRetained:
                        type: integer
                      retentionRate:
                        type: number
                        description: 0..1 fraction (the console also accepts 0..100).
                      commissionCents:
                        type: integer
                      commissionRate:
                        type: number
                        description: >-
                          The configured platform commission rate (0..1 fraction,
                          NOTA_COMMISSION_RATE) behind commissionCents — surfaced
                          so the console never hardcodes it.
                      actsCompleted:
                        type: integer
                  gauge:
                    type: object
                    required: [open, retained, activeNotaries, onboardingNotaries]
                    properties:
                      open:
                        type: integer
                      retained:
                        type: integer
                      activeNotaries:
                        type: integer
                      onboardingNotaries:
                        type: integer
                  series:
                    type: object
                    required: [offersPerDay, byService]
                    properties:
                      offersPerDay:
                        type: array
                        items:
                          type: object
                          required: [date, count]
                          properties:
                            date:
                              type: string
                              format: date
                            count:
                              type: integer
                      byService:
                        type: array
                        items:
                          type: object
                          required: [serviceId, nom, offers, retained]
                          properties:
                            serviceId:
                              type: string
                            nom:
                              type: string
                            offers:
                              type: integer
                            retained:
                              type: integer
                  parrainages:
                    type: object
                    description: >-
                      Partner referral ledger (ADR 0011). Amounts due (`du`,
                      `retenues`, `notairesActifs`) are ALL-TIME and monotonic:
                      they read the durable earning events recorded at retain
                      time, reconciled (max, never summed) with the live month
                      window that still enriches the softer columns (`demandes`,
                      `completes`). `client` / `notaire` are the flat per-track
                      reward amounts in DOLLARS; each code row is joined with
                      the POST /partenaires registry (type, courriel,
                      typeNom/typeNomEn present only when the code was claimed),
                      and every registered code appears even with zero activity.
                    required: [client, notaire, codes]
                    properties:
                      client:
                        type: integer
                        description: Flat reward (in dollars) per referred demand retained.
                      notaire:
                        type: integer
                        description: Flat reward (in dollars) when a referred notary retains their first act.
                      codes:
                        type: array
                        items:
                          type: object
                          required: [code, demandes, retenues, completes, notaires, notairesActifs, du, type, courriel]
                          properties:
                            code:
                              type: string
                            demandes:
                              type: integer
                            retenues:
                              type: integer
                            completes:
                              type: integer
                            notaires:
                              type: integer
                            notairesActifs:
                              type: integer
                            du:
                              type: integer
                              description: Total owed to this partner, in DOLLARS.
                            type:
                              type: string
                              nullable: true
                              description: REFERRAL.partners id, null while unclaimed.
                            courriel:
                              type: string
                              nullable: true
                            typeNom:
                              type: string
                            typeNomEn:
                              type: string
        "401":

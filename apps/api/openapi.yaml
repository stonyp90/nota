              properties:
                id: { type: string }
                dateISO: { type: string, format: date }
                nom: { type: string, maxLength: 120 }
                taille:
                  type: integer
                  description: Taille declaree, en octets. Bornee a 15 Mo par le domaine.
                type:
                  type: string
                  description: >-
                    Type MIME declare. Il doit s'accorder a l'extension du nom,
                    et il est FIGE dans l'autorisation signee : une autorisation
                    emise pour un PDF ne peut pas servir a deposer autre chose.
      responses:
        "200":
          description: Le document cree et son autorisation de depot.
          content:
            application/json:
              schema:
                type: object
                required: [document, depot]
                properties:
                  document: { $ref: "#/components/schemas/ChatDocument" }
                  depot: { $ref: "#/components/schemas/DepotAutorisation" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          description: Aucun stockage configure sur ce deploiement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
  /notary/bids/documents/confirme:
    post:
      operationId: notaryConfirmDocument
      summary: Confirmer qu'un document est bien arrive dans le stockage.
      description: >-
        Le serveur CONSTATE le depot ; il ne croit pas le navigateur sur parole.
        Sans cela, n'importe qui pourrait faire apparaitre dans le fil une piece
        jamais televersee. Le document passe alors a `pret` et devient visible
        pour l'autre partie.
      security:
        - notarySession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO, documentId]
              properties:
                id: { type: string }
                dateISO: { type: string, format: date }
                documentId: { type: string }
      responses:
        "200":
          description: Le document, desormais pret.
          content:
            application/json:
              schema:
                type: object
                required: [document]
                properties:
                  document: { $ref: "#/components/schemas/ChatDocument" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          description: Aucun stockage configure sur ce deploiement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
  /notary/bids/message:
    post:
      operationId: notarySendMessage
      summary: Write to the client of a retained act (conversation de l'acte retenu).
      description: >-
        The retained-act thread (domain `validateChatMessage`): it only exists
        while the bid is RETAINED, and only for the notary who holds it (any
        other notary -> 403 `interdit`). The thread is read back on
        `GET /notary/bids` (retained entries) and `GET /client/bid`; both
        consoles poll it — messages trigger no email.
      security:
        - notarySession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO, texte]
              properties:
                id:
                  type: string
                dateISO:
                  type: string
                  format: date
                texte:
                  type: string
                  maxLength: 500
                token:
                  type: string
                  description: Session token fallback when no Authorization header is sent.
      responses:
        "200":
          description: Message appended to the thread.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    $ref: "#/components/schemas/ChatMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "410":
          description: Offer expired or has no valid expiry date (offre_expiree).
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >-
            Domain errors: `message_requis`, `message_trop_long`,
            `offre_non_retenue`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /notary/bids/indemnite:
    post:
      operationId: decideIndemnite
      summary: The retaining notary claims, or waives, the indemnity of a late cancellation (ADR 0041).
      description: >-
        A client cancelled a RETAINED act inside the barème's window. Nothing
        was charged: the cancellation opened a claim window (bid.annulation,
        `statut: en_attente`) capped at the palier's rate. Here the notary
        either CLAIMS an amount at or under the cap, with a written
        justification of real costs and work done (art. 2129 C.c.Q.), or WAIVES
        by claiming 0. A claim is collected by partial capture of the live hold
        or off session on the registered card, and transferred whole to the
        notary (ADR 0033). Waiving, or the deadline passing, releases the hold
        and moves nothing. Session-scoped token; only the notary who retained.
      security:
        - notarySession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO, montant]
              properties:
                id:
                  type: string
                dateISO:
                  type: string
                  format: date
                montant:
                  type: number
                  minimum: 0
                  description: Dollars claimed, at or under `annulation.plafond`; 0 waives.
                justification:
                  type: string
                  description: Required when montant > 0 (20 to 600 characters).
      responses:
        "200":
          description: The decision is recorded; `annulation.statut` says what happened.
          content:
            application/json:
              schema:
                type: object
                required: [bid, annulation]
                properties:
                  bid:
                    $ref: "#/components/schemas/Bid"
                  annulation:
                    type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No claim is pending (`indemnite_close`), or the deadline passed (`indemnite_echue`, closed without charge).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /notary/bids/release:
    post:
      operationId: releaseRetainedBid
      summary: Withdraw AFTER accepting — the act returns to the open market (désistement).
      description: >-
        A notary who retained an act may still withdraw when a surfaced detail
        (an unfamiliar lender, a conflict) makes the file impossible on their
        side (domain `validateRelease`). The bid returns to the carnet exactly
        as the client posted it (same date, amount, dossier); the withdrawing
        notary stops seeing it (decline marker) and their calendar pointer is
        dropped. The client is emailed (`actReleased`); the operator is alerted
        when a payment may be in flight or a reason was given.
      security:
        - notarySession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO]
              properties:
                id:
                  type: string
                dateISO:
                  type: string
                  format: date
                message:
                  type: string
                  maxLength: 500
                  description: Optional reason, relayed to the operator (never shown publicly).
                token:
                  type: string
      responses:
        "200":
          description: The bid, back on the open market (public projection).
          content:
            application/json:
              schema:
                type: object
                required: [bid]
                properties:
                  bid:
                    $ref: "#/components/schemas/Bid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "410":
          description: Offer expired or has no valid expiry date (offre_expiree).
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >-
            Domain errors: `offre_non_retenue` (the bid is not retained),
            `message_trop_long`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /notary/acts:
    get:
      operationId: listNotaryActs
      summary: The notary's statement — every settled act, and what Nota kept on each.
      description: >-
        Full disclosure of the split, act by act (owner, 2026-09-01): what the
        client paid, the rate applied, Nota's share, the net, and the cote that
        earned that rate. Nothing aggregate-only — the per-act line IS the
        disclosure; `totaux` merely sums the lines shown. The figures come from
        the write-once ACT# ledger, frozen at settlement: a later barème edit
        never rewrites an act already paid. Acts settled before ADR 0028 carry
        no stored `taux` — it is then derived from what was actually charged,
        never from today's barème — and their `cote` is null. Newest first, by
        settlement then by signing date.
      security:
        - notarySession: []
      responses:
        "200":
          description: The settled acts of the signed-in notary, and their totals.
          content:
            application/json:
              schema:
                type: object
                required: [actes, totaux]
                properties:
                  actes:
                    type: array
                    items:
                      type: object
                      required: [bidId, dateISO, serviceId, service, montant, taux, commission, net, cote, completedAt, paye, du]
                      properties:
                        bidId:
                          type: string
                        dateISO:
                          type: [string, "null"]
                          format: date
                          description: The signing date of the act.
                        serviceId:
                          type: [string, "null"]
                        service:
                          type: [string, "null"]
                          description: The service's fr-CA label, null when the id is unknown.
                        montant:
                          type: number
                          description: The value settled at signing, in dollars.
                        taux:
                          type: number
                          description: >-
                            The rate applied to THIS act. Stored at settlement
                            since ADR 0028; derived from the commission actually
                            charged for older acts.
                        commission:
                          type: number
                          description: Nota's share of this act, in dollars.
                        net:
                          type: number
                          description: What the notary keeps (montant − commission).
                        cote:
                          type: [integer, "null"]
                          minimum: 0
                          maximum: 100
                          description: The cote at the moment of settlement; null before ADR 0028.
                        completedAt:
                          type: [string, "null"]
                          description: When the act was settled.
                        paye:
                          type: boolean
                          description: True once the money actually moved (capture or transfer).
                        du:
                          type: number
                          description: >-
                            What the notary still owes Nota on this act — the
                            fee of an act settled OUTSIDE the platform (no
                            capturable hold: the client paid the notary
                            directly at signing). 0 once the money moved.
                  totaux:
                    type: object
                    required: [actes, montant, commission, net, du]
                    properties:
                      actes:
                        type: integer
                      montant:
                        type: number
                      commission:
                        type: number
                      net:
                        type: number
                      du:
                        type: number
                        description: The sum still owed to Nota across the statement.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /notary/acts/complete:
    post:
      operationId: completeRetainedAct
      summary: Settle a retained act at its confirmed value — THE payment moment (ADR 0015).
      description: >-
        The notary who retained the bid confirms the act signed and its final
        value. With a live client authorization Nota captures it and transfers
        the net; otherwise the commission model records an unpaid receivable as
        fallback. The act
        ledger is write-once: a duplicate submit answers with the ORIGINAL
        settled figures and never charges twice. The domain bounds the value
        against the retained offer (`validateActValue`, `ACT_VALUE_BOUNDS`) —
        a figure far outside it is a typo, refused before the ledger.
      security:
        - notarySession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bidId, dateISO, actAmount]
              properties:
                bidId:
                  type: string
                dateISO:
                  type: string
                  format: date
                actAmount:
                  type: number
                  description: The value confirmed at signing, in dollars.
      responses:
        "200":
          description: The act is settled (now, or already — same figures either way).
          content:
            application/json:
              schema:
                type: object
                required: [ok, actAmount, commissionCents]
                properties:
                  ok:
                    type: boolean
                  actAmount:
                    type: integer
                    description: The SETTLED value — the ledger's original figure on a duplicate submit.
                  commissionCents:
                    type: integer
                  paid:
                    type: boolean
                    description: True only when the Nota payment ledger records an actual payment or transfer.
                  netCents:
                    type: integer
                  notaryTemplate:
                    oneOf:
                      - type: 'null'
                      - $ref: '#/components/schemas/NotaryOfferTemplate'
                    description: Released to the retaining notary only when `paid` is true.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: This act was not retained by the requesting notary (`acte_non_autorise`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            Domain errors: `montant_invalide`, `montant_hors_bornes` (value far
            outside the retained offer), or a billing refusal
            (`compte_incomplet`, `paiement_echoue`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >-
            The client payment was captured but the transfer failed
            (`virement_en_attente`), or its outcome could not be verified
            (`paiement_a_verifier`). Retry with the same act value; the act
            remains unsettled and Stripe idempotency prevents another debit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /client/bid:
    get:
      operationId: getClientBid
      summary: The client's own offer, propositions, document requests and readiness.
      description: >-
        Requires the per-bid client token whose `sub` equals `id` (any other
        token -> 403 `interdit`). Propositions marked `remplacee` are hidden.
        The client sees each notary's `etude`, never a `notaryId`.
      security:
        - clientToken: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
        - name: dateISO
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The client's view of their bid.
          content:
            application/json:
              schema:
                type: object
                required: [bid, notaire, propositions, demandes, readiness]
                properties:
                  bid:
                    $ref: "#/components/schemas/Bid"
                  notaire:
                    description: >-
                      The notary half of the mise en relation (ADR 0010 §4,
                      complete since ADR 0033): once the bid is RETAINED, the
                      retaining notary's name, étude, phone, address, courriel
                      and fiche — everything the client needs to call them and
                      find the étude. Null while the bid is open — contact
                      flows in neither direction before retention. Still NO
                      rating or cote (ADR 0030).
                    oneOf:
                      - type: "null"
                      - type: object
                        required: [nom, etude, telephone, adresse, courriel, lienCNQ, actes]
                        properties:
                          nom:
                            type: [string, "null"]
                          etude:
                            type: [string, "null"]
                          telephone:
                            type: [string, "null"]
                            description: "As the notary typed it; `domain.telHref` turns it into a tel: link."
                          adresse:
                            type: [string, "null"]
                          courriel:
                            type: [string, "null"]
                          lienCNQ:
                            type: [string, "null"]
                            description: >-
                              The retaining notary's official fiche in the
                              Chambre des notaires directory (ADR 0016) — like
                              `courriel`, only present once retained.
                          actes:
                            type: integer
                            minimum: 0
                            description: >-
                              Acts this notary has carried on Nota. ADR 0030:
                              the client-facing block carries FACTS about a
                              named notary — membership and volume — never an
                              appreciation. The star average and the cote were
                              removed from here (art. 70 of the Code de
                              déontologie: a notary may not use "or allow to be
                              used" a testimonial concerning them); both stay
                              visible to the notary and to Nota.
                  propositions:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClientProposition"
                  demandes:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClientDemande"
                  readiness:
                    $ref: "#/components/schemas/Readiness"
                  messages:
                    type: array
                    description: The retained-act conversation. Empty until a notary retains the bid.
                    items:
                      $ref: "#/components/schemas/ChatMessage"
                  acte:
                    type: object
                    description: >-
                      Act settlement state (ADR 0015) — `complete` flips once
                      the ACT# ledger has settled the signing; the UI keys the
                      evaluation door on it. Once settled, ADR 0028's
                      transparency runs both ways: the client also sees how
                      THEIR amount split, straight from the write-once ledger.
                      The money fields are absent while `complete` is false.
                    required: [complete]
                    properties:
                      complete:
                        type: boolean
                      montant:
                        type: number
                        description: The act value the signing settled on, in dollars.
                      partNota:
                        type: number
                        description: What Nota kept, in dollars.
                      partNotaire:
                        type: number
                        description: What went to the notary, in dollars — the two add up to `montant`.
                      taux:
                        type: [number, "null"]
                        description: The rate applied, frozen at settlement (null on a pre-ADR-0028 act).
                  evaluation:
                    type: [object, "null"]
                    description: The client's evaluation, once submitted (ADR 0021).
                    properties:
                      note:
                        type: integer
                      commentaire:
                        type: [string, "null"]
                  annulation:
                    type: [object, "null"]
                    description: >-
                      What cancelling TODAY would OPEN (ADR 0041): the CAP the
                      retaining notary may claim, with a written justification,
                      within `delaiJours` civil days. Never a fee: art. 13 of
                      the Loi sur la protection du consommateur forbids any
                      amount or percentage fixed in advance, and art. 2129
                      C.c.Q. limits what is owed to real costs and work done.
                      Disclosed before the client confirms. Null when the
                      cancel would open nothing (open offer, no payment means,
                      free window) or is impossible (settled act).
                    properties:
                      taux:
                        type: number
                        description: The cap as a share of the retained montant (e.g. 0.3).
                      plafond:
                        type: number
                        description: The cap in dollars.
                      joursAvant:
                        type: integer
                      delaiJours:
                        type: integer
                        description: Civil days the notary has to claim.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /client/bid/message:
    post:
      operationId: clientSendMessage
      summary: Answer the retaining notary in the retained-act thread.
      description: >-
        Same thread as `/notary/bids/message`, from the client side, guarded by
        the per-bid client token. Only exists while the bid is RETAINED
        (domain `validateChatMessage` -> 422 `offre_non_retenue` otherwise).
      security:
        - clientToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO, texte]
              properties:
                id:
                  type: string
                dateISO:
                  type: string
                  format: date
                texte:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Message appended to the thread.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    $ref: "#/components/schemas/ChatMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "410":
          description: Offer expired or has no valid expiry date (offre_expiree).
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >-
            Domain errors: `message_requis`, `message_trop_long`,
            `offre_non_retenue`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /client/propositions/accept:
    post:
      operationId: acceptProposition
      summary: Accept a notary's proposition — the bid is retained at that price.
      description: >-
        Sets `montant` to the proposition's amount (premium recomputed against
        the bid's floor), marks the proposition `acceptee` and every other
        pending one `refusee`, then retains the bid for that notary through the
        SAME conditional retain path as `/notary/bids/accept` (calendar pointer,
        analytics, "offer retained" email). The proposing notary is emailed
        (`propositionAcceptee`).


        PAY-ON-ACCEPT: nothing is captured here — the card hold was authorized
        for the ORIGINAL amount. With billing on, the bid is flagged
        `paymentStatus` = `a_reautoriser` and settlement is left to
        `/notary/acts/complete`.
      security:
        - clientToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropositionAnswerInput"
      responses:
        "200":
          description: The bid is now retained at the new amount.
          content:
            application/json:
              schema:
                type: object
                required: [bid, proposition]
                properties:
                  bid:
                    $ref: "#/components/schemas/Bid"
                  proposition:
                    $ref: "#/components/schemas/ClientProposition"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Bid (`introuvable`) or proposition (`proposition_introuvable`) not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/AlreadyRetained"
        "410":
          description: Offer expired or has no valid expiry date (offre_expiree).
        "422":
          description: The proposition is no longer pending (`proposition_close`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /client/propositions/decline:
    post:
      operationId: declineProposition
      summary: Decline a notary's proposition — the bid stays open at the client's price.
      description: The proposition becomes `refusee`; the notary is emailed (`propositionRefusee`).
      security:
        - clientToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropositionAnswerInput"
      responses:
        "200":
          description: Proposition declined.
          content:
            application/json:
              schema:
                type: object
                required: [proposition]
                properties:
                  proposition:
                    $ref: "#/components/schemas/ClientProposition"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Bid (`introuvable`) or proposition (`proposition_introuvable`) not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/AlreadyRetained"
        "410":
          description: Offer expired or has no valid expiry date (offre_expiree).
        "422":
          description: The proposition is no longer pending (`proposition_close`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /client/dossier:
    post:
      operationId: updateClientDossier
      summary: Replace the client's dossier (answer to a document request).
      description: >-
        Always allowed for the bid's owner, open or retained. `dossier` must be
        a plain object (else 422 `dossier_invalide`). The stored dossier is
        CLEANED (domain.cleanDossier): only the service's own document/field
        ids, the `__consent` flag and the known `__pricing` answers persist,
        each value bounded — unknown keys and local UI state (`__validated`)
        are dropped. Answers with the fresh domain readiness and each
        demande's `fournie` flag.
        Financing intake also accepts bounded text fields `parties_signature`,
        `contact_preteur`, `changements_immeuble`; refinancing additionally
        accepts `dettes_garanties`. These remain private dossier data.
        Preparation progress does not certify legal or funding readiness.
      security:
        - clientToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO, dossier]
              properties:
                id:
                  type: string
                dateISO:
                  type: string
                  format: date
                dossier:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Dossier replaced.
          content:
            application/json:
              schema:
                type: object
                required: [readiness, demandes]
                properties:
                  readiness:
                    $ref: "#/components/schemas/Readiness"
                  demandes:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClientDemande"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: "`dossier_invalide`: the dossier is not a plain object."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /client/bid/cancel:
    post:
      operationId: cancelClientBid
      summary: Withdraw an offer — open or already retained.
      description: >-
        Guarded by the bid's own CLIENT token. Idempotent: cancelling an
        already-cancelled offer answers 200 with the final state (and never
        charges twice). An OPEN offer simply leaves the carnet (a live card
        hold is released). A RETAINED offer unwinds the mise en relation: the
        retaining notary and the operator are notified, and the signing leaves
        the notary's calendar feed. A LATE cancellation of a retained offer
        carries a fee (ADR 0023) kept by PARTIAL capture of the client's
        existing hold — the barème (days-before-signing paliers) is decided by
        Nota from the admin console; the remainder of the hold is released
        immediately. Every path that keeps no fee releases the hold whole. The
        fee actually kept rides back on `bid.annulation`. A settled act (ACT#
        ledger) refuses with 409 `acte_complete`. Every market surface hides
        the bid afterwards; only the owner keeps reading it via GET
        /client/bid.
      security:
        - clientToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO]
              properties:
                id:
                  type: string
                dateISO:
                  type: string
                  format: date
      responses:
        "200":
          description: The offer is cancelled (status `annulee`).
          content:
            application/json:
              schema:
                type: object
                required: [bid]
                properties:
                  bid:
                    $ref: "#/components/schemas/Bid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            The act is signed and settled (`acte_complete`) — it can no longer
            be cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /client/bid/carte:
    post:
      operationId: registerClientCard
      summary: Register another card on an existing offer (ADR 0035).
      description: >-
        Guarded by the bid's own CLIENT token. Opens a fresh hosted Stripe
        Checkout session for THIS offer, so a client whose card was declined
        when the caution was placed can hand over another one. Without it the
        refusal notice and the daily retry would be theatre: retrying the same
        declined card gives the same decline.


        Which surface opens follows the same rule as publication
        (`domain.cautionDue`): a signing still beyond the caution window opens
        a `setup` session (the card is validated and saved, nothing is held);
        a signing already inside it opens a manual-capture `payment` session,
        so the amount is reserved immediately. `mode` says which. The amount is
        the offer's total TODAY — an accepted counter-offer included.


        The session is idempotent per bid and per day: two clicks the same
        morning reopen the same session, the next day opens a genuinely new
        one.
      security:
        - clientToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO]
              properties:
                id:
                  type: string
                dateISO:
                  type: string
                  format: date
      responses:
        "200":
          description: The hosted Checkout session to send the client to.
          content:
            application/json:
              schema:
                type: object
                required: [checkoutUrl]
                properties:
                  checkoutUrl:
                    type: string
                    format: uri
                  mode:
                    type: string
                    enum: [enregistrement, paiement]
                    description: >-
                      `enregistrement` saves the card without holding a cent;
                      `paiement` reserves the amount right away.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            Nothing to repair: the act is signed and settled (`acte_regle`), or
            the caution is already placed on the client's card
            (`caution_posee`) — opening a second session would hold the amount
            twice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: The offer was cancelled (`annulee`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >-
            `paiement_indisponible` — billing is not configured, or Stripe is
            unreachable. Nothing was charged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /client/welcome:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      operationId: clientWelcome
      summary: Passwordless client signup — send the welcome email.
      description: >-
        The one client-signup call, reached from the sign-in modal and from the
        discreet « Créer mon compte » opt-in of the bid dialog. Fire-and-forget:
        a valid address triggers the (idempotent-per-address) welcome email; a
        missing or invalid one is a silent no-op. Always answers 200 {ok:true}
        so the UI never blocks on mail, and no data is echoed back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                courriel:
                  type: string
                  format: email
      responses:
        "200":
          description: Acknowledged (whether or not an email was sent).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "400":
          description: Invalid JSON body.
  /client/session/request:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      operationId: clientSessionRequest
      summary: Ask for the single-use link that reopens your requests.
      description: >-
        Step 1 of the client space. Proves the MAILBOX before anything is
        returned: publishing indexes every offer under CLIENT#<courriel>, and
        answering that index on a bare address would make it an enumeration and
        account-takeover door. Rate-limited per source IP (fails open) and
        enumeration-safe — a known client and a stranger get the identical
        `{ok:true}`, and a challenge is filed either way so both cost the same
        time. Outside production the response echoes devToken/devLink so the
        handshake closes without a mailbox.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courriel]
              properties:
                courriel:
                  type: string
                  format: email
      responses:
        "200":
          description: Acknowledged — identical whether or not the address is known.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                  devToken:
                    type: string
                    description: Non-production only — the challenge token.
                  devLink:
                    type: string
                    description: Non-production only — the full link.
        "422":
          description: The address is not a valid email; nothing is filed.
        "429":
          description: Per-IP ceiling reached; no link is sent.
        "400":
          description: Invalid JSON body.
  /client/session/verify:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      operationId: clientSessionVerify
      summary: Redeem the link and get back your requests, each with its token.
      description: >-
        Step 2. Atomically consumes the single-use challenge, then returns the
        caller's offers — each carrying a freshly minted per-bid CLIENT token.
        No « person » scope is created: requireClient still demands
        `sub === bid.id`, so every returned token opens exactly one offer. An
        empty list is a 200, never a 404 — the caller proved their mailbox and
        simply has nothing published; a 404 would reveal who is a client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: The caller's offers, oldest date first (possibly empty).
          content:
            application/json:
              schema:
                type: object
                required: [ok, courriel, offres]
                properties:
                  ok:
                    type: boolean
                  courriel:
                    type: string
                    format: email
                  offres:
                    type: array
                    items:
                      type: object
                      required: [id, dateISO, serviceId, clientToken]
                      properties:
                        id:
                          type: string
                        dateISO:
                          type: string
                          format: date
                        expiresOn:
                          type: [string, "null"]
                          format: date
                          description: Last valid day; null on legacy offers.
                        serviceId:
                          type: string
                        montant:
                          type: number
                        status:
                          type: string
                        clientToken:
                          type: string
                          description: CLIENT scope, valid for THIS offer only.
        "401":
          description: Link invalid, expired, or already used.
        "400":
          description: Invalid JSON body.
  /client/evaluation:
    post:
      operationId: evaluateNotary
      summary: Rate the retaining notary once the act is signed (ADR 0015).
      description: >-
        Guarded by the bid's own CLIENT token. Opens only after the act has
        settled (the ACT# ledger has an entry) — before that, 409
        `acte_non_complete`. One evaluation per bid: a re-submit answers 200
        with what is on file (the first note stands). The note feeds the
        notary profile's rating aggregate (`ratingCount`/`ratingSum`; the
        public average is `domain.ratingAverage`).
      security:
        - clientToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO, note]
              properties:
                id:
                  type: string
                dateISO:
                  type: string
                  format: date
                note:
                  type: integer
                  minimum: 1
                  maximum: 5
                commentaire:
                  type: string
                  maxLength: 500
      responses:
        "201":
          description: Evaluation recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationResponse"
        "200":
          description: Already evaluated — the evaluation on file is echoed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`acte_non_complete`: the act is not settled yet."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation errors from the domain (`note_invalide`, `commentaire_trop_long`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contact:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      operationId: sendContactMessage
      summary: Send a message to the Nota team (nous joindre form).
      description: >-
        No auth — anyone stuck deserves a way to reach a human. The domain
        validates (`courriel_invalide`, `message_requis`, `message_trop_long`);
        the operator receives the message and the sender an acknowledgement.
        `bidId` optionally ties the message to an offer for faster triage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courriel, message]
              properties:
                nom:
                  type: string
                  maxLength: 150
                courriel:
                  type: string
                  format: email
                sujet:
                  type: string
                  maxLength: 150
                message:
                  type: string
                  maxLength: 2000
                bidId:
                  type: string
                  description: Optional id of the offer the message is about.
      responses:
        "202":
          description: Message accepted and forwarded.
          content:
            application/json:
              schema:
                type: object
                required: [recu]
                properties:
                  recu:
                    type: boolean
                  threadId:
                    type: string
                    description: >-
                      The support thread this message opened (2026-09-04): a
                      « Nous joindre » message is a support thread too, so the
                      operator answers it from the same inbox.
                  token:
                    type: string
                    description: SUPPORT-scoped token the widget keeps to follow the answer live.
        "422":
          description: Validation errors from the domain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /support/messages:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      operationId: sendSupportMessage
      summary: Live chat — a visitor's message (mints the thread on first send).
      description: >-
        With an assistant configured, explicit human requests, complaints and detected
        sensitive information bypass the model and escalate. Sensitive prior messages
        are masked in model context. Prepared discussion guides cover common topics;
        malformed or unsafe answers escalate to human support.
        The site's chat widget (ADR 0026, assisted by ADR 0046). No auth to
        start: the first message mints the thread and returns its signed
        SUPPORT `token` (the widget keeps it and continues the thread with it,
        via Authorization Bearer or the `token` body field).

        When an assistant is configured, the answer comes back IN THIS
        RESPONSE as `reponse` — grounded strictly in the live catalogue and
        operating policy, and re-checked by the domain before it is stored.
        With the assistant configured, exact help-topic questions use reviewed bilingual
        replies before any model call. Human requests, complaints and detected secrets
        are handed off; the assistant cannot access or change a customer file.
        `escalade: true` means a handoff is pending. Further questions go to the
        operator with the thread and a signed reply link without another automated
        answer. A real operator reply clears `escalade` and sets `humain: true`;
        subsequent questions stay with the person, without invoking the assistant.
        Both state flags are always returned, including on a thread refresh.
        With no assistant configured, `reponse` is
        absent and EVERY message emails the operator, exactly as before.
        `courriel` is optional — it only adds an offline copy of the reply.

        A stale/tampered token is 401 (never a silent new thread); domain
        validation errors are 422 (`message_requis`, `message_trop_long`,
        `courriel_invalide`). Per-IP throttle (ADR 0033 §7): more than 20
        messages in 10 minutes from one source IP → 429 `trop_de_messages`
        (fails open on a counter error) — which also bounds what the assistant
        may cost.
        Appends use optimistic revisions so concurrent visitor/operator messages
        are preserved. Conflicts retry without repeating model work; if contention
        persists, 409 asks the visitor to retry rather than falsely accepting a message.
        Optional messageId makes a continued-thread send idempotent. For an uncertain
        first send, also supply a cryptographically random 32-byte base64url requestKey
        (43 characters). This temporary possession credential selects the same thread
        after a lost response; its raw value is neither stored nor returned. Keep it
        private and reuse it only with the identical first request, then discard it
        after receiving the signed SUPPORT token. Different content with the same key
        returns 409. Concurrent matching requests return 409 message_en_cours while
        one 30-second processing lease owns the work; completed retries return the
        original message and associated assistant response without another model call.
      security:
        - {}
        - supportToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texte]
              properties:
                texte:
                  type: string
                  maxLength: 2000
                courriel:
                  type: string
                  format: email
                  description: Optional — an offline copy of the reply, nothing more.
                token:
                  type: string
                  description: Thread token fallback when the Authorization header is absent.
                messageId:
                  type: string
                  maxLength: 160
                  pattern: '^[A-Za-z0-9_.:@-]+$'
                  description: Stable ID to retain when retrying the identical message.
                requestKey:
                  type: string
                  minLength: 43
                  maxLength: 43
                  pattern: '^[A-Za-z0-9_-]{43}$'
                  writeOnly: true
                  description: Temporary 256-bit random possession credential for first-send recovery; requires messageId.
                locale:
                  type: string
                  enum: [fr, en]
                  description: >-
                    The visitor's language, so the assistant answers in it.
                    Anything other than `en` reads as French.
      responses:
        "201":
          description: Message appended (thread minted on the first one).
          content:
            application/json:
              schema:
                type: object
                required: [threadId, token, message, escalade, humain, duplicate]
                properties:
                  threadId:
                    type: string
                  duplicate:
                    type: boolean
                    description: True when returning an already accepted message.
                  token:
                    type: string
                    description: Signed SUPPORT thread token — keep it to continue and poll.
                  message:
                    $ref: "#/components/schemas/SupportMessage"
                  reponse:
                    allOf:
                      - $ref: "#/components/schemas/SupportMessage"
                    description: >-
                      The assistant's answer, already appended to the thread
                      (ADR 0046). Absent when no assistant is configured or the
                      conversation is waiting for or already handled by a person.
                  escalade:
                    type: boolean
                    description: >-
                      True while a human handoff is pending. Only an actual
                      operator reply clears it; automated follow-up cannot.
                  humain:
                    type: boolean
                    description: >-
                      True once a real operator has replied in this conversation.
                      Further visitor questions stay with the operator.
        "409":
          description: Concurrent updates could not be merged; retry the message (`conversation_occupee`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The token's thread no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation errors from the domain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Per-IP rate limit exceeded (`trop_de_messages`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: trop_de_messages
                    message: Trop de messages en peu de temps. Réessayez dans quelques minutes.
  /support/thread:
    patch:
      operationId: updateSupportEmail
      summary: Save the visitor's reply email without sending another chat message.
      description: >-
        Requires the visitor's SUPPORT bearer token; SUPPORT_OP tokens cannot
        change the address. Saves the normalized email with an optimistic revision
        and preserves concurrent messages and handoff state. Does not invoke the
        assistant, add a chat message, or send an email notification.
      security:
        - supportToken: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courriel]
              properties:
                courriel:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        "200":
          description: Reply email saved.
          content:
            application/json:
              schema:
                type: object
                required: [courriel, escalade, humain]
                properties:
                  courriel:
                    type: string
                    format: email
                  escalade:
                    type: boolean
                  humain:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The token's thread no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Concurrent updates could not be merged; retry saving (`conversation_occupee`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Required email is absent or invalid (`courriel_invalide`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getSupportThread
      summary: Live chat — the thread behind a SUPPORT or SUPPORT_OP token.
      description: >-
        The widget polls here while its panel is open; the operator's reply box
        reads the same thread through the emailed link's SUPPORT_OP token.
        Handoff state comes from persisted history so reopening the widget keeps
        the same human assignment. No operator-only metadata is exposed.
      security:
        - supportToken: []
      responses:
        "200":
          description: Every message of the thread, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [threadId, messages, escalade, humain]
                properties:
                  threadId:
                    type: string
                    description: Validated thread ID, including for signed email-link recovery on another device.
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/SupportMessage"
                  escalade:
                    type: boolean
                    description: True while a human handoff is pending.
                  humain:
                    type: boolean
                    description: True once a real operator has replied in this conversation.
                  courriel:
                    type: string
                    format: email
                    nullable: true
                    description: The visitor's saved email, or null; returned only for a SUPPORT token.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The token's thread no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /support/reply:
    post:
      operationId: sendSupportReply
      summary: Live chat — the operator's reply, through the emailed link token.
      description: >-
        Requires the SUPPORT_OP scope carried by the notification email's reply
        link — a visitor's SUPPORT token is 401 here, so a visitor can never
        speak as Nota. The reply lands in the thread (the widget polls it up)
        and is copied to the visitor's courriel when they left one. It clears
        the pending handoff and keeps subsequent questions with the operator.
        A stable messageId makes retries idempotent across the shared support
        service: the same content returns the original message; different content
        with the same ID is rejected with 409.
      security:
        - supportToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texte]
              properties:
                texte:
                  type: string
                  maxLength: 2000
                token:
                  type: string
                  description: SUPPORT_OP token fallback when the Authorization header is absent.
                messageId:
                  type: string
                  maxLength: 160
                  pattern: '^[A-Za-z0-9_.:@-]+$'
                  description: Stable ID to retain when retrying the same reply.
      responses:
        "200":
          description: Reply appended to the thread.
          content:
            application/json:
              schema:
                type: object
                required: [message, duplicate]
                properties:
                  message:
                    $ref: "#/components/schemas/SupportMessage"
                  duplicate:
                    type: boolean
                    description: True when this message ID had already been accepted.
        "409":
          description: Concurrent updates could not be merged; retry the reply (`conversation_occupee`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The token's thread no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation errors from the domain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /unsubscribe:
    get:
      operationId: unsubscribe
      summary: Record a CASL / Law-25 email opt-out.
      description: >-
        Opened from the unsubscribe link in every email footer. The `token`
        encodes the recipient's address (base64url); the opt-out is recorded
        (an `UNSUB#<email>` item) and the sender checks it before every future
        send. Returns a small fr-CA HTML confirmation page, not JSON, because it
        is opened in a browser. Idempotent — unsubscribing twice is a no-op.
      parameters:
        - name: token
          in: query
          required: true
          description: Base64url-encoded recipient email from the email footer link.
          schema:
            type: string
          example: Y2xpZW50QGV4YW1wbGUuY2E
      responses:
        "200":
          description: Opt-out recorded; a confirmation page is returned.
          content:
            text/html:
              schema:
                type: string
        "400":
          description: The token is missing or does not decode to a valid email.
          content:
            text/html:
              schema:
                type: string
    post:
      operationId: unsubscribeOneClick
      summary: One-click email opt-out (RFC 8058).
      description: >-
        The target of the `List-Unsubscribe` / `List-Unsubscribe-Post` headers
        carried on every outbound email. Mailbox providers (Gmail, Yahoo) POST
        here with no user interaction; the opt-out is recorded exactly as with
        GET. Idempotent.
      parameters:
        - name: token
          in: query
          required: true
          description: Base64url-encoded recipient email from the email headers.
          schema:
            type: string
          example: Y2xpZW50QGV4YW1wbGUuY2E
      responses:
        "200":
          description: Opt-out recorded.
          content:
            text/html:
              schema:
                type: string
        "400":
          description: The token is missing or does not decode to a valid email.
          content:
            text/html:
              schema:
                type: string
  /notaries/signup:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      operationId: notarySignup
      summary: Free notary signup by professional email — no Stripe at the door (2026-09-02).
      description: >-
        The supply-side front door. A notary signs up with their professional
        email and, optionally, the link to their fiche in the Chambre's
        directory (`lienCNQ`, judged by the domain's CNQ rule — ADR 0016) and a
        partner referral code (`parrain`, same rules as POST /bids and
        /notaries/connect: normalized, invalid or self-referral silently
        dropped). A NEW address gets a `NOTARY#` record in status `en_attente`
        stamped `inscritLe`; the operator then checks the Tableau de l'Ordre
        and activates it from the admin console (`POST
        /admin/notaries/{id}/activer` sets `approuveLe`, which is what the
        console gate reads). An EXISTING record only gains a missing `lienCNQ`
        / `parrain` — its status is never downgraded. ENUMERATION-SAFE: every
        valid address answers the same `{ ok: true }`, new, pending or active.
        Per-IP rate-limited like /notary/session/request. Works whether or not
        Stripe is configured; payouts connect later, from inside the console
        (/notaries/connect), only before a first act is marked signed. Mails:
        the notary (`notaryPendingReview`) and the operator
        (`operatorNotarySignedUp`), once per address, while the file is pending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                analytics:
                  $ref: "#/components/schemas/AnalyticsContext"
                email:
                  type: string
                  format: email
                  maxLength: 254
                  description: The notary's professional email — their sign-in identity.
                  example: me.roy@etude.ca
                lienCNQ:
                  type: string
                  maxLength: 300
                  description: >-
                    OPTIONAL. The https URL of the notary's official fiche on
                    cnq.org (or a subdomain). Anything else is refused with 422
                    `lien_cnq_invalide`. Empty is fine.
                  example: https://www.cnq.org/trouver-un-notaire/roy
                parrain:
                  type: string
                  writeOnly: true
                  description: OPTIONAL, PRIVATE partner referral code (ADR 0011) — see ConnectInput.parrain.
                  example: EVEROY
      responses:
        "200":
          description: Generic acknowledgement — identical whether the address is new, pending or already active.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
              example:
                ok: true
        "400":
          description: Malformed JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The email is not valid (`courriel_invalide`) or the fiche link is not on cnq.org (`lien_cnq_invalide`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: lien_cnq_invalide
                    message: Le lien doit être votre fiche officielle sur cnq.org (adresse https de la Chambre des notaires du Québec).
        "429":
          description: Per-IP rate limit exceeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  throttled:
                    type: boolean
                    const: true
  /events:
    post:
      operationId: recordFunnelEvent
      summary: The conversion funnel's beacon — one observable step at a time (2026-09-02).
      description: >-
        The web app reports a step of the conversion funnel (`{ event }`). Only
        client-allowed entries in the domain's `FUNNEL_EVENTS` catalogue are
        counted (visite, jour_ouvert, formulaire, paiement_ok, paiement_annule,
        notaire_porte, criteres_vus, prix_vu, coordonnees_vues,
        formulaire_bloque, publication_tentee, publication_echouee,
        page_service_vue, page_service_vers_carnet, erreur_script,
        promesse_rejetee, navigation_mesuree),
        as a per-day counter in the STATS# rollup that
        `GET /admin/metrics/overview` reads back as `entonnoir`. Anything else —
        an unknown id, a wrong type, a garbage body — is DROPPED with the same
        204, so a beacon never learns what the catalogue holds. Server-only
        steps (`publie`, `notaire_inscrit`) are ignored here and counted only
        on their authoritative routes. Payment events record browser returns,
        not verified payments. Counts represent events, not unique visitors
        or linked conversion cohorts. Event counters store no field values or
        visitor identifiers.
        Optional context is reduced to the bounded AnalyticsContext categories;
        browser, OS and device families are inferred from User-Agent and a coarse
        iPad hint. Raw headers, URLs, field values and error messages are not
        persisted in these counters. Segments are independent event totals,
        not linked visitor profiles or a compatibility guarantee.
        The optional arrival source is counted on the same beat, in its own
        `acq_<source>_<stage>` counters, and is never joined to the segments.
        Lightly rate-limited per IP (120/min by default). Safe for
        `navigator.sendBeacon` (a text/plain JSON body is accepted).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event]
              properties:
                event:
                  type: string
                  description: A FUNNEL_EVENTS id from @nota/domain.
                  example: jour_ouvert
                acquisition:
                  $ref: '#/components/schemas/Acquisition'
                context:
                  $ref: "#/components/schemas/AnalyticsContext"
      responses:
        "204":
          description: Received — counted when it is a catalogue step, silently dropped otherwise.
        "429":
          description: Per-IP rate limit exceeded; the beacon is not counted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  throttled:
                    type: boolean
                    const: true
  /client/bid/lecture:
    post:
      operationId: clientMarkThreadRead
      summary: Read receipt — the client has the retained-act thread on screen.
      description: >-
        Stamps `luParClientAt` on the bid (2026-09-04); the notary's feed
        reads it as `lecture.client` and shows « Vu » under their last message.
      security:
        - clientToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO]
              properties:
                id:
                  type: string
                dateISO:
                  type: string
                  format: date
      responses:
        "200":
          description: The instant recorded.
          content:
            application/json:
              schema:
                type: object
                required: [luLe]
                properties:
                  luLe:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /notary/bids/lecture:
    post:
      operationId: notaryMarkThreadRead
      summary: Read receipt — the retaining notary has the thread on screen.
      description: >-
        Stamps `luParNotaireAt` on the bid (2026-09-04); the client's view
        reads it as `lecture.notaire`. Only the notary who holds the act may
        stamp it (403 otherwise).
      security:
        - notaryToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO]
              properties:
                id:
                  type: string
                dateISO:
                  type: string
                  format: date
                token:
                  type: string
      responses:
        "200":
          description: The instant recorded.
          content:
            application/json:
              schema:
                type: object
                required: [luLe]
                properties:
                  luLe:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /notifications:
    get:
      operationId: listNotifications
      summary: The in-app bell — this person's notifications, newest first.
      description: >-
        Written by the API on each event (message, document, retenue,
        proposition, désistement — `domain.NOTIF_KINDS`) under the recipient's
        subject. A notary session opens their own bell; a client's per-offer
        token opens that offer's (`id` must match the token, 403 otherwise).
      security:
        - notaryToken: []
        - clientToken: []
      parameters:
        - in: query
          name: id
          schema:
            type: string
          description: The offer id, required with a client token.
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: The bell's entries and the unread count.
          content:
            application/json:
              schema:
                type: object
                required: [avis, nonLus]
                properties:
                  nonLus:
                    type: integer
                  avis:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /notifications/lues:
    post:
      operationId: markNotificationsRead
      summary: Mark the bell's entries read — some ids, or all of them.
      security:
        - notaryToken: []
        - clientToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: The offer id, required with a client token.
                ids:
                  description: An array of notification ids, or the string `toutes`.
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                token:
                  type: string
      responses:
        "200":
          description: How many entries were newly marked read.
          content:
            application/json:
              schema:
                type: object
                required: [marques]
                properties:
                  marques:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ==========================================================================
  # La salle de signature (ADR 0047)
  #
  # Both sides use the SAME routes, told apart by their token: a notary SESSION
  # token (the notary who retained the act) or the per-bid CLIENT token. Every
  # request addresses the séance by the bid `id` and its `dateISO`.
  #
  # NO media crosses this API. The peer connection is direct; what travels here
  # is WebRTC signalling (SDP, ICE candidates), the state of the four gates, and
  # the procès-verbal. Signalling is polled rather than pushed: there is no
  # WebSocket in this deployment, and a handful of messages during setup does
  # not need one.
  # ==========================================================================
  /salle/rejoindre:
    post:
      operationId: salleRejoindre
      summary: Join the signing room for a retained act (creates it on first arrival).
      description: >-
        Marks the calling party authenticated, records its DTLS fingerprint (the
        short authentication string is derived from both), and returns the ICE
        servers. The room is created on the first arrival, and only on an act a
        notary has retained. When no Chambre-admitted signature provider is
        configured, the room is forced to `demonstration`.
      security:
        - notarySession: []
        - clientToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO]
              properties:
                id: { type: string }
                dateISO: { type: string, format: date }
                empreinte:
                  type: string
                  description: This peer's DTLS fingerprint, from its local SDP.
                mode:
                  type: string
                  enum: [strict, temoin, aucun]
                  description: Recording mode. Defaults to `strict` — no recording.
                demonstration: { type: boolean }
      responses:
        "503":
          description: Signing provider or configured TURN relay secret is unavailable. No direct-connection fallback is used when the relay is configured.
        "200":
          description: The room, and the ICE servers to connect with.
          content:
            application/json:
              schema:
                type: object
                required: [salle, ice]
                properties:
                  salle: { $ref: "#/components/schemas/Salle" }
                  ice:
                    type: array
                    items: { $ref: "#/components/schemas/IceServer" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /salle:
    get:
      operationId: salleEtat
      summary: Poll the room state and this peer's pending signalling messages.
      description: >-
        Also the heartbeat: a peer that stops polling is a peer that is no longer
        there, and the silence is what closes the `presence` gate. Pass the
        `curseur` from the previous answer as `depuis` to receive only new
        signalling messages.
      security:
        - notarySession: []
        - clientToken: []
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: dateISO
          required: true
          schema: { type: string, format: date }
        - in: query
          name: depuis
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: The room, the messages waiting for this peer, and the new cursor.
          content:
            application/json:
              schema:
                type: object
                required: [salle, signaux, curseur]
                properties:
                  salle: { $ref: "#/components/schemas/Salle" }
                  signaux:
                    type: array
                    items: { $ref: "#/components/schemas/SalleSignal" }
                  curseur: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /salle/ice:
    get:
      operationId: salleIce
      summary: Fresh ICE servers, with time-limited TURN credentials.
      description: >-
        TURN credentials are the coturn time-limited form — the username IS the
        expiry, the password its HMAC — so a stolen credential dies on its own.
        Never a static password.
      security:
        - notarySession: []
        - clientToken: []
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: dateISO
          required: true
          schema: { type: string, format: date }
      responses:
        "503":
          description: Signing provider or configured TURN relay secret is unavailable. No direct-connection fallback is used when the relay is configured.
        "200":
          description: The ICE servers.
          content:
            application/json:
              schema:
                type: object
                required: [ice]
                properties:
                  ice:
                    type: array
                    items: { $ref: "#/components/schemas/IceServer" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /salle/signal:
    post:
      operationId: salleSignal
      summary: Leave one WebRTC signalling message for the other peer.
      description: >-
        Accepts an SDP offer, an SDP answer, an ICE candidate or an end marker,
        and nothing else. Anything outside that shape, or beyond the size a
        signalling message can legitimately reach, is refused — the room is not
        a tunnel.
      security:
        - notarySession: []
        - clientToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO, type, charge]
              properties:
                id: { type: string }
                dateISO: { type: string, format: date }
                type:
                  type: string
                  enum: [offre, reponse, candidat, fin]
                charge:
                  description: The SDP or candidate, as sent by the browser.
      responses:
        "200":
          description: The sequence number of the queued message.
          content:
            application/json:
              schema:
                type: object
                required: [n]
                properties:
                  n: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /salle/pistes:
    post:
      operationId: sallePistes
      summary: Report whether this peer's camera and microphone are live.
      description: >-
        A dead track closes the `presence` gate immediately, without waiting for
        the call to drop: the notary must SEE and HEAR, and a muted microphone
        is not hearing.
      security:
        - notarySession: []
        - clientToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO, video, audio]
              properties:
                id: { type: string }
                dateISO: { type: string, format: date }
                video: { type: boolean }
                audio: { type: boolean }
      responses:
        "200":
          description: The room after the report.
          content:
            application/json:
              schema:
                type: object
                required: [salle]
                properties:
                  salle: { $ref: "#/components/schemas/Salle" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /salle/lien:
    post:
      operationId: salleConfirmerLien
      summary: The notary confirms both short authentication strings match.
      description: >-
        Notary only. The confirmation records WHICH string was confirmed, so a
        later renegotiation that changes the fingerprints reopens the gate
        instead of inheriting a confirmation that no longer applies.
      security:
        - notarySession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO, sas]
              properties:
                id: { type: string }
                dateISO: { type: string, format: date }
                sas:
                  type: string
                  description: The string read aloud, as shown on both screens.
      responses:
        "200":
          description: The room with the `lien` gate open.
          content:
            application/json:
              schema:
                type: object
                required: [salle]
                properties:
                  salle: { $ref: "#/components/schemas/Salle" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /salle/identite:
    post:
      operationId: salleAttesterIdentite
      summary: The notary records an identity attestation for one party.
      description: >-
        Notary only. The attestation carries its METHOD, its INSTANT and its
        verifier; a bare "identity verified" boolean is refused, because it does
        not answer the question a court asks seven years later.
      security:
        - notarySession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO, partie, attestation]
              properties:
                id: { type: string }
                dateISO: { type: string, format: date }
                partie: { type: string, enum: [notaire, client] }
                attestation:
                  type: object
                  required: [methode, verifieeLe, verifieePar]
                  properties:
                    methode:
                      type: string
                      enum: [piece_officielle, fournisseur, connaissance_personnelle, demonstration]
                    verifieeLe: { type: string, format: date-time }
                    verifieePar: { type: string }
                    reference: { type: [string, "null"] }
      responses:
        "200":
          description: The room after the attestation.
          content:
            application/json:
              schema:
                type: object
                required: [salle]
                properties:
                  salle: { $ref: "#/components/schemas/Salle" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /salle/consentement:
    post:
      operationId: salleConsentir
      summary: Give or withdraw this party's consent.
      description: >-
        Both giving and withdrawing are facts, and both are written to the
        procès-verbal. A withdrawal stops any recording at once and makes the
        signature step impossible.
      security:
        - notarySession: []
        - clientToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO]
              properties:
                id: { type: string }
                dateISO: { type: string, format: date }
                enregistrement:
                  type: boolean
                  description: Whether this consent covers the recording (mode `temoin`).
                retire:
                  type: boolean
                  description: Withdraw the consent given earlier.
      responses:
        "200":
          description: The room after the consent.
          content:
            application/json:
              schema:
                type: object
                required: [salle]
                properties:
                  salle: { $ref: "#/components/schemas/Salle" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /salle/etape:
    post:
      operationId: salleAvancer
      summary: The notary moves the ceremony (or resumes a suspended one).
      description: >-
        Notary only. Steps are ordered: none is skipped, going back is allowed
        and recorded as a fact. Reaching `signature` requires all four gates
        open, both consents standing, and — with the demonstration adapter — a
        room marked `demonstration`. `reprendre` resumes a suspended séance at
        the step it was on, never further.
      security:
        - notarySession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO]
              properties:
                id: { type: string }
                dateISO: { type: string, format: date }
                versEtape:
                  type: string
                  enum: [accueil, identite, lien, consentement, lecture, questions, signature, cloture]
                reprendre: { type: boolean }
      responses:
        "200":
          description: The room at its new step.
          content:
            application/json:
              schema:
                type: object
                required: [salle]
                properties:
                  salle: { $ref: "#/components/schemas/Salle" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The séance is not in a state where this applies.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          $ref: "#/components/responses/ValidationError"
  /salle/sceau:
    post:
      operationId: salleSceller
      summary: Seal the procès-verbal and publish its fingerprint.
      description: >-
        Notary only, and only after the signature step. The hash chain closes,
        and the SAME fingerprint is written to the immutable audit trail — two
        independent copies of one truth, neither party able to make them agree
        on a lie afterwards.
      security:
        - notarySession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO]
              properties:
                id: { type: string }
                dateISO: { type: string, format: date }
      responses:
        "200":
          description: The sealed procès-verbal.
          content:
            application/json:
              schema:
                type: object
                required: [salle, scelle]
                properties:
                  salle: { $ref: "#/components/schemas/Salle" }
                  scelle: { $ref: "#/components/schemas/ProcesVerbal" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Already sealed, or sealed before the signature.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

components:
  parameters:
    AcceptLanguage:
      in: header
      name: Accept-Language
      required: false
      schema: { type: string }
      example: en-CA,en;q=0.9,fr;q=0.8
      description: >-
        Browser or chosen interface language. Supports fr and en, honors quality
        weights, and falls back to fr for unsupported languages. Intake initializes
        the recipient's notification language without replacing an existing choice.
        Sign-in messages use the requested language immediately; verification may
        update the saved choice. An absent header preserves existing behavior.
  securitySchemes:
    notificationPreferenceToken:
      type: http
      scheme: bearer
      description: Signed recipient identity from an email preference link
    notarySession:
      type: http
      scheme: bearer
      description: Notary SESSION token from POST /notary/session/verify.
    clientToken:
      type: http
      scheme: bearer
      description: Per-bid CLIENT token returned once by POST /bids (`sub` = bid id).
    supportToken:
      type: http
      scheme: bearer
      description: >-
        Per-thread live-chat token (ADR 0026): SUPPORT scope for the widget
        (returned by POST /support/messages), SUPPORT_OP scope for the
        operator's emailed reply link. `sub` = thread id in both.
  responses:
    SigningBetaError:
      description: >-
        400 malformed request; 401 absent/expired token or recent mailbox verification required;
        403 retained ownership or active notary required; 404 unknown session;
        409 stale revision, wrong stage, expired session or missing media presence;
        422 invalid cryptographic proof; 429 rate limit; 503 disabled/unavailable.
        Rate-limit storage failures fail closed. No tokens, keys or provider internals are returned.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    FinancingAIError:
      description: Rejected or unavailable financing analysis; no private provider error details.
      content:
        application/json:
          schema:
            type: object
            required: [errors]
            properties:
              errors:
                type: array
                items:
                  type: object
                  required: [code]
                  properties:
                    code: { type: string }
                    message: { type: string }
    NotaPaymentRequired:
      description: The offer is retained, but the Nota payment ledger has not recorded payment yet.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid, expired or wrong-scope token (`non_autorise`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The client token belongs to another bid (`interdit`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Gone:
      description: L'offre a ete annulee par le client.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Errors"
    ValidationError:
      description: Le corps est refuse par la validation du domaine.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Errors"
    NotFound:
      description: Unknown bid (`introuvable`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AlreadyRetained:
      description: The bid is already retained (`deja_retenue`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SigningBetaCapabilities:
      type: object
      required: [enabled, mode, legalSignatureAvailable, identityProofingAvailable, recordingAvailable, turnConfigured]
      properties:
        enabled: { type: boolean }
        mode: { type: string, const: rehearsal }
        legalSignatureAvailable: { type: boolean, const: false }
        identityProofingAvailable: { type: boolean, const: false }
        recordingAvailable: { type: boolean, const: false }
        authentication: { type: string, const: recent_email_verification }
        mediaEncryption: { type: string, const: webrtc_dtls_srtp }
        protectsAgainstMaliciousWebPublisher: { type: boolean, const: false }
        turnConfigured: { type: boolean }
        sessionDurationMs: { type: integer }
        presenceFreshnessMs: { type: integer }
    SigningBetaCommand:
      type: object
      required: [bidId, dateISO]
      properties:
        bidId: { type: string, pattern: '^[a-zA-Z0-9_-]{1,100}$' }
        dateISO: { type: string, format: date }
        revision: { type: integer, minimum: 1 }
        action: { type: string, enum: [join, admit, review, release, pause, acknowledge, close] }
        publicKeyJwk:
          type: object
          required: [kty, crv, x, y]
          properties:
            kty: { type: string, const: EC }
            crv: { type: string, const: P-256 }
            x: { type: string }
            y: { type: string }
        observationConfirmed: { type: boolean }
        connected: { type: boolean }
        type: { type: string, enum: [offer, answer] }
        sdp: { type: string, maxLength: 24000 }
        signature: { type: string, pattern: '^[a-zA-Z0-9_-]{86}$' }
    SigningBetaResponse:
      type: object
      required: [role, session, capabilities, iceServers]
      properties:
        role: { type: string, enum: [notary, client] }
        session:
          type: [object, 'null']
          properties:
            id: { type: string }
            revision: { type: integer }
            status: { type: string, enum: [waiting, admitted, reviewed, released, paused, complete, closed, expired] }
            expiresAt: { type: integer }
            document: { type: object }
            participants: { type: object }
            peerSignal: { type: [object, 'null'] }
            challenge: { type: [object, 'null'] }
        capabilities: { $ref: '#/components/schemas/SigningBetaCapabilities' }
        iceServers: { type: array, items: { type: object } }
    FinancingWorkPacketResult:
      anyOf:
        - { type: 'null' }
        - { $ref: '#/components/schemas/FinancingWorkPacket' }
    ActWorkPacketResult:
      anyOf:
        - { type: 'null' }
        - { $ref: '#/components/schemas/ActWorkPacket' }
    ActWorkPacket:
      type: object
      required: [version, serviceId, knowledgeVersion, controlPlanVersion, parameterCoverage, customerContext, documentInventory, draftFields, missing, comparisons, dateFlags, checks, controls, workflow, clientRequestDraft, measurement, todayISO]
      properties:
        version: { type: string }
        serviceId: { enum: [testament, procuration] }
        knowledgeVersion:
          type: string
          description: Version of the source-grounded service knowledge used for preparation.
        controlPlanVersion:
          type: string
          description: Version of the domain-owned notary control and integration plan.
        parameterCoverage: { $ref: '#/components/schemas/NotaryParameterCoverage' }
        customerContext:
          type: array
          items: { $ref: '#/components/schemas/FinancingContextItem' }
        documentInventory:
          type: array
          items:
            type: object
            required: [id, label, status]
            properties:
              id: { type: string }
              label: { type: string }
              status: { enum: [missing, listed, external] }
        draftFields:
          type: array
          items:
            type: object
            required: [fieldId, label, value, source, evidence]
            properties:
              fieldId: { type: string }
              label: { type: string }
              value: { type: string }
              originalValue: { type: string }
              source: { enum: [customer, ai_proposal, notary_accepted, notary_corrected] }
              evidence:
                type: array
                items:
                  type: object
                  required: [documentId, page, quote]
                  properties:
                    documentId: { type: string }
                    page: { type: integer, minimum: 1 }
                    quote: { type: string }
        missing:
          type: array
          items: { $ref: '#/components/schemas/FinancingMissingItem' }
        comparisons: { type: array, items: { type: object } }
        dateFlags: { type: array, items: { type: object } }
        checks:
          type: array
          items:
            type: object
            required: [id, label, owner, status, sourceIds]
            properties:
              id: { type: string }
              label: { type: string }
              owner: { const: notary }
              status: { const: pending }
              sourceIds: { type: array, items: { type: string } }
        controls:
          type: array
          description: Service-specific notary controls. They remain pending until a separately recorded professional workflow decision.
          items: { $ref: '#/components/schemas/NotaryControl' }
        workflow:
          $ref: '#/components/schemas/NotaryWorkflow'
        clientRequestDraft:
          anyOf:
            - { type: 'null' }
            - type: object
              required: [opening, items, closing]
              properties:
                opening: { type: string }
                items: { type: array, items: { $ref: '#/components/schemas/FinancingMissingItem' } }
                closing: { type: string }
        measurement:
          type: object
          required: [target, measuredReduction, reviewSeconds]
          properties:
            target: { const: 0.9 }
            measuredReduction: { type: 'null' }
            reviewSeconds: { type: [integer, 'null'] }
        todayISO: { type: [string, 'null'], format: date }
    FinancingWorkPacket:
      type: object
      required: [version, serviceId, controlPlanVersion, parameterCoverage, customerContext, documentInventory, draftFields, missing, comparisons, dateFlags, checks, controls, workflow, clientRequestDraft, measurement]
      properties:
        version: { type: string }
        serviceId: { enum: [financement, refinancement, testament, procuration] }
        controlPlanVersion:
          type: string
          description: Version of the domain-owned notary control and integration plan.
        parameterCoverage: { $ref: '#/components/schemas/NotaryParameterCoverage' }
        customerContext:
          type: array
          items: { $ref: '#/components/schemas/FinancingContextItem' }
        documentInventory:
          type: array
          items:
            type: object
            required: [id, label, status]
            properties:
              id: { type: string }
              label: { type: string }
              status: { enum: [missing, listed, external] }
        draftFields:
          type: array
          items:
            type: object
            required: [fieldId, label, value, source, evidence]
            properties:
              fieldId: { type: string }
              label: { type: string }
              value: { type: string }
              valueEn: { type: string }
              valueIsLabel: { type: boolean }
              source: { enum: [customer, ai_proposal, notary_accepted, notary_corrected] }
              originalValue:
                type: string
                description: When corrected, the quotation supports this original value, not the correction.
              evidence:
                type: array
                items:
                  type: object
                  required: [documentId, page, quote]
                  properties:
                    documentId: { type: string }
                    page: { type: integer }
                    quote: { type: string }
        missing:
          type: array
          items: { $ref: '#/components/schemas/FinancingMissingItem' }
        comparisons:
          type: array
          description: Values to compare, not proven mistakes; formatting alone can differ.
          items:
            type: object
            required: [fieldId, label, customerValue, documentValues]
            properties:
              fieldId: { type: string }
              label: { type: string }
              customerValue: { type: string }
              documentValues: { type: array, items: { type: string } }
        dateFlags:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { enum: [expiry_unclear, expiry_past, signing_after_expiry] }
              label: { type: string }
        checks:
          type: array
          items:
            type: object
            required: [id, label, owner, status, sourceIds]
            properties:
              id: { type: string }
              label: { type: string }
              owner: { enum: [notary, lender, registry] }
              status: { const: pending }
              sourceIds: { type: array, items: { type: string } }
        controls:
          type: array
          description: >-
            Service-specific notary controls. These remain pending until a
            separately recorded professional workflow decision; integration
            candidates are routing hints and are not live connectors.
          items:
            $ref: '#/components/schemas/NotaryControl'
        workflow:
          $ref: '#/components/schemas/NotaryWorkflow'
        clientRequestDraft:
          anyOf:
            - { type: 'null' }
            - type: object
              required: [opening, items, closing]
              properties:
                opening: { type: string }
                items:
                  type: array
                  items: { $ref: '#/components/schemas/FinancingMissingItem' }
                closing: { type: string }
        lenderRequestDraft:
          type: object
          required: [opening, items, requirements, closing]
          properties:
            opening: { type: string }
            items:
              type: array
              items: { $ref: '#/components/schemas/FinancingContextItem' }
            requirements:
              type: array
              items:
                type: object
                required: [id, label]
                properties:
                  id: { type: string }
                  label: { type: string }
            closing: { type: string }
        measurement:
          type: object
          required: [target, measuredReduction, reviewSeconds]
          properties:
            target: { const: 0.9, description: Owner target; not an observed result. }
            measuredReduction: { type: 'null' }
            reviewSeconds: { type: [integer, 'null'] }
    NotaryControl:
      type: object
      required: [id, label, owner, critical, automation, integrationType, integrationLabel, integrationCandidate, evidenceIds, externalEvidence, status]
      properties:
        id: { type: string }
        label: { type: string }
        owner: { enum: [notary, lender, registry] }
        critical: { type: boolean }
        automation: { const: prepare_only }
        integrationType: { type: string }
        integrationLabel: { type: string }
        integrationCandidate: { type: string }
        evidenceIds: { type: array, items: { type: string } }
        externalEvidence: { type: array, items: { type: string } }
        status: { const: pending }
    NotaryParameterCoverage:
      type: object
      required: [version, serviceId, pricing, intake, documents, ai, humanControls, integrations, caseCoverage]
      description: >-
        Server-derived coverage map linking catalogue parameters, documents,
        evidence extraction fields, integrations and controls. It describes
        preparation coverage and never certifies a legal condition.
      properties:
        version: { type: string }
        serviceId: { enum: [financement, refinancement, testament, procuration] }
        pricing:
          type: array
          items:
            type: object
            required: [id, label, required]
            properties:
              id: { type: string }
              label: { type: string }
              required: { type: boolean }
        intake:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string }
              label: { type: string }
        documents:
          type: array
          items:
            type: object
            required: [id, label, conditional]
            properties:
              id: { type: string }
              label: { type: string }
              conditional: { type: boolean }
        ai:
          type: object
          required: [fields, mappedIntake, unmappedIntake]
          properties:
            fields:
              type: array
              items:
                type: object
                required: [id, label]
                properties:
                  id: { type: string }
                  label: { type: string }
            mappedIntake:
              type: array
              items:
                type: object
                required: [intakeId, aiFieldId]
                properties:
                  intakeId: { type: string }
                  aiFieldId: { type: string }
            unmappedIntake: { type: array, items: { type: string } }
        humanControls:
          type: array
          items:
            type: object
            required: [id, label, owner]
            properties:
              id: { type: string }
              label: { type: string }
              owner: { enum: [notary, lender, registry] }
        integrations:
          type: array
          items:
            type: object
            required: [type, label, candidate]
            properties:
              type: { type: string }
              label: { type: string }
              candidate: { type: string }
        caseCoverage:
          $ref: '#/components/schemas/NotaryCaseCoverage'
    NotaryCaseCoverage:
      type: object
      required: [version, serviceId, cases, unknownCasePolicy, outputPolicy]
      description: >-
        Explicit service branches for preparation and review. Unknown or
        out-of-catalogue cases are routed to the notary before automation.
      properties:
        version: { type: string }
        serviceId: { enum: [financement, refinancement, testament, procuration] }
        cases:
          type: array
          items:
            type: object
            required: [id, label, disposition, critical, signals, controlIds]
            properties:
              id: { type: string }
              label: { type: string }
              disposition: { enum: [prepare_and_review, route_to_notary] }
              critical: { type: boolean }
              signals: { type: array, items: { type: string } }
              controlIds: { type: array, items: { type: string } }
        unknownCasePolicy: { const: route_to_notary_before_automation }
        outputPolicy: { const: evidence_proposal_only }
    NotaryWorkflow:
      type: object
      description: >-
        Deterministic next-action guidance for the retaining notary. It is a
        workflow hint and never certifies legal readiness, signing readiness or
        completion of a control.
      required: [stage, nextActions, ai, controls]
      properties:
        stage: { enum: [client_intake, ai_ready, ai_review, exceptions, notary_controls] }
        nextActions:
          type: array
          items:
            type: object
            required: [id, owner, priority, count]
            properties:
              id: { enum: [request_missing_items, analyze_documents, review_ai_proposals, resolve_exceptions, complete_critical_controls, confirm_signing_conditions] }
              owner: { enum: [client, notary] }
              priority: { enum: [now, next] }
              count: { type: integer, minimum: 0 }
        ai:
          type: object
          required: [status, proposalCount, reviewSeconds]
          properties:
            status: { enum: [not_started, abstained, awaiting_review, reviewed] }
            proposalCount: { type: integer, minimum: 0 }
            reviewSeconds: { type: [integer, 'null'], minimum: 0 }
        controls:
          type: object
          required: [pending, criticalPending]
          properties:
            pending: { type: integer, minimum: 0 }
            criticalPending: { type: integer, minimum: 0 }
    FinancingContextItem:
      type: object
      required: [id, label, value, source]
      properties:
        id: { type: string }
        label: { type: string }
        value: { type: string }
        valueEn: { type: string }
        valueIsLabel: { type: boolean }
        source: { const: customer }
    FinancingMissingItem:
      type: object
      required: [id, label, aide]
      properties:
        id: { type: string }
        label: { type: string }
        aide: { type: string }
        kind: { enum: [doc, field, pricing] }
    FinancingAIAnalysis:
      type: object
      required: [id, preparation, provenance, createdAt, sourceOrigin]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        sourceOrigin: { const: notary_supplied_text }
        preparedBy:
          type: string
          description: Authenticated retaining notary that generated this analysis; required for reuse. Legacy analyses may omit it.
        requestFingerprint:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Server-computed identity of source text, prompt, schema, generation settings, provider, endpoint region and model. Contains no credentials.
        performance:
          type: object
          required: [provider, region, latencyMs, usage]
          properties:
            provider: { enum: [anthropic, bedrock, injected] }
            region: { type: string }
            latencyMs: { type: number, minimum: 0 }
            usage:
              type: object
              required: [in, out, cacheRead, cacheWrite, reported]
              description: Sanitized provider counters for this generation. If reported is false, normalized counters are not a billable-usage measurement. Reuse incurs no new model call and preserves original metrics.
              properties:
                in: { type: integer, minimum: 0 }
                out: { type: integer, minimum: 0 }
                cacheRead: { type: integer, minimum: 0 }
                cacheWrite: { type: integer, minimum: 0 }
                reported: { type: boolean }
        preparation:
          type: object
          required: [fields, missing, conflicts, status]
          properties:
            status: { const: needs_notary_review }
            missing: { type: array, items: { type: string } }
            conflicts: { type: array, items: { type: string } }
            fields:
              type: array
              maxItems: 24
              items:
                type: object
                required: [fieldId, value, evidence]
                properties:
                  # The exact field set is selected by the server-side service
                  # contract; financing and act-specific AI share this envelope.
                  fieldId: { type: string }
                  value: { type: string, minLength: 1, maxLength: 1000 }
                  evidence:
                    type: array
                    minItems: 1
                    maxItems: 8
                    items:
                      type: object
                      required: [documentId, page, quote]
                      properties:
                        documentId: { type: string }
                        page: { type: integer, minimum: 1 }
                        quote: { type: string, minLength: 1, maxLength: 2000 }
        provenance:
          type: object
          required: [model, knowledgeVersion, promptSha256, inputSha256]
          properties:
            model: { type: string }
            knowledgeVersion: { type: string }
            promptSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
            inputSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        review: { $ref: '#/components/schemas/FinancingAIReview' }
    ActAIAnalysis:
      allOf:
        - { $ref: '#/components/schemas/FinancingAIAnalysis' }
        - type: object
          required: [serviceId]
          properties:
            serviceId: { enum: [testament, procuration] }
    FinancingAIReview:
      type: object
      required: [reviewerId, reviewedAt, decisions, activeReviewSeconds, trainingEligible, signingReadiness]
      properties:
        reviewerId: { type: string }
        reviewedAt: { type: string, format: date-time }
        trainingEligible: { const: false }
        signingReadiness: { const: not_assessed }
        activeReviewSeconds: { type: [integer, 'null'] }
        decisions:
          type: array
          items:
            type: object
            required: [index, decision]
            properties:
              index: { type: integer, minimum: 0 }
              decision: { enum: [accepted, corrected, rejected] }
              value: { type: string }
              reason: { type: string }
    AnalyticsContext:
      type: object
      description: Optional bounded observations. Unknown keys/values are ignored. Used only for aggregate counters, never stored on a bid or notary. Browser and OS are derived server-side; device tablet is only an iPad hint.
      properties:
        device:
          type: string
          enum: ["mobile", "tablet", "desktop", "unknown"]
        viewport:
          type: string
          enum: ["narrow", "medium", "wide", "unknown"]
        language:
          type: string
          enum: ["fr", "en", "other", "unknown"]
        source:
          type: string
          enum: ["google", "bing", "search_other", "facebook", "instagram", "linkedin", "tiktok", "ai", "email", "partner", "campaign_other", "referral_other", "internal", "direct_unknown"]
        entry:
          type: string
          enum: ["home", "financement", "refinancement", "other"]
        dialog:
          type: string
          enum: ["native", "fallback", "unknown"]
        storage:
          type: string
          enum: ["available", "unavailable", "unknown"]
        load:
          type: string
          enum: ["fast", "moderate", "slow", "unknown"]
    PropositionStatus:
      type: string
      description: >-
        Lifecycle of a notary's proposition. `remplacee` = superseded by a newer
        proposition from the same notary (hidden from the client).
      enum: [en_attente, acceptee, refusee, remplacee]
    RequestedItem:
      type: object
      required: [id, nom, kind]
      properties:
        id:
          type: string
        nom:
          type: string
          description: The label the client saw in the dossier (fr-CA).
        kind:
          type: string
          enum: [document, champ]
    NotaryProposition:
      type: object
      description: A proposition as seen by the notary who made it.
      required: [id, montant, delta, status, createdAt]
      properties:
        id:
          type: string
        montant:
          type: integer
        delta:
          type: integer
          description: montant minus the client's offer at proposal time.
        message:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/PropositionStatus"
        createdAt:
          type: string
          format: date
    ClientProposition:
      type: object
      description: A proposition as seen by the client — the étude, never the notaryId.
      required: [id, etude, montant, delta, status, createdAt]
      properties:
        id:
          type: string
        etude:
          type: [string, "null"]
        montant:
          type: integer
        delta:
          type: integer
        message:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/PropositionStatus"
        createdAt:
          type: string
          format: date
        cnq:
          type: boolean
          description: >-
            True when the proposing notary has attached their official fiche
            in the Chambre des notaires directory (ADR 0016). A boolean only —
            the fiche URL never rides an open bid (it lists the notary's
            phone; contact flows only after retention).
        actes:
          type: integer
          minimum: 0
          description: >-
            Acts this notary has carried on Nota. ADR 0030: a client-facing
            payload may carry FACTS about a named notary, never an appreciation
            — art. 70 of the Code de déontologie forbids a notary from using
            "or allowing to be used" a testimonial concerning them, and a
            displayed score turns a directory into a recommendation. The star
            average (`rating`) and the cote were removed from here for that
            reason; both remain visible to the notary and to Nota.
    NotaryDemande:
      type: object
      required: [id, documents, createdAt, fournie]
      properties:
        id:
          type: string
        documents:
          type: array
          items:
            $ref: "#/components/schemas/RequestedItem"
        message:
          type: [string, "null"]
        createdAt:
          type: string
          format: date
        fournie:
          type: boolean
          description: True once every requested id is present in the client's dossier.
    ClientDemande:
      type: object
      required: [id, etude, documents, createdAt, fournie]
      properties:
        id:
          type: string
        etude:
          type: [string, "null"]
        documents:
          type: array
          items:
            $ref: "#/components/schemas/RequestedItem"
        message:
          type: [string, "null"]
        createdAt:
          type: string
          format: date
        fournie:
          type: boolean
    Readiness:
      type: object
      description: >-
        Domain `leadReadiness` of the dossier. Since ADR 0010 ("price before
        documents"), `ready` gates on the REQUIRED pricing answers plus
        consent; the document checklist (`total`/`done`/`missing`) is reported
        as preparation progress, never a barrier. A dossier item whose value is
        `transmis_autrement` counts as provided (sent through the notary's own
        channel).
      required: [total, done, missing, requis, consent, ready]
      properties:
        total:
          type: integer
        done:
          type: integer
        missing:
          type: array
          items:
            type: string
          description: Names of the documents/fields still missing (progress, not a gate).
        requis:
          type: array
          items:
            type: string
          description: Labels of the unanswered REQUIRED pricing questions — the only content gate.
        consent:
          type: boolean
        ready:
          type: boolean
          description: True once every required pricing answer is in and consent is given.
    PropositionAnswerInput:
      type: object
      required: [id, dateISO, propositionId]
      properties:
        id:
          type: string
        dateISO:
          type: string
          format: date
        propositionId:
          type: string
    LenderInfo:
      type: object
      description: >-
        The lender behind a bid (from the domain's LENDERS catalogue), shown to
        notaries so they can decide before retaining — a notary only closes
        with the institutions they normally work with. `virtuel` flags a
        branchless lender (remote instructions, extra coordination). For an
        « Autre prêteur » answer, `nom` is the lender name the client typed
        (the id stays `autre`). Null on bids that predate the lender question.
      required: [id, nom, virtuel]
      properties:
        id:
          type: string
        nom:
          type: string
        virtuel:
          type: boolean
    DeplacementInfo:
      type: object
      description: >-
        The déplacement band behind a bid (from the domain's DEPLACEMENTS
        catalogue, ADR 0017): who moves for the in-person signature — the
        client to the étude, the notary to the client — how far, and whether
        the client declared a 100 %-online urgency. Shown to notaries before
        they retain, propose, or pass. Null on bids that predate the question.
      required: [id, nom, qui, km, urgence]
      properties:
        id:
          type: string
        nom:
          type: string
        qui:
          type: string
          enum: [client, notaire, en_ligne]
        km:
          type: integer
        urgence:
          type: boolean
    ChatDocument:
      type: object
      description: >-
        Un document de la conversation. La CLE de stockage n'apparait jamais ici
        — Nota est depositaire, jamais destinataire (art. 35 a 37 C.deont.), et
        une cle divulguee serait une adresse a deviner.
      required: [id, de, nom, taille, etat, createdAt]
      properties:
        id: { type: string }
        de:
          type: string
          enum: [client, notaire]
        nom: { type: string }
        taille: { type: integer }
        etat:
          type: string
          enum: [en_attente, pret]
          description: >-
            `en_attente` tant que le serveur n'a pas CONSTATE le depot. Seuls les
            documents `pret` sont visibles par l'autre partie.
        createdAt: { type: string, format: date-time }
    DepotAutorisation:
      type: object
      description: L'autorisation signee de televerser, portee et breve.
      required: [url, methode, expireA]
      properties:
        url: { type: string, format: uri }
        methode:
          type: string
          enum: [PUT]
        entetes:
          type: object
          additionalProperties: { type: string }
          description: Les en-tetes que le navigateur DOIT envoyer, notamment le content-type figé.
        expireA: { type: string, format: date-time }
        maxBytes: { type: integer }
    LectureAutorisation:
      type: object
      description: L'autorisation signee de telecharger, en piece jointe.
      required: [url, methode, expireA]
      properties:
        url: { type: string, format: uri }
        methode:
          type: string
          enum: [GET]
        disposition: { type: string }
        expireA: { type: string, format: date-time }
    ChatMessage:
      type: object
      description: >-
        One message of the retained-act conversation (client <-> retaining
        notary). `de` names the sending role; the thread lives on the bid.
      required: [id, de, texte, createdAt]
      properties:
        id:
          type: string
        de:
          type: string
          enum: [client, notaire]
        texte:
          type: string
        createdAt:
          type: string
    SupportMessage:
      type: object
      description: >-
        One message of a live-chat thread (ADR 0026). `de` names the sending
        side — the visitor, Nota answering through the emailed reply link, or
        the assistant (ADR 0046). `assistant` and `nota` are deliberately
        distinct: only a human's message marks a thread answered, and only a
        labelled assistant lets a visitor know a machine wrote.
      required: [id, de, texte, createdAt]
      properties:
        id:
          type: string
        de:
          type: string
          enum: [visiteur, nota, assistant]
        texte:
          type: string
        createdAt:
          type: string
    Notification:
      type: object
      required: [id, kind, at]
      properties:
        id:
          type: string
        kind:
          type: string
          description: One of `domain.NOTIF_KINDS` ids.
        titre:
          type: string
          nullable: true
        corps:
          type: string
          nullable: true
        lien:
          type: string
          nullable: true
          description: A site hash that lands the reader in the right place.
        refId:
          type: string
          nullable: true
        at:
          type: string
          format: date-time
        luLe:
          type: string
          format: date-time
          nullable: true
    NotaryBid:
      type: object
      description: Notary-facing projection of an open bid (never the dossier or courriel).
      required: [id, serviceId, dateISO, montant, tier, premium, ready, preteur, deplacement, proposition, demande, missing]
      properties:
        id:
          type: string
        serviceId:
          $ref: "#/components/schemas/ServiceId"
        dateISO:
          type: string
          format: date
        expiresOn:
          type: [string, "null"]
          format: date
          description: Last valid civil day (inclusive, Quebec). Server sets the earlier of publication + 7 days and signing date. Legacy open bids without a valid deadline are unavailable; retained acts remain accessible.
        montant:
          type: integer
        tier:
          $ref: "#/components/schemas/Tier"
        premium:
          type: number
        prefixe:
          type: [string, "null"]
        ready:
          type: boolean
        preteur:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/LenderInfo"
        deplacement:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/DeplacementInfo"
        distanceKm:
          type: [integer, "null"]
          description: >-
            ≈ km between the bid's sector and the étude's (ADR 0025, FSA
            centroids); null when either sector is unknown.
        complexity:
          type: object
          additionalProperties: true
        caution:
          $ref: "#/components/schemas/CautionState"
        proposition:
          description: This notary's latest non-superseded proposition, or null.
          oneOf:
            - type: "null"
            - type: object
              required: [id, montant, delta, status, createdAt]
              properties:
                id:
                  type: string
                montant:
                  type: integer
                delta:
                  type: integer
                status:
                  $ref: "#/components/schemas/PropositionStatus"
                createdAt:
                  type: string
                  format: date
        demande:
          description: This notary's latest document request, or null.
          oneOf:
            - type: "null"
            - type: object
              required: [id, documents, createdAt, fournie]
              properties:
                id:
                  type: string
                documents:
                  type: array
                  items:
                    $ref: "#/components/schemas/RequestedItem"
                createdAt:
                  type: string
                  format: date
                fournie:
                  type: boolean
        missing:
          type: array
          items:
            type: string
        requestable:
          type: array
          description: >-
            The item ids a document request may name for THIS client — the
            domain's requestable items filtered by the bid's private pricing
            answers (which never travel themselves).
          items:
            type: string
        cautionVivante:
          type: boolean
          description: >-
            True when a cancellation fee could actually be captured on this
            bid (billing configured, an authorized hold with a payment
            intent) — exactly what the cancel route requires. False means a
            cancellation would be free, whatever the barème says.
    NotaryOfferTemplate:
      type: object
      description: >-
        A server-frozen, service-specific preparation blueprint stored on the
        offer at booking. It contains connector candidates only, never live
        credentials or customer dossier values, and is released solely to the
        retaining notary after the Nota payment ledger is positive.
      required: [version, serviceId, generatedAt, access, pricing, intake, documents, aiFields, humanControls, caseCoverage, connectors]
      properties:
        version: { type: string }
        serviceId: { $ref: '#/components/schemas/ServiceId' }
        generatedAt: { type: [string, 'null'], format: date-time }
        access:
          type: object
          required: [audience, after, customerVisible]
          properties:
            audience: { const: retaining_notary }
            after: { const: nota_paid }
            customerVisible: { const: false }
        pricing: { type: array, items: { type: object } }
        intake: { type: array, items: { type: object } }
        documents: { type: array, items: { type: object } }
        aiFields: { type: array, items: { type: object } }
        humanControls: { type: array, items: { type: object } }
        caseCoverage: { type: array, items: { type: object } }
        connectors:
          type: array
          items:
            type: object
            required: [type, label, candidate, status, automation]
            properties:
              type: { type: string }
              label: { type: string }
              candidate: { type: string }
              status: { const: candidate }
              automation: { const: prepare_only }
    ClientContact:
      type: object
      description: >-
        The client half of the mise en relation (ADR 0010 §4), released ONLY to
        the notary who retained the bid. `nom` is present even when the public
        bid was anonymous — anonymity is a carnet promise, not a blackout on
        the person the notary is meeting.
      required: [nom, courriel, telephone]
      properties:
        nom:
          type: [string, "null"]
        courriel:
          type: [string, "null"]
        telephone:
          type: [string, "null"]
          description: As typed by the client (trimmed); use domain telHref() for a dial string.
    RetainedBid:
      type: object
      description: A bid retained by the requesting notary (the dossier is theirs to see).
      required: [id, dateISO, serviceId, montant, tier, client, viaProposition]
      properties:
        id:
          type: string
        dateISO:
          type: string
          format: date
        serviceId:
          $ref: "#/components/schemas/ServiceId"
        montant:
          type: integer
        tier:
          $ref: "#/components/schemas/Tier"
        prefixe:
          type: [string, "null"]
        courriel:
          type: [string, "null"]
        dossier:
          type: [object, "null"]
          additionalProperties: true
        client:
          $ref: "#/components/schemas/ClientContact"
        preteur:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/LenderInfo"
        deplacement:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/DeplacementInfo"
        distanceKm:
          type: [integer, "null"]
          description: >-
            ≈ km between the bid's sector and the étude's (ADR 0025, FSA
            centroids); null when either sector is unknown.
        messages:
          type: array
          description: The live thread with the client (see /notary/bids/message).
          items:
            $ref: "#/components/schemas/ChatMessage"
        viaProposition:
          type: boolean
          description: True when retention came from the client accepting this notary's proposition.
        completed:
          type: boolean
          description: >-
            True once the write-once act ledger holds this act's settlement —
            the console renders « Acte complété » in ANY session and never
            re-offers the settlement button.
        paid:
          type: boolean
          description: True only when the Nota payment ledger records an actual payment or transfer.
        notaryTemplate:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/NotaryOfferTemplate'
          description: Released only when `paid` is true; null before payment.
        actAmount:
          type: [integer, "null"]
          description: The value the act settled at (null until completed).
        commissionCents:
          type: [integer, "null"]
          description: Nota's commission on the settled act (null until completed).
        annulation:
          $ref: "#/components/schemas/CancellationForecast"
        missing:
          type: array
          description: The dossier items still missing (names), as on an open bid.
          items:
            type: string
        requestable:
          type: array
          description: The item ids a document request may name for this client.
          items:
            type: string
        caution:
          $ref: "#/components/schemas/CautionState"
    CautionState:
      description: >-
        ADR 0035 — the state of the payment guarantee on a demand, told to the
        notary BEFORE they retain and while they hold it. Null when billing is
        off (demo, tests).
      oneOf:
        - type: "null"
        - type: object
          required: [etat, poseeLe]
          properties:
            etat:
              type: string
              enum: [posee, enregistree, refusee, expiree, aucune]
              description: >-
                `posee` — the amount is held, still ALIVE
                (`domain.cautionVivante`) and capturable at the signing;
                `enregistree` — the client's card is validated and the hold is
                placed on `poseeLe`; `refusee` — the bank declined the hold
                (both parties were told, retried daily); `expiree` — a hold was
                placed but has outlived a card authorization's ~7-day life and
                no registered card allows a new one (offers predating ADR 0035:
                settlement falls back on the ADR 0029 receivable); `aucune` —
                no card.
            poseeLe:
              type: [string, "null"]
              format: date
              description: >-
                A DATE, and it never lies about its tense: on `posee` /
                `expiree` it is the day the hold WAS placed (`authorizedAt`); on
                `enregistree` it is the day it WILL be placed — today when the
                signing already entered the window, null when the date is past.
    AcceptedBid:
      type: object
      description: >-
        What POST /notary/bids/accept hands the retaining notary: the released
        dossier plus the mise en relation `client` contact block (ADR 0010 §4).
        The payout fields are present only with billing configured and an
        authorized card.
      required: [id, courriel, dossier, client]
      properties:
        id:
          type: string
        courriel:
          type: [string, "null"]
          description: The client's private email, released on retention (also inside `client`).
        dossier:
          type: [object, "null"]
          additionalProperties: true
        client:
          $ref: "#/components/schemas/ClientContact"
        notaryTemplate:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/NotaryOfferTemplate"
          description: Always null at retention; the paid template is returned later in the notary feed.
        paid:
          type: boolean
          description: Present with billing on — true when the pay-on-accept capture succeeded.
        commissionCents:
          type: integer
          description: Nota's commission on the captured act, in cents (present when `paid` is true).
        netCents:
          type: integer
          description: The amount transferred to the notary, in cents (present when `paid` is true).
        paymentError:
          type: string
          description: A machine-readable capture-failure code (present when `paid` is false).
    Tier:
      type: string
      description: Timing tier derived from days-to-date (ascending urgency).
      enum: [standard, rapide, prioritaire, urgence, extreme]
    Status:
      type: string
      description: Lifecycle of a bid. `annulee` = withdrawn by the client.
      enum: [ouverte, retenue, annulee]
    ServiceId:
      type: string
      description: The catalogue services supported by Nota's notary workflow.
      enum: [refinancement, financement, testament, procuration]
    PartnerRegistration:
      type: object
      required: [partenaire]
      properties:
        partenaire:
          type: object
          required: [code, type, courriel]
          properties:
            code:
              type: string
              description: The NORMALIZED code (uppercased, separators dropped).
              example: EVEROY
            type:
              type: string
              enum: [agent_immobilier, courtier_hypothecaire, autre_professionnel]
            courriel:
              type: string
              format: email
            createdAt:
              type: string
              format: date
            confirmedAt:
              type: string
              format: date
              description: >-
                The date the code's email was verified (ADR 0011). Only a
                confirmed partner is a payee of record.
    ConnectInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: The notary's email; used as the Stripe customer email.
          example: notaire@example.ca
        parrain:
          type: string
          writeOnly: true
          description: >-
            OPTIONAL, PRIVATE (write-only). Partner referral code from a
            `?ref=CODE` link or typed by hand (ADR 0011), same rules as on
            POST /bids: normalized server-side, stored on the notary record
            only when valid, silently dropped otherwise — a broken referral
            link must never fail a signup. A SELF-REFERRAL (the code's
            registered partner signing up with their own email) is likewise
            silently dropped. Never exposed in any notary-facing or public
            payload; a referred notary earns their partner the flat notary
            reward once, when they retain their first act. Surfaces only,
            aggregated, in the admin referral ledger.
          example: EVEROY
    AcquisitionTouch:
      type: object
      additionalProperties: false
      properties:
        source:
          type: string
          enum: [unknown, direct, google, bing, duckduckgo, yahoo, linkedin, facebook, instagram, youtube, tiktok, reddit, newsletter, partner, referral, other]
        medium:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,63}$'
        campaign:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,63}$'
        content:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,63}$'
    Acquisition:
      type: object
      description: Private first and last non-direct campaign attribution. Invalid fields are dropped; never returned on the public carnet. Do not put personal data in campaign names.
      properties:
        version:
          type: integer
          const: 1
        first:
          $ref: '#/components/schemas/AcquisitionTouch'
        last:
          $ref: '#/components/schemas/AcquisitionTouch'
    OfferInput:
      type: object
      required: [serviceId, dateISO, montant, prefixe]
      properties:
        acquisition:
          $ref: '#/components/schemas/Acquisition'
        analytics:
          $ref: "#/components/schemas/AnalyticsContext"
        serviceId:
          $ref: "#/components/schemas/ServiceId"
        dateISO:
          type: string
          format: date
          description: Requested signing date, ISO YYYY-MM-DD (must not be in the past).
          example: "2026-08-20"
        montant:
          type: integer
          minimum: 1
          description: >-
            Offer in whole Canadian dollars. Must be >= the offer's dynamic
            floor (the service base plus the pricing-criteria adds; 2 000 $ for
            an uncomplicated refinancement) and <= 5× that floor (the premium
            cap).
          example: 2400
        anonyme:
          type: boolean
          default: true
          description: When true (default), the bid is published without a name.
        nom:
          type: string
          maxLength: 120
          description: Display name; stored only when anonyme is false.
        prefixe:
          type: string
          minLength: 3
          maxLength: 3
          pattern: "^[A-Za-z][0-9][A-Za-z]$"
          description: >-
            REQUIRED postal sector (the FSA — first 3 characters of the
            client's postal code, e.g. "G1R"). The bid's only location signal:
            it anchors the declared déplacement band to a real sector so a
            notary's travel radius means something. Normalized to uppercase
            server-side; missing → 422 `prefixe_requis`, malformed → 422
            `prefixe_invalide`.
        courriel:
          type: string
          format: email
          maxLength: 254
          description: >-
            OPTIONAL. Private client email used only for notifications (offer
            published, date approaching, offer retained). Stored server-side and
            NEVER returned in the public Bid projection. Empty/absent is allowed;
            a non-empty value must be a valid email or the offer is rejected with
            `courriel_invalide`.
          example: client@example.ca
        telephone:
          type: string
          writeOnly: true
          description: >-
            OPTIONAL, PRIVATE (write-only). The client's phone for the mise en
            relation (ADR 0010 §4): released ONLY to the notary who retains the
            bid, alongside the dossier — never in the public Bid projection,
            never to a notary browsing open bids, never echoed back. Loose
            validation: after stripping formatting, 10–11 digits are required
            (else 422 `telephone_invalide`); the value is stored as typed,
            trimmed.
          example: "418 555-1234"
        parrain:
          type: string
          writeOnly: true
          description: >-
            OPTIONAL, PRIVATE (write-only). Partner referral code from a
            `?ref=CODE` link or typed by hand in the booking form (ADR 0011)
            — 4–12 letters/digits, case-insensitive, separators ignored.
            Normalized and stored on the bid only when valid; an INVALID code
            is silently dropped (a broken referral link must never fail a
            booking), and a SELF-REFERRAL (the code's registered partner
            booking with their own email) is likewise dropped. Never present in any
            response: not on the public carnet, not in notary projections, not
            echoed on POST /bids or GET /client/bid. It only ever surfaces,
            aggregated, in the admin referral ledger.
          example: EVEROY
    Bid:
      type: object
      description: Public projection of a bid. Expired or undated open offers are excluded from the marketplace and cannot be accepted (410 offre_expiree). Private dossier data is never included.
      required: [id, serviceId, dateISO, montant, tier, premium, status, anonyme]
      properties:
        id:
          type: string
        serviceId:
          $ref: "#/components/schemas/ServiceId"
        dateISO:
          type: string
          format: date
        expiresOn:
          type: [string, "null"]
          format: date
          description: Last valid civil day (inclusive, Quebec). Server sets the earlier of publication + 7 days and signing date. Legacy open bids without a valid deadline are unavailable; retained acts remain accessible.
        montant:
          type: integer
        tier:
          $ref: "#/components/schemas/Tier"
        premium:
          type: number
          description: montant / prix de départ (>= 1.0, <= 10.0).
        status:
          $ref: "#/components/schemas/Status"
        etude:
          type: [string, "null"]
          description: Retaining notary's practice, present only when status is retenue.
        anonyme:
          type: boolean
        nom:
          type: [string, "null"]
          description: Always null when anonyme is true.
        prefixe:
          type: [string, "null"]
        createdAt:
          type: string
          format: date
        annulation:
          type: [object, "null"]
          description: >-
            The indemnity file of a late cancellation (ADR 0041) — only on a
            cancelled bid whose withdrawal opened a claim window, null
            everywhere else. `statut` tells where it stands: `en_attente`
            (the notary may still claim, nothing moved, the hold stays),
            `percue` (claimed and collected), `refusee` (claimed, card
            declined), `renoncee` (the notary waived), `expiree` (the
            deadline passed). Money moves ONLY on `percue`.
          properties:
            statut:
              type: string
              enum: [en_attente, percue, refusee, renoncee, expiree]
            taux:
              type: number
              description: The cap as a share of the retained montant (e.g. 0.3).
            plafond:
              type: number
              description: The cap in dollars — the most the notary could claim.
            frais:
              type: number
              description: What was actually claimed and kept, in dollars (0 until a claim is collected).
            justification:
              type: [string, "null"]
              description: The notary's written reason for the claim (art. 2129 C.c.Q.).
            delaiJours:
              type: integer
            echeanceISO:
              type: string
              format: date
              description: Last civil day the notary may claim.
            decideeLe:
              type: [string, "null"]
              format: date
            joursAvant:
              type: integer
              description: Civil days left before the signing at cancel time.
            mecanisme:
              type: string
              enum: [capture, hors_session]
              description: >-
                ADR 0035 — HOW the fee was taken, because the client does not
                read the same sentence in both cases: `capture` kept it from a
                caution already held (the rest is released); `hors_session`
                charged it fresh on the card the client registered, since no
                amount was being held at all.
            percu:
              type: boolean
              description: >-
                Whether the money actually moved. `false` means the card
                DECLINED the fee: nothing was charged, nothing is owed to the
                notary, and the cancellation is recorded rather than silently
                free (an `annulation_frais` audit entry carries the reason).
            refus:
              type: [object, "null"]
              description: Present only when `percu` is false — the decline code.
              properties:
                code:
                  type: string
            chargeId:
              type: [string, "null"]
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          enum:
            - service_inconnu
            - montant_invalide
            - date_invalide
            - date_passee
            - sous_prix_depart
            - plafond_depasse
            - mois_invalide
            - json_invalide
            - courriel_invalide
            - signature_invalide
            - introuvable
            - non_autorise
            - interdit
            - deja_retenue
            - offre_non_ouverte
            - proposition_inferieure
            - message_trop_long
            - documents_requis
            - document_inconnu
            - proposition_introuvable
            - proposition_close
            - dossier_invalide
            - parametre_requis
            - telephone_invalide
            - nom_invalide
            - etude_invalide
            - adresse_invalide
            - alertes_invalides
            - alerte_rythme_invalide
            - profil_incomplet
            - trop_de_messages
            - type_inconnu
            - code_invalide
            - code_deja_pris
            - lien_invalide
            - compte_requis
            - message_requis
            - offre_annulee
            - corps_trop_grand
            - id_manquant
            - acte_non_autorise
            - offre_non_retenue
            - expediteur_invalide
        message:
          type: string
          description: Human-readable message (fr-CA).
        manquants:
          type: array
          description: >-
            Only on `profil_incomplet` (ADR 0033): the contact fields the
            notary still has to fill before retaining, with their fr-CA labels.
          items:
            type: object
            required: [id, label]
            properties:
              id:
                type: string
                enum: [nom, telephone, adresse]
              label:
                type: string
    NotaryRating:
      type: [object, "null"]
      description: >-
        Public evaluation average of a notary — null before the first
        evaluation (never zero stars). `note` is the one-decimal mean.
      properties:
        note:
          type: number
          minimum: 1
          maximum: 5
        avis:
          type: integer
          minimum: 1
    NotaryProfil:
      type: object
      description: >-
        The notary's own profile, as the console edits it: the CNQ fiche link
        (ADR 0016), the declared travel radius and online-urgency opt-in
        (ADR 0017) that gate which demandes the feed offers, the identity a
        retained client receives (ADR 0033 — nom, étude, téléphone, adresse,
        courriel), whether that identity is complete enough to retain
        (`complet` / `manquants`: nom, téléphone and adresse are required
        before /notary/bids/accept and /notary/bids/propose), and the alert
        preferences (`alertes`).
      required: [lienCNQ, rayonKm, urgences, prefixe, nom, etude, telephone, adresse, courriel, complet, manquants, alertes]
      properties:
        nom:
          type: [string, "null"]
          maxLength: 120
          description: The notary's name as a client will read it (« Me Prénom Nom »).
        etude:
          type: [string, "null"]
          maxLength: 120
          description: >-
            The firm's name. The source of the `etude` stamped on retained
            bids and propositions (`domain.notaryEtude`: étude, else the
            legacy sign-in label, else `nom`, else the courriel).
        telephone:
          type: [string, "null"]
          description: As typed, trimmed (`domain.validateTelephone`) — a dialable North-American number.
        adresse:
          type: [string, "null"]
          maxLength: 200
          description: The étude's address, one line.
        courriel:
          type: [string, "null"]
          format: email
          description: The notary's sign-in address — what a retained client receives.
        complet:
          type: boolean
          description: True when `manquants` is empty — the notary may retain and propose.
        manquants:
          type: array
          description: The required contact fields still empty, with their fr-CA labels.
          items:
            type: object
            required: [id, label]
            properties:
              id:
                type: string
                enum: [nom, telephone, adresse]
              label:
                type: string
        alertes:
          $ref: "#/components/schemas/NotaryAlertes"
        lienCNQ:
          type: [string, "null"]
          description: Official fiche URL on cnq.org, null when none is attached.
        rayonKm:
          type: integer
          enum: [0, 25, 50]
          default: 0
          description: >-
            Declared travel radius in km (NOTARY_RADII). 0 — the default — a
            notary who said nothing travels nowhere.
        urgences:
          type: boolean
          default: false
          description: True when the notary opted into 100 %-online urgency acts.
        prefixe:
          type: [string, "null"]
          description: >-
            The étude's postal sector (FSA, ADR 0025), null when none is
            declared — the feed then keeps the declarative travel rules.
    CustomerExperience:
      type: object
      description: >-
        Public projection of Nota's daily customer-experience controller. The
        mode may add bounded orientation copy to the intake; it does not alter
        legal questions, notary controls, prices or official outcomes.
      required: [version, mode, guidanceLevel]
      properties:
        version: { type: string }
        mode: { type: string, enum: [standard, guided] }
        guidanceLevel: { type: string, enum: [standard, guided] }
    NotaryTarif:
      type: object
      description: >-
        Nota's own price, as the CLIENT pays it (ADR 0031) — a line of the
        client's, never a share of the notary's honoraires. Since ADR 0034 it
        is a GRID: one cell per service, plus the date guarantee Nota sells on
        its own line. `prixNotaMinCents` is the advertised "from" — the lowest
        cell — and never the price of a given quote, which is computed from
        the grid with `domain.prixNota(serviceId, tierId, grille)`.
        `taxesIncluses` and `deboursInclus` are declared because art. 71 3° of
        the Code de déontologie requires saying whether taxes and débours are
        included.
      required: [grille, prixNotaMinCents, taxesIncluses, deboursInclus]
      properties:
        grille:
          $ref: '#/components/schemas/PrixNotaGrille'
        prixNotaMinCents:
          type: integer
          minimum: 0
        taxesIncluses:
          type: boolean
        deboursInclus:
          type: boolean
    PrixNotaGrille:
      type: object
      description: >-
        The Nota price grid (ADR 0034). `services` maps a service id to Nota's
        price in cents; `garantieDate` maps a notice tier id to the price of
        the date guarantee, in cents (the standard tier is 0). `defaut` is the
        fallback for a service the catalogue cannot name — the lowest cell, so
        Nota never charges more than it published.
      required: [defaut, services, garantieDate]
      properties:
        defaut:
          type: integer
          minimum: 0
        services:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        garantieDate:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
    NotaryAlertes:
      type: object
      description: >-
        How new demandes reach this notary (ADR 0033 §7). `instant` mails
        each matching demande as it is posted, `daily` is the digest (the
        default), `weekly` the digest on Mondays, `off` nothing. `urgentOnly`
        narrows instant alerts to prioritaire/urgence tiers.
      required: [pace, urgentOnly]
      properties:
        pace:
          type: string
          enum: [instant, daily, weekly, off]
          default: daily
        urgentOnly:
          type: boolean
          default: false
    NotaryConditions:
      type: object
      description: >-
        What retaining commits the notary to (ADR 0033), as data the console
        lays out BEFORE they confirm — never a share of their honoraires.
      required: [paiement, tarifNota, annulation, desistement, caution]
      properties:
        paiement:
          type: string
          const: signature
          description: Honoraires are paid in full at the signing (ADR 0015).
        tarifNota:
          $ref: "#/components/schemas/NotaryTarif"
        annulation:
          type: object
          description: >-
            The cancellation barème in force (the admin-stored item, else the
            environment defaults — resolved exactly like the cancel route).
            Since ADR 0041 each palier's `taux` is a CAP: the most the notary
            may claim, with justification, within `delaiJours` of the
            cancellation. Nothing is taken without a claim. The indemnity
            compensates the NOTARY. `applicable` is false when no billing
            adapter is configured — nothing can then be collected, the barème
            is information rather than a promise.
          required: [paliers, beneficiaire, applicable]
          properties:
            applicable:
              type: boolean
            indemnite:
              type: boolean
              const: true
            delaiJours:
              type: integer
            paliers:
              type: array
              items:
                type: object
                required: [maxJours, taux]
                properties:
                  maxJours:
                    type: integer
                    minimum: 0
                  taux:
                    type: number
                    exclusiveMinimum: 0
                    exclusiveMaximum: 1
            beneficiaire:
              type: string
              const: notaire
        caution:
          type: object
          description: >-
            ADR 0035 — what guarantees the payment: the client's card is
            validated by their bank before the demand is ever visible, and the
            amount is held `jours` days before the signing, late enough for the
            hold to survive to the act. Each demand also carries its own
            `caution.etat`.
          required: [jours, carteValidee]
          properties:
            jours:
              type: integer
              minimum: 0
              description: domain.CAUTION_LEAD_DAYS — days before the signing.
            carteValidee:
              type: boolean
              description: False when billing is off (demo, tests).
        desistement:
          type: object
          description: Withdrawing is free but counted on the notary's record (releasesCount).
          required: [gratuit, compte]
          properties:
            gratuit:
              type: boolean
              const: true
            compte:
              type: boolean
              const: true
    CancellationForecast:
      description: >-
        What cancelling TODAY would keep (ADR 0023 / ADR 0033): the palier's
        taux, the fee in dollars and the days left before the signing. Null
        when the cancel would be free or no live hold exists.
      oneOf:
        - type: "null"
        - type: object
          required: [taux, frais, joursAvant]
          properties:
            taux:
              type: number
            frais:
              type: number
            joursAvant:
              type: integer
              minimum: 0
    NotaryCote:
      type: object
      description: >-
        A notary's cote out of 100 and the four axes behind it (ADR 0028,
        `domain.notaryScore`). The cote is the SUM of the axes, rounded —
        nothing else, so a notary can redo it by hand from their screen. Unlike
        `rating` it always exists: a notary with no evaluation still has a
        presence, an availability and a track record.
      required: [cote, axes]
      properties:
        cote:
          type: integer
          minimum: 0
          maximum: 100
        axes:
          type: array
          description: The four axes, in order — their maxima add up to exactly 100.
          items:
            type: object
            required: [id, nom, nomEn, points, max, detail]
            properties:
              id:
                type: string
                enum: [satisfaction, services, disponibilite, presence]
              nom:
                type: string
                description: fr-CA label.
              nomEn:
                type: string
              points:
                type: number
                description: Points earned on that axis, one decimal, never above `max`.
              max:
                type: integer
                description: >-
                  The axis weight: satisfaction 40, services 25, disponibilité
                  20, présence 15.
              detail:
                type: object
                description: >-
                  The raw figures the axis was computed from — shape depends on
                  the axis, so the console can explain the number rather than
                  assert it. `satisfaction`: note, avis, notePonderee, cible.
                  `services`: actes, cible, servicesRendus, catalogue.
                  `disponibilite`: repondu, declinees, tauxReponse, rayonKm,
                  urgences. `presence`: fiche, secteur, joursDepuisActivite,
                  joursMembre.
                additionalProperties: true
    NotaryCommission:
      type: [object, "null"]
      description: >-
        The split this notary earns today (ADR 0016, ADR 0027, ADR 0028): the
        configured base rate, the floor, the effective rate their COTE earns,
        the share the notary KEEPS, the cote itself with its four axes, the
        whole ladder, and the next reachable rung (null at the top). ONE measure
        moves the rate — the cote out of 100 — and it only ever moves it toward
        the notary. Null when billing is not configured — never a fake rate.
      properties:
        taux:
          type: number
          description: Base platform rate (NOTA_COMMISSION_RATE; 0.15 by default).
        plancher:
          type: number
          description: >-
            The floor (NOTA_COMMISSION_RATE_FLOOR; 0.05 by default) — Nota never
            keeps less, so the notary never keeps more than 95 %.
        tauxEffectif:
          type: number
          description: >-
            Rate actually charged: the best rung the cote has reached, floored
            at `plancher` and capped at `taux`. A floor misconfigured above the
            base never charges MORE than the base.
        part:
          type: number
          description: The share the notary keeps (1 − tauxEffectif; 0.85 at the base, up to 0.95).
        bonus:
          type: number
          description: The reduction earned (taux − tauxEffectif).
        cote:
          type: integer
          minimum: 0
          maximum: 100
          description: The cote that earned this rate — the same number the client sees.
        axes:
          type: array
          description: The cote's four axes, as in `NotaryCote.axes`.
          items:
            type: object
            additionalProperties: true
        paliers:
          type: array
          description: >-
            The whole ladder, bounded the same way the effective rate is — the
            console shows the climb, not just the current rung.
          items:
            type: object
            required: [cote, taux, part]
            properties:
              cote:
                type: integer
                minimum: 1
                maximum: 100
                description: The cote that reaches this rung.
              taux:
                type: number
              part:
                type: number
                description: The share the notary keeps at that rung.
        prochain:
          type: [object, "null"]
          description: >-
            The nearest rung ABOVE this cote that would still lower the rate,
            with the points that separate it from today. Null at the top.
          properties:
            cote:
              type: integer
              description: The cote to reach.
            manque:
              type: integer
              minimum: 0
              description: Points still missing (cote of the rung − today's cote).
            tauxEffectif:
              type: number
            part:
              type: number
              description: The share the notary would keep at that rung.
    EvaluationResponse:
      type: object
      required: [evaluation]
      properties:
        evaluation:
          type: object
          required: [note]
          properties:
            note:
              type: integer
              minimum: 1
              maximum: 5
            commentaire:
              type: [string, "null"]
    ErrorResponse:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/Error"
    # --- La salle de signature (ADR 0047) ---------------------------------
    IceServer:
      type: object
      required: [urls]
      description: >-
        One ICE server. TURN entries carry the coturn time-limited credential
        (username = expiry, credential = its HMAC); STUN entries carry neither.
      properties:
        urls:
          type: array
          items: { type: string }
        username: { type: string }
        credential: { type: string }
    SalleSignal:
      type: object
      required: [n, type, de, charge]
      description: One WebRTC signalling message waiting for the polling peer.
      properties:
        n: { type: integer }
        type: { type: string, enum: [offre, reponse, candidat, fin] }
        de: { type: string, enum: [notaire, client] }
        charge: { type: string }
    Porte:
      type: object
      required: [ouverte]
      description: >-
        One of the four gates. When shut it says WHY, in the words shown to the
        person watching it shut.
      properties:
        ouverte: { type: boolean }
        raison: { type: [string, "null"] }
        message: { type: [string, "null"] }
    ProcesVerbalEntree:
      type: object
      required: [n, fait, par, a, detail, empreinte]
      description: >-
        One chained fact. `empreinte(n) = SHA-256(empreinte(n-1) ‖ entrée(n))`,
        so removing, inserting, reordering or retouching any entry changes every
        fingerprint after it. `detail` is a closed vocabulary: the procès-verbal
        never carries the content of the act nor what was said.
      properties:
        n: { type: integer }
        fait: { type: string }
        par: { type: string, enum: [notaire, client, systeme] }
        a: { type: string, format: date-time }
        detail: { type: object }
        empreinte: { type: string }
    ProcesVerbal:
      type: object
      required: [entrees, empreinte, demonstration]
      properties:
        salleId: { type: [string, "null"] }
        bidId: { type: [string, "null"] }
        mode: { type: string, enum: [strict, temoin, aucun] }
        demonstration:
          type: boolean
          description: >-
            A demonstration séance carries its mention as the FIRST chained
            entry, so it cannot be passed off as anything else without breaking
            the fingerprint.
        entrees:
          type: array
          items: { $ref: "#/components/schemas/ProcesVerbalEntree" }
        empreinte: { type: string }
        scelleLe: { type: [string, "null"], format: date-time }
    Salle:
      type: object
      required: [id, bidId, mode, statut, etape, portes, toutesOuvertes]
      description: The signing room as either party is allowed to see it.
      properties:
        id: { type: string }
        bidId: { type: string }
        dateISO: { type: string, format: date }
        mode: { type: string, enum: [strict, temoin, aucun] }
        demonstration: { type: boolean }
        statut: { type: string, enum: [prevue, ouverte, suspendue, scellee, annulee] }
        etape:
          type: string
          enum: [accueil, identite, lien, consentement, lecture, questions, signature, cloture]
        etapes:
          type: array
          description: The ceremony, with the notary's spoken guidance for each step.
          items:
            type: object
            properties:
              id: { type: string }
              ordre: { type: integer }
              nom: { type: string }
              conduite: { type: string }
              constat: { type: string }
        portes:
          type: object
          properties:
            compte: { $ref: "#/components/schemas/Porte" }
            identite: { $ref: "#/components/schemas/Porte" }
            lien: { $ref: "#/components/schemas/Porte" }
            presence: { $ref: "#/components/schemas/Porte" }
        fermees:
          type: array
          items: { type: string }
        toutesOuvertes: { type: boolean }
        sas:
          type: [string, "null"]
          description: The short authentication string both screens must show.
        lien:
          type: object
          properties:
            empreinteNotaire: { type: [string, "null"] }
            empreinteClient: { type: [string, "null"] }
            confirmeLe: { type: [string, "null"], format: date-time }
        identites: { type: object }
        consentements: { type: object }
        consentement:
          type: object
          properties:
            requis: { type: boolean }
            complet: { type: boolean }
            manquants: { type: array, items: { type: string } }
            retires: { type: array, items: { type: string } }
        enregistre:
          type: boolean
          description: Whether a recording is running right now.
        parties: { type: object }
        presence:
          type: object
          properties:
            coupeeA: { type: [integer, "null"] }
            repriseA: { type: [integer, "null"] }
        signature:
          type: [object, "null"]
          description: >-
            What the signature port returned. `minute` is null with the
            demonstration adapter, and `avis` is the notice the interface MUST
            display.
          properties:
            fournisseur: { type: string }
            reference: { type: string }
            minute: { type: [string, "null"] }
            signeeLe: { type: string, format: date-time }
            avis: { type: [string, "null"] }
        scelle:
          oneOf:
            - $ref: "#/components/schemas/ProcesVerbal"
            - type: "null"
        pv:
          type: array
          items: { type: object }
        rev: { type: integer }

openapi: 3.1.0
info:
  title: Nota API
  version: 0.1.0
  description: >-
    HTTP API for the Nota marketplace: the public carnet of notarial-act bids for
    Quebec City. Every offer is revalidated server-side through @nota/domain; the
    client's tier, premium and total are never trusted, and a bid marked
    `anonyme` never leaks its `nom`.


    NOTE: this specification is kept in sync with `apps/api/src/handler.js` **by
    hand** for now. When a route or field changes there, update it here in the
    same change (see AGENTS.md).
  license:
    name: UNLICENSED
servers:
  - url: /api
    description: Same-origin path fronted by CloudFront (production).
  - url: http://localhost:8788
    description: Local dev server (apps/api/local-server.js).
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe.
      responses:
        "200":
          description: Service is up; echoes the server's current date.
          content:
            application/json:
              schema:
                type: object
                required: [ok, today]
                properties:
                  ok:
                    type: boolean
                    const: true
                  today:
                    type: string
                    format: date
                    description: Server "today" as ISO YYYY-MM-DD.
              example:
                ok: true
                today: "2026-08-12"
  /bids:
    get:
      operationId: listBids
      summary: List the public bids for a month.
      parameters:
        - name: month
          in: query
          required: false
          description: Month to read, `YYYY-MM`. Defaults to the current month.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          example: "2026-08"
      responses:
        "200":
          description: The bids posted in that month (public projection).
          content:
            application/json:
              schema:
                type: object
                required: [month, bids]
                properties:
                  month:
                    type: string
                    pattern: '^\d{4}-\d{2}$'
                  bids:
                    type: array
                    items:
                      $ref: "#/components/schemas/Bid"
        "400":
          description: Malformed `month` parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: mois_invalide
                    message: month doit être AAAA-MM.
    post:
      operationId: createBid
      summary: Post a bid on a date.
      description: >-
        Revalidates the offer through @nota/domain. `anonyme` defaults to true;
        `nom` is never returned for an anonymous bid (it is stored privately for
        the mise en relation with the retaining notary, ADR 0010 §4). The
        write-only `telephone` (private contact) and `parrain` (partner
        referral code, ADR 0011) ride along here and are never echoed by any
        response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferInput"
      responses:
        "201":
          description: >-
            Bid created (public projection) plus the client's per-bid token.
            The client has no account: `clientToken` (scope `client`, valid
            ~400 days, `sub` = bid id) is their only key to the `/client/*`
            routes — it is returned ONCE here and never echoed again. With
            billing on, `paymentStatus` (pending) and `checkoutUrl` are added.
          content:
            application/json:
              schema:
                type: object
                required: [bid, clientToken]
                properties:
                  bid:
                    $ref: "#/components/schemas/Bid"
                  clientToken:
                    type: string
                    description: Per-bid client token; sent as a Bearer Authorization header.
                  paymentStatus:
                    type: string
                    enum: [pending]
                  checkoutUrl:
                    type: string
                    format: uri
        "400":
          description: Body was not valid JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: json_invalide
                    message: Corps JSON invalide.
        "422":
          description: >-
            The offer failed domain validation. One or more typed errors are
            returned; the client renders them inline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: sous_prix_depart
                    message: L’offre doit être d’au moins 2 000 $.
  /partenaires:
    post:
      operationId: requestPartnerClaim
      summary: Request an email-verified claim on a partner referral code (step 1 of 2, ADR 0011).
      description: >-
        The referral program's front door — now EMAIL-VERIFIED to close two fraud
        vectors (code squatting and harvest-then-claim). Step 1 of a two-step,
        mailbox-proven handshake mirroring the notary sign-in: validate the
        partner type, courriel and desired code, per-IP rate-limit, then mint a
        single-use challenge and EMAIL a confirmation link. NO partner record is
        written yet, so an unverified claim never becomes the payee and never
        permanently blocks the true owner. Enumeration honesty: a code already
        CONFIRMED by another courriel answers 409 `code_deja_pris` (you cannot
        claim a taken code — the one unavoidable disclosure); the SAME courriel
        re-requesting its own confirmed code gets `{ confirmed: true }` with what
        is on file; a FREE code and a merely-PENDING code are indistinguishable —
        both get the generic `{ ok: true }` (+ `devLink`/`devToken` outside
        production, NEVER in production). Redeem the link at `/partenaires/verify`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, courriel, code]
              properties:
                type:
                  type: string
                  description: Partner category id from the domain's REFERRAL.partners.
                  enum: [agent_immobilier, courtier_hypothecaire, autre_professionnel]
                courriel:
                  type: string
                  format: email
                  maxLength: 254
                  description: The partner's contact email (lowercased server-side).
                code:
                  type: string
                  description: Desired referral code — 4–12 letters/digits, case-insensitive, separators ignored.
                  example: eve-roy
      responses:
        "200":
          description: >-
            The claim was accepted and a confirmation link emailed (generic
            `{ ok: true }` — identical for a free or a merely-pending code), OR
            the same courriel re-requested its own ALREADY-confirmed code
            (`{ confirmed: true }` with the registration on file).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
                  confirmed:
                    type: boolean
                    description: Present and true only when the same courriel already owns this confirmed code.
                  partenaire:
                    $ref: "#/components/schemas/PartnerRegistration"
                  devLink:
                    type: string
                    description: NON-PRODUCTION ONLY — the full confirmation link, for local dev/tests.
                  devToken:
                    type: string
                    description: NON-PRODUCTION ONLY — the raw challenge token, redeemed at /partenaires/verify.
              example:
                ok: true
        "400":
          description: Body was not valid JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The code is already CONFIRMED by another courriel (`code_deja_pris`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            Typed validation errors: `type_inconnu`, `courriel_invalide`,
            `code_invalide`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Per-IP rate limit exceeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  throttled:
                    type: boolean
                    const: true
              example:
                ok: true
                throttled: true
  /partenaires/verify:
    post:
      operationId: verifyPartnerClaim
      summary: Confirm an email-verified partner code claim (step 2 of 2, ADR 0011).
      description: >-
        Step 2 of the partner code claim. Verifies the single-use CHALLENGE token
        from the emailed link (or the dev echo), atomically consumes it (a replay
        or an expired link is rejected, a forged/tampered token never verifies),
        and only THEN writes the confirmed partner record (write-once, first
        verify wins) — the payee of record. Sends the welcome + operator mails
        exactly once. Mirrors `/notary/session/verify`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: The CHALLENGE token from the emailed confirmation link (or the dev echo).
      responses:
        "201":
          description: The claim was confirmed; the stored (normalized) registration is echoed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerRegistration"
        "200":
          description: >-
            Idempotent — the same courriel already confirmed this code (a race the
            write-once create lost); what is on file is echoed with `confirmed: true`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  confirmed:
                    type: boolean
                    const: true
                  partenaire:
                    $ref: "#/components/schemas/PartnerRegistration"
        "401":
          description: The token is invalid, expired, tampered, or already used (`lien_invalide`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Another verified owner claimed the code first (`code_deja_pris`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /notaries/connect:
    post:
      operationId: startConnectOnboarding
      summary: Start a notary's FREE Stripe Connect onboarding.
      description: >-
        Opens a Stripe Connect onboarding link and returns the hosted URL the
        notary redirects to. Joining is free — there is no subscription; Nota
        collects a commission (a configurable share of the acte's value) only
        when a retained act completes, as an application fee on a destination
        charge. Card data never touches this server. The account becomes ACTIVE
        via the `account.updated` webhook once charges are enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectInput"
      responses:
        "200":
          description: Onboarding link created; redirect the notary to `url`.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    format: uri
                    description: Stripe-hosted Checkout URL.
                example:
                  url: https://checkout.stripe.com/c/pay/cs_test_a1b2c3
        "422":
          description: The email failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: courriel_invalide
                    message: Un courriel valide est requis.
  /stripe/webhook:
    post:
      operationId: stripeWebhook
      summary: Stripe webhook receiver (account + payment lifecycle).
      description: >-
        Verifies the raw request body against the webhook signing secret using
        the `stripe-signature` header, then applies the event — `account.updated`
        flips the notary ACTIVE once charges are enabled,
        `account.application.deauthorized` restricts them, and
        `checkout.session.completed` / `checkout.session.expired` /
        `payment_intent.canceled` bind or void a client's offer authorization.
        Processing is idempotent by event id, so a redelivered event is a no-op.
        Not called by browsers.
      parameters:
        - name: stripe-signature
          in: header
          required: true
          description: Stripe signature used to verify the payload.
          schema:
            type: string
      requestBody:
        required: true
        description: The raw Stripe event payload (verified, not parsed as trusted JSON).
        content:
          application/json:
            schema:
              type: object
              description: An opaque Stripe Event object.
      responses:
        "200":
          description: Event verified and processed (or ignored/duplicated).
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received:
                    type: boolean
                    const: true
              example:
                received: true
        "400":
          description: Missing or invalid Stripe signature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: signature_invalide
                    message: Signature Stripe invalide.
  /notary/session/request:
    post:
      operationId: requestNotarySignInLink
      summary: Request a passwordless sign-in link for the notary console (step 1 of 2).
      description: >-
        Step 1 of the notary console sign-in. Proves mailbox ownership BEFORE any
        session token is minted (the old one-shot route trusted a bare, unverified
        request email). Per-IP rate-limited and ENUMERATION-SAFE: an active
        notary, an inactive one and a stranger all receive the SAME generic
        `{ ok: true }`, so the response never reveals whether an address is a
        notary. Only an ACTIVE notary (or the dev/demo hatch) actually mints a
        single-use, ~15-minute challenge and is emailed the link. Outside
        production the response also carries `devLink`/`devToken` so local dev and
        the test suite complete the flow with no mailbox; NEVER in production.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  description: The notary's professional email.
      responses:
        "200":
          description: >-
            Generic acknowledgement — identical whether or not the address is a
            notary. `throttled` is never true here (the rate limit maps to 429).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
                  devLink:
                    type: string
                    description: NON-PRODUCTION ONLY — the full magic link, for local dev/tests.
                  devToken:
                    type: string
                    description: NON-PRODUCTION ONLY — the raw challenge token, redeemed at /notary/session/verify.
              example:
                ok: true
        "422":
          description: The email failed validation (leaks nothing about who is a notary).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: courriel_invalide
                    message: Le courriel n’est pas valide.
        "429":
          description: Per-IP rate limit exceeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  throttled:
                    type: boolean
                    const: true
              example:
                ok: true
                throttled: true
  /notary/session/verify:
    post:
      operationId: verifyNotarySignInLink
      summary: Redeem a magic link for a notary session (step 2 of 2).
      description: >-
        Step 2 of the notary console sign-in. Verifies the single-use CHALLENGE
        token, atomically consumes it (a replay or an expired link is rejected),
        re-checks the notary is still ACTIVE, then issues the stateless SESSION +
        FEED tokens. Preserves the notary profile upsert (stable étude label).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: The CHALLENGE token from the emailed link (or the dev echo).
      responses:
        "200":
          description: The link was valid and unredeemed; a session is issued.
          content:
            application/json:
              schema:
                type: object
                required: [token, feedToken, email, expiresAt]
                properties:
                  token:
                    type: string
                    description: SESSION token — sent in the Authorization header, never in a URL.
                  feedToken:
                    type: string
                    description: Read-only FEED token, safe to embed in a webcal URL.
                  email:
                    type: string
                    format: email
                    description: The authenticated notary's own address.
                  expiresAt:
                    type: string
                    format: date-time
        "401":
          description: The token is invalid, expired, tampered, or already used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: lien_invalide
                    message: Lien invalide ou déjà utilisé.
        "403":
          description: The notary is no longer active (deactivated between request and verify).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: compte_requis
                    message: Un compte notaire actif est requis pour accéder à la console. L’inscription est gratuite.
  /notary/bids:
    get:
      operationId: listNotaryBids
      summary: Open bids for the notary console (+ this notary's retained bids).
      security:
        - notarySession: []
      parameters:
        - name: service
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ServiceId"
      responses:
        "200":
          description: >-
            Open, live bids in the forward month window (minus the ones this
            notary declined), each with THIS notary's own latest proposition
            and document request (never another notary's) and the dossier items
            still missing. The feed only offers what this notary can serve
            (ADR 0017/0025, `notaryCanServe`): when both the bid's postal
            sector and the étude's are known, the MEASURED distance decides
            (it must fit the declared band, and the notary's `rayonKm` when
            the notary travels); otherwise the declarative proxy applies — a
            travel band beyond the declared `rayonKm`, or an online urgency
            they never opted into, is filtered out server-side; bids predating
            the déplacement question reach everyone. Each bid carries
            `distanceKm`, the ≈ km between the two sectors (null when either
            sector is unknown). `retained` lists the bids in the window retained by
            this notary — including those retained through a proposition the
            client accepted (`viaProposition`), which the console never
            accepted itself — each with the `client` contact block (mise en
            relation, ADR 0010 §4). Open bids never carry client contact.
          content:
            application/json:
              schema:
                type: object
                required: [bids, retained, rating, profil, commission]
                properties:
                  bids:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotaryBid"
                  retained:
                    type: array
                    items:
                      $ref: "#/components/schemas/RetainedBid"
                  rating:
                    $ref: "#/components/schemas/NotaryRating"
                  profil:
                    $ref: "#/components/schemas/NotaryProfil"
                  commission:
                    $ref: "#/components/schemas/NotaryCommission"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /notary/evaluations:
    get:
      operationId: listNotaryEvaluations
      summary: The notary's own track record — every client evaluation, newest first.
      description: >-
        The anonymized evaluation ledger (ADR 0021): each entry is the note,
        the optional comment, the act's service and date, and the instant the
        client submitted it — never the client's identity. Evaluations
        submitted before the ledger existed are not backfilled; they remain
        counted in `rating`.
      security:
        - notarySession: []
      responses:
        "200":
          description: The aggregate the clients see, and the entries behind it.
          content:
            application/json:
              schema:
                type: object
                required: [rating, evaluations]
                properties:
                  rating:
                    $ref: "#/components/schemas/NotaryRating"
                  evaluations:
                    type: array
                    items:
                      type: object
                      required: [note]
                      properties:
                        note:
                          type: integer
                          minimum: 1
                          maximum: 5
                        commentaire:
                          type: [string, "null"]
                        serviceId:
                          type: [string, "null"]
                        dateISO:
                          type: [string, "null"]
                          description: The act's date (the signing the note rates).
                        createdAt:
                          type: [string, "null"]
                          description: When the client submitted the evaluation.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /notary/profile:
    post:
      operationId: updateNotaryProfile
      summary: Update the notary's profile — CNQ fiche, travel radius, urgency opt-in.
      description: >-
        The editable fields of the notary's profile. `lienCNQ` (ADR 0016) is
        the link of their official fiche in the Chambre des notaires du Québec
        directory — the domain is the authority on what counts as a fiche
        (https on the `cnq.org` host or a subdomain, nothing else), and an
        empty value clears the fiche (and the « CNQ » badge clients see).
        `rayonKm` and `urgences` (ADR 0017) declare how far the notary travels
        for in-person signatures and whether they take 100 %-online urgency
        acts — the two levers that widen (or narrow) the demandes the feed
        offers them. `prefixe` (ADR 0025) is the étude's postal sector (FSA):
        optional — empty clears it — but when present it turns the feed's
        declarative travel rules into measured client↔étude distances. The
        write spreads the existing profile record, so the billing identity
        and the rating aggregates survive.
      security:
        - notarySession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lienCNQ:
                  type: [string, "null"]
                  description: Official fiche URL on cnq.org, or empty to clear.
                rayonKm:
                  type: integer
                  enum: [0, 25, 50]
                  default: 0
                  description: Declared travel radius in km (NOTARY_RADII); absent means 0.
                urgences:
                  type: boolean
                  default: false
                  description: Opt into 100 %-online urgency acts (strictly boolean true).
                prefixe:
                  type: [string, "null"]
                  maxLength: 3
                  description: >-
                    The étude's postal sector (FSA, e.g. "G1V"), normalized
                    server-side; empty/absent clears it. Malformed → 422
                    `prefixe_invalide`.
                token:
                  type: string
                  description: Session token fallback when the Authorization header is absent.
      responses:
        "200":
          description: The stored profile.
          content:
            application/json:
              schema:
                type: object
                required: [profil]
                properties:
                  profil:
                    $ref: "#/components/schemas/NotaryProfil"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: >-
            The link is not a fiche on the Chambre's own site
            (`lien_cnq_invalide`), the radius is not 0, 25 or 50
            (`rayon_invalide`), or the étude sector is not letter-digit-letter
            (`prefixe_invalide`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
  /notary/bids/accept:
    post:
      operationId: acceptBid
      summary: Retain an open bid at the client's price (accepter l'offre).
      description: >-
        The console's one-click retain. A conditional retain (`retainFor`) closes
        the TOCTOU race — two notaries accepting the same open bid concurrently
        both read `ouverte`, but only ONE write wins; the loser gets 409
        `deja_retenue`. Idempotent for the winner: a re-accept by the SAME notary
        re-returns the released dossier (settling a pending pay-on-accept capture
        if billing is on). The response hands the retaining notary the dossier
        and the mise en relation `client` contact block (ADR 0010 §4); `courriel`
        stays at the top level for existing callers. With billing configured and
        an authorized card, the payout fields (`paid` + `commissionCents`/
        `netCents`, or `paid:false` + `paymentError`) are added.
      security:
        - notarySession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO]
              properties:
                id:
                  type: string
                dateISO:
                  type: string
                  format: date
                token:
                  type: string
                  description: Session token fallback when no Authorization header is sent.
      responses:
        "200":
          description: The bid is retained by this notary; the released dossier is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedBid"
        "400":
          description: Body was not valid JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            The bid's déplacement band is beyond this notary's declared radius,
            or an online urgency they never opted into (ADR 0017,
            `deplacement_non_couvert`). A notary who already retained the bid
            keeps the idempotent re-accept regardless.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: deplacement_non_couvert
                    message: Cette demande exige un déplacement ou une urgence en ligne que votre profil ne couvre pas.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AlreadyRetained"
        "410":
          description: The bid was cancelled by the client (`offre_annulee`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /notary/bids/propose:
    post:
      operationId: proposeCounterOffer
      summary: Propose a higher price to the client (proposition de prix).
      description: >-
        Validated by the domain (`validateCounterOffer`): the amount must exceed
        the client's offer and stay under the premium cap; the date must not be
        past. A new proposition by the same notary marks their previous
        `en_attente` one `remplacee`. The client is emailed (`propositionRecue`)
        and answers through `/client/propositions/accept|decline`.
      security:
        - notarySession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO, montant]
              properties:
                id:
                  type: string
                dateISO:
                  type: string
                  format: date
                montant:
                  type: integer
                  minimum: 1
                message:
                  type: string
                  maxLength: 500
                token:
                  type: string
                  description: Session token fallback when no Authorization header is sent.
      responses:
        "200":
          description: Proposition recorded (notary projection).
          content:
            application/json:
              schema:
                type: object
                required: [proposition]
                properties:
                  proposition:
                    $ref: "#/components/schemas/NotaryProposition"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            The bid's déplacement band is beyond this notary's declared radius,
            or an online urgency they never opted into (ADR 0017,
            `deplacement_non_couvert`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: deplacement_non_couvert
                    message: Cette demande exige un déplacement ou une urgence en ligne que votre profil ne couvre pas.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AlreadyRetained"
        "422":
          description: >-
            Domain errors: `offre_non_ouverte`, `montant_invalide`, `date_passee`,
            `proposition_inferieure`, `plafond_depasse`, `message_trop_long`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /notary/bids/documents:
    post:
      operationId: requestDocuments
      summary: Ask the client for dossier documents/fields (demande de documents).
      description: >-
        `documents` are ids from the service's requestable items (documents and
        intake fields). Allowed while the bid is open, or when THIS notary
        retained it; a bid retained by another notary answers 409. The client
        is emailed the list (`documentsDemandes`).
      security:
        - notarySession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO, documents]
              properties:
                id:
                  type: string
                dateISO:
                  type: string
                  format: date
                documents:
                  type: array
                  minItems: 1
                  items:
                    type: string
                message:
                  type: string
                  maxLength: 500
                token:
                  type: string
      responses:
        "200":
          description: Request recorded (notary projection).
          content:
            application/json:
              schema:
                type: object
                required: [demande]
                properties:
                  demande:
                    $ref: "#/components/schemas/NotaryDemande"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AlreadyRetained"
        "422":
          description: >-
            Domain errors: `service_inconnu`, `documents_requis`,
            `document_inconnu`, `message_trop_long`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /notary/bids/message:
    post:
      operationId: notarySendMessage
      summary: Write to the client of a retained act (conversation de l'acte retenu).
      description: >-
        The retained-act thread (domain `validateChatMessage`): it only exists
        while the bid is RETAINED, and only for the notary who holds it (any
        other notary -> 403 `interdit`). The thread is read back on
        `GET /notary/bids` (retained entries) and `GET /client/bid`; both
        consoles poll it — messages trigger no email.
      security:
        - notarySession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO, texte]
              properties:
                id:
                  type: string
                dateISO:
                  type: string
                  format: date
                texte:
                  type: string
                  maxLength: 500
                token:
                  type: string
                  description: Session token fallback when no Authorization header is sent.
      responses:
        "200":
          description: Message appended to the thread.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    $ref: "#/components/schemas/ChatMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >-
            Domain errors: `message_requis`, `message_trop_long`,
            `offre_non_retenue`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /notary/bids/release:
    post:
      operationId: releaseRetainedBid
      summary: Withdraw AFTER accepting — the act returns to the open market (désistement).
      description: >-
        A notary who retained an act may still withdraw when a surfaced detail
        (an unfamiliar lender, a conflict) makes the file impossible on their
        side (domain `validateRelease`). The bid returns to the carnet exactly
        as the client posted it (same date, amount, dossier); the withdrawing
        notary stops seeing it (decline marker) and their calendar pointer is
        dropped. The client is emailed (`actReleased`); the operator is alerted
        when a payment may be in flight or a reason was given.
      security:
        - notarySession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO]
              properties:
                id:
                  type: string
                dateISO:
                  type: string
                  format: date
                message:
                  type: string
                  maxLength: 500
                  description: Optional reason, relayed to the operator (never shown publicly).
                token:
                  type: string
      responses:
        "200":
          description: The bid, back on the open market (public projection).
          content:
            application/json:
              schema:
                type: object
                required: [bid]
                properties:
                  bid:
                    $ref: "#/components/schemas/Bid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >-
            Domain errors: `offre_non_retenue` (the bid is not retained),
            `message_trop_long`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /notary/acts/complete:
    post:
      operationId: completeRetainedAct
      summary: Settle a retained act at its confirmed value — THE payment moment (ADR 0015).
      description: >-
        The notary who retained the bid confirms the act signed and its final
        value. With a live client authorization Nota captures it and transfers
        the net; otherwise the commission model applies as fallback. The act
        ledger is write-once: a duplicate submit answers with the ORIGINAL
        settled figures and never charges twice. The domain bounds the value
        against the retained offer (`validateActValue`, `ACT_VALUE_BOUNDS`) —
        a figure far outside it is a typo, refused before the ledger.
      security:
        - notarySession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bidId, dateISO, actAmount]
              properties:
                bidId:
                  type: string
                dateISO:
                  type: string
                  format: date
                actAmount:
                  type: number
                  description: The value confirmed at signing, in dollars.
      responses:
        "200":
          description: The act is settled (now, or already — same figures either way).
          content:
            application/json:
              schema:
                type: object
                required: [ok, actAmount, commissionCents]
                properties:
                  ok:
                    type: boolean
                  actAmount:
                    type: integer
                    description: The SETTLED value — the ledger's original figure on a duplicate submit.
                  commissionCents:
                    type: integer
                  paid:
                    type: boolean
                    description: Present when the client's authorization was captured.
                  netCents:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: This act was not retained by the requesting notary (`acte_non_autorise`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            Domain errors: `montant_invalide`, `montant_hors_bornes` (value far
            outside the retained offer), or a billing refusal
            (`compte_incomplet`, `paiement_echoue`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /client/bid:
    get:
      operationId: getClientBid
      summary: The client's own offer, propositions, document requests and readiness.
      description: >-
        Requires the per-bid client token whose `sub` equals `id` (any other
        token -> 403 `interdit`). Propositions marked `remplacee` are hidden.
        The client sees each notary's `etude`, never a `notaryId`.
      security:
        - clientToken: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
        - name: dateISO
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The client's view of their bid.
          content:
            application/json:
              schema:
                type: object
                required: [bid, notaire, propositions, demandes, readiness]
                properties:
                  bid:
                    $ref: "#/components/schemas/Bid"
                  notaire:
                    description: >-
                      The notary half of the mise en relation (ADR 0010 §4):
                      once the bid is RETAINED, the retaining notary's étude
                      and courriel. Null while the bid is open — contact flows
                      in neither direction before retention.
                    oneOf:
                      - type: "null"
                      - type: object
                        required: [etude, courriel]
                        properties:
                          etude:
                            type: [string, "null"]
                          courriel:
                            type: [string, "null"]
                          rating:
                            $ref: "#/components/schemas/NotaryRating"
                          lienCNQ:
                            type: [string, "null"]
                            description: >-
                              The retaining notary's official fiche in the
                              Chambre des notaires directory (ADR 0016) — like
                              `courriel`, only present once retained.
                  propositions:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClientProposition"
                  demandes:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClientDemande"
                  readiness:
                    $ref: "#/components/schemas/Readiness"
                  messages:
                    type: array
                    description: The retained-act conversation. Empty until a notary retains the bid.
                    items:
                      $ref: "#/components/schemas/ChatMessage"
                  acte:
                    type: object
                    description: >-
                      Act settlement state (ADR 0015) — `complete` flips once
                      the ACT# ledger has settled the signing; the UI keys the
                      evaluation door on it.
                    properties:
                      complete:
                        type: boolean
                  evaluation:
                    type: [object, "null"]
                    description: The client's evaluation, once submitted (ADR 0021).
                    properties:
                      note:
                        type: integer
                      commentaire:
                        type: [string, "null"]
                  annulation:
                    type: [object, "null"]
                    description: >-
                      What cancelling TODAY would cost (ADR 0023), disclosed
                      before the client confirms. Null when the cancel would be
                      free (open offer, no live hold, free window) or
                      impossible (settled act).
                    properties:
                      taux:
                        type: number
                      frais:
                        type: number
                      joursAvant:
                        type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /client/bid/message:
    post:
      operationId: clientSendMessage
      summary: Answer the retaining notary in the retained-act thread.
      description: >-
        Same thread as `/notary/bids/message`, from the client side, guarded by
        the per-bid client token. Only exists while the bid is RETAINED
        (domain `validateChatMessage` -> 422 `offre_non_retenue` otherwise).
      security:
        - clientToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO, texte]
              properties:
                id:
                  type: string
                dateISO:
                  type: string
                  format: date
                texte:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Message appended to the thread.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    $ref: "#/components/schemas/ChatMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >-
            Domain errors: `message_requis`, `message_trop_long`,
            `offre_non_retenue`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /client/propositions/accept:
    post:
      operationId: acceptProposition
      summary: Accept a notary's proposition — the bid is retained at that price.
      description: >-
        Sets `montant` to the proposition's amount (premium recomputed against
        the bid's floor), marks the proposition `acceptee` and every other
        pending one `refusee`, then retains the bid for that notary through the
        SAME conditional retain path as `/notary/bids/accept` (calendar pointer,
        analytics, "offer retained" email). The proposing notary is emailed
        (`propositionAcceptee`).


        PAY-ON-ACCEPT: nothing is captured here — the card hold was authorized
        for the ORIGINAL amount. With billing on, the bid is flagged
        `paymentStatus` = `a_reautoriser` and settlement is left to
        `/notary/acts/complete`.
      security:
        - clientToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropositionAnswerInput"
      responses:
        "200":
          description: The bid is now retained at the new amount.
          content:
            application/json:
              schema:
                type: object
                required: [bid, proposition]
                properties:
                  bid:
                    $ref: "#/components/schemas/Bid"
                  proposition:
                    $ref: "#/components/schemas/ClientProposition"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Bid (`introuvable`) or proposition (`proposition_introuvable`) not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/AlreadyRetained"
        "422":
          description: The proposition is no longer pending (`proposition_close`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /client/propositions/decline:
    post:
      operationId: declineProposition
      summary: Decline a notary's proposition — the bid stays open at the client's price.
      description: The proposition becomes `refusee`; the notary is emailed (`propositionRefusee`).
      security:
        - clientToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropositionAnswerInput"
      responses:
        "200":
          description: Proposition declined.
          content:
            application/json:
              schema:
                type: object
                required: [proposition]
                properties:
                  proposition:
                    $ref: "#/components/schemas/ClientProposition"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Bid (`introuvable`) or proposition (`proposition_introuvable`) not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/AlreadyRetained"
        "422":
          description: The proposition is no longer pending (`proposition_close`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /client/dossier:
    post:
      operationId: updateClientDossier
      summary: Replace the client's dossier (answer to a document request).
      description: >-
        Always allowed for the bid's owner, open or retained. `dossier` must be
        a plain object (else 422 `dossier_invalide`). The stored dossier is
        CLEANED (domain.cleanDossier): only the service's own document/field
        ids, the `__consent` flag and the known `__pricing` answers persist,
        each value bounded — unknown keys and local UI state (`__validated`)
        are dropped. Answers with the fresh domain readiness and each
        demande's `fournie` flag.
      security:
        - clientToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO, dossier]
              properties:
                id:
                  type: string
                dateISO:
                  type: string
                  format: date
                dossier:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Dossier replaced.
          content:
            application/json:
              schema:
                type: object
                required: [readiness, demandes]
                properties:
                  readiness:
                    $ref: "#/components/schemas/Readiness"
                  demandes:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClientDemande"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: "`dossier_invalide`: the dossier is not a plain object."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /client/bid/cancel:
    post:
      operationId: cancelClientBid
      summary: Withdraw an offer — open or already retained.
      description: >-
        Guarded by the bid's own CLIENT token. Idempotent: cancelling an
        already-cancelled offer answers 200 with the final state (and never
        charges twice). An OPEN offer simply leaves the carnet (a live card
        hold is released). A RETAINED offer unwinds the mise en relation: the
        retaining notary and the operator are notified, and the signing leaves
        the notary's calendar feed. A LATE cancellation of a retained offer
        carries a fee (ADR 0023) kept by PARTIAL capture of the client's
        existing hold — the barème (days-before-signing paliers) is decided by
        Nota from the admin console; the remainder of the hold is released
        immediately. Every path that keeps no fee releases the hold whole. The
        fee actually kept rides back on `bid.annulation`. A settled act (ACT#
        ledger) refuses with 409 `acte_complete`. Every market surface hides
        the bid afterwards; only the owner keeps reading it via GET
        /client/bid.
      security:
        - clientToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO]
              properties:
                id:
                  type: string
                dateISO:
                  type: string
                  format: date
      responses:
        "200":
          description: The offer is cancelled (status `annulee`).
          content:
            application/json:
              schema:
                type: object
                required: [bid]
                properties:
                  bid:
                    $ref: "#/components/schemas/Bid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            The act is signed and settled (`acte_complete`) — it can no longer
            be cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /client/welcome:
    post:
      operationId: clientWelcome
      summary: Passwordless client signup — send the welcome email.
      description: >-
        The one client-signup call, reached from the sign-in modal and from the
        discreet « Créer mon compte » opt-in of the bid dialog. Fire-and-forget:
        a valid address triggers the (idempotent-per-address) welcome email; a
        missing or invalid one is a silent no-op. Always answers 200 {ok:true}
        so the UI never blocks on mail, and no data is echoed back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                courriel:
                  type: string
                  format: email
      responses:
        "200":
          description: Acknowledged (whether or not an email was sent).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "400":
          description: Invalid JSON body.
  /client/evaluation:
    post:
      operationId: evaluateNotary
      summary: Rate the retaining notary once the act is signed (ADR 0015).
      description: >-
        Guarded by the bid's own CLIENT token. Opens only after the act has
        settled (the ACT# ledger has an entry) — before that, 409
        `acte_non_complete`. One evaluation per bid: a re-submit answers 200
        with what is on file (the first note stands). The note feeds the
        notary profile's rating aggregate (`ratingCount`/`ratingSum`; the
        public average is `domain.ratingAverage`).
      security:
        - clientToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO, note]
              properties:
                id:
                  type: string
                dateISO:
                  type: string
                  format: date
                note:
                  type: integer
                  minimum: 1
                  maximum: 5
                commentaire:
                  type: string
                  maxLength: 500
      responses:
        "201":
          description: Evaluation recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationResponse"
        "200":
          description: Already evaluated — the evaluation on file is echoed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`acte_non_complete`: the act is not settled yet."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation errors from the domain (`note_invalide`, `commentaire_trop_long`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contact:
    post:
      operationId: sendContactMessage
      summary: Send a message to the Nota team (nous joindre form).
      description: >-
        No auth — anyone stuck deserves a way to reach a human. The domain
        validates (`courriel_invalide`, `message_requis`, `message_trop_long`);
        the operator receives the message and the sender an acknowledgement.
        `bidId` optionally ties the message to an offer for faster triage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courriel, message]
              properties:
                nom:
                  type: string
                  maxLength: 150
                courriel:
                  type: string
                  format: email
                sujet:
                  type: string
                  maxLength: 150
                message:
                  type: string
                  maxLength: 2000
                bidId:
                  type: string
                  description: Optional id of the offer the message is about.
      responses:
        "202":
          description: Message accepted and forwarded.
          content:
            application/json:
              schema:
                type: object
                required: [recu]
                properties:
                  recu:
                    type: boolean
        "422":
          description: Validation errors from the domain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /unsubscribe:
    get:
      operationId: unsubscribe
      summary: Record a CASL / Law-25 email opt-out.
      description: >-
        Opened from the unsubscribe link in every email footer. The `token`
        encodes the recipient's address (base64url); the opt-out is recorded
        (an `UNSUB#<email>` item) and the sender checks it before every future
        send. Returns a small fr-CA HTML confirmation page, not JSON, because it
        is opened in a browser. Idempotent — unsubscribing twice is a no-op.
      parameters:
        - name: token
          in: query
          required: true
          description: Base64url-encoded recipient email from the email footer link.
          schema:
            type: string
          example: Y2xpZW50QGV4YW1wbGUuY2E
      responses:
        "200":
          description: Opt-out recorded; a confirmation page is returned.
          content:
            text/html:
              schema:
                type: string
        "400":
          description: The token is missing or does not decode to a valid email.
          content:
            text/html:
              schema:
                type: string
    post:
      operationId: unsubscribeOneClick
      summary: One-click email opt-out (RFC 8058).
      description: >-
        The target of the `List-Unsubscribe` / `List-Unsubscribe-Post` headers
        carried on every outbound email. Mailbox providers (Gmail, Yahoo) POST
        here with no user interaction; the opt-out is recorded exactly as with
        GET. Idempotent.
      parameters:
        - name: token
          in: query
          required: true
          description: Base64url-encoded recipient email from the email headers.
          schema:
            type: string
          example: Y2xpZW50QGV4YW1wbGUuY2E
      responses:
        "200":
          description: Opt-out recorded.
          content:
            text/html:
              schema:
                type: string
        "400":
          description: The token is missing or does not decode to a valid email.
          content:
            text/html:
              schema:
                type: string
components:
  securitySchemes:
    notarySession:
      type: http
      scheme: bearer
      description: Notary SESSION token from POST /notary/session/verify.
    clientToken:
      type: http
      scheme: bearer
      description: Per-bid CLIENT token returned once by POST /bids (`sub` = bid id).
  responses:
    Unauthorized:
      description: Missing, invalid, expired or wrong-scope token (`non_autorise`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The client token belongs to another bid (`interdit`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Unknown bid (`introuvable`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AlreadyRetained:
      description: The bid is already retained (`deja_retenue`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    PropositionStatus:
      type: string
      description: >-
        Lifecycle of a notary's proposition. `remplacee` = superseded by a newer
        proposition from the same notary (hidden from the client).
      enum: [en_attente, acceptee, refusee, remplacee]
    RequestedItem:
      type: object
      required: [id, nom, kind]
      properties:
        id:
          type: string
        nom:
          type: string
          description: The label the client saw in the dossier (fr-CA).
        kind:
          type: string
          enum: [document, champ]
    NotaryProposition:
      type: object
      description: A proposition as seen by the notary who made it.
      required: [id, montant, delta, status, createdAt]
      properties:
        id:
          type: string
        montant:
          type: integer
        delta:
          type: integer
          description: montant minus the client's offer at proposal time.
        message:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/PropositionStatus"
        createdAt:
          type: string
          format: date
    ClientProposition:
      type: object
      description: A proposition as seen by the client — the étude, never the notaryId.
      required: [id, etude, montant, delta, status, createdAt]
      properties:
        id:
          type: string
        etude:
          type: [string, "null"]
        montant:
          type: integer
        delta:
          type: integer
        message:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/PropositionStatus"
        createdAt:
          type: string
          format: date
        rating:
          $ref: "#/components/schemas/NotaryRating"
        cnq:
          type: boolean
          description: >-
            True when the proposing notary has attached their official fiche
            in the Chambre des notaires directory (ADR 0016). A boolean only —
            the fiche URL never rides an open bid (it lists the notary's
            phone; contact flows only after retention).
    NotaryDemande:
      type: object
      required: [id, documents, createdAt, fournie]
      properties:
        id:
          type: string
        documents:
          type: array
          items:
            $ref: "#/components/schemas/RequestedItem"
        message:
          type: [string, "null"]
        createdAt:
          type: string
          format: date
        fournie:
          type: boolean
          description: True once every requested id is present in the client's dossier.
    ClientDemande:
      type: object
      required: [id, etude, documents, createdAt, fournie]
      properties:
        id:
          type: string
        etude:
          type: [string, "null"]
        documents:
          type: array
          items:
            $ref: "#/components/schemas/RequestedItem"
        message:
          type: [string, "null"]
        createdAt:
          type: string
          format: date
        fournie:
          type: boolean
    Readiness:
      type: object
      description: >-
        Domain `leadReadiness` of the dossier. Since ADR 0010 ("price before
        documents"), `ready` gates on the REQUIRED pricing answers plus
        consent; the document checklist (`total`/`done`/`missing`) is reported
        as preparation progress, never a barrier. A dossier item whose value is
        `transmis_autrement` counts as provided (sent through the notary's own
        channel).
      required: [total, done, missing, requis, consent, ready]
      properties:
        total:
          type: integer
        done:
          type: integer
        missing:
          type: array
          items:
            type: string
          description: Names of the documents/fields still missing (progress, not a gate).
        requis:
          type: array
          items:
            type: string
          description: Labels of the unanswered REQUIRED pricing questions — the only content gate.
        consent:
          type: boolean
        ready:
          type: boolean
          description: True once every required pricing answer is in and consent is given.
    PropositionAnswerInput:
      type: object
      required: [id, dateISO, propositionId]
      properties:
        id:
          type: string
        dateISO:
          type: string
          format: date
        propositionId:
          type: string
    LenderInfo:
      type: object
      description: >-
        The lender behind a bid (from the domain's LENDERS catalogue), shown to
        notaries so they can decide before retaining — a notary only closes
        with the institutions they normally work with. `virtuel` flags a
        branchless lender (remote instructions, extra coordination). For an
        « Autre prêteur » answer, `nom` is the lender name the client typed
        (the id stays `autre`). Null on bids that predate the lender question.
      required: [id, nom, virtuel]
      properties:
        id:
          type: string
        nom:
          type: string
        virtuel:
          type: boolean
    DeplacementInfo:
      type: object
      description: >-
        The déplacement band behind a bid (from the domain's DEPLACEMENTS
        catalogue, ADR 0017): who moves for the in-person signature — the
        client to the étude, the notary to the client — how far, and whether
        the client declared a 100 %-online urgency. Shown to notaries before
        they retain, propose, or pass. Null on bids that predate the question.
      required: [id, nom, qui, km, urgence]
      properties:
        id:
          type: string
        nom:
          type: string
        qui:
          type: string
          enum: [client, notaire, en_ligne]
        km:
          type: integer
        urgence:
          type: boolean
    ChatMessage:
      type: object
      description: >-
        One message of the retained-act conversation (client <-> retaining
        notary). `de` names the sending role; the thread lives on the bid.
      required: [id, de, texte, createdAt]
      properties:
        id:
          type: string
        de:
          type: string
          enum: [client, notaire]
        texte:
          type: string
        createdAt:
          type: string
    NotaryBid:
      type: object
      description: Notary-facing projection of an open bid (never the dossier or courriel).
      required: [id, serviceId, dateISO, montant, tier, premium, ready, preteur, deplacement, proposition, demande, missing]
      properties:
        id:
          type: string
        serviceId:
          $ref: "#/components/schemas/ServiceId"
        dateISO:
          type: string
          format: date
        montant:
          type: integer
        tier:
          $ref: "#/components/schemas/Tier"
        premium:
          type: number
        prefixe:
          type: [string, "null"]
        ready:
          type: boolean
        preteur:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/LenderInfo"
        deplacement:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/DeplacementInfo"
        distanceKm:
          type: [integer, "null"]
          description: >-
            ≈ km between the bid's sector and the étude's (ADR 0025, FSA
            centroids); null when either sector is unknown.
        complexity:
          type: object
          additionalProperties: true
        proposition:
          description: This notary's latest non-superseded proposition, or null.
          oneOf:
            - type: "null"
            - type: object
              required: [id, montant, delta, status, createdAt]
              properties:
                id:
                  type: string
                montant:
                  type: integer
                delta:
                  type: integer
                status:
                  $ref: "#/components/schemas/PropositionStatus"
                createdAt:
                  type: string
                  format: date
        demande:
          description: This notary's latest document request, or null.
          oneOf:
            - type: "null"
            - type: object
              required: [id, documents, createdAt, fournie]
              properties:
                id:
                  type: string
                documents:
                  type: array
                  items:
                    $ref: "#/components/schemas/RequestedItem"
                createdAt:
                  type: string
                  format: date
                fournie:
                  type: boolean
        missing:
          type: array
          items:
            type: string
    ClientContact:
      type: object
      description: >-
        The client half of the mise en relation (ADR 0010 §4), released ONLY to
        the notary who retained the bid. `nom` is present even when the public
        bid was anonymous — anonymity is a carnet promise, not a blackout on
        the person the notary is meeting.
      required: [nom, courriel, telephone]
      properties:
        nom:
          type: [string, "null"]
        courriel:
          type: [string, "null"]
        telephone:
          type: [string, "null"]
          description: As typed by the client (trimmed); use domain telHref() for a dial string.
    RetainedBid:
      type: object
      description: A bid retained by the requesting notary (the dossier is theirs to see).
      required: [id, dateISO, serviceId, montant, tier, client, viaProposition]
      properties:
        id:
          type: string
        dateISO:
          type: string
          format: date
        serviceId:
          $ref: "#/components/schemas/ServiceId"
        montant:
          type: integer
        tier:
          $ref: "#/components/schemas/Tier"
        prefixe:
          type: [string, "null"]
        courriel:
          type: [string, "null"]
        dossier:
          type: [object, "null"]
          additionalProperties: true
        client:
          $ref: "#/components/schemas/ClientContact"
        preteur:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/LenderInfo"
        deplacement:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/DeplacementInfo"
        distanceKm:
          type: [integer, "null"]
          description: >-
            ≈ km between the bid's sector and the étude's (ADR 0025, FSA
            centroids); null when either sector is unknown.
        messages:
          type: array
          description: The live thread with the client (see /notary/bids/message).
          items:
            $ref: "#/components/schemas/ChatMessage"
        viaProposition:
          type: boolean
          description: True when retention came from the client accepting this notary's proposition.
        completed:
          type: boolean
          description: >-
            True once the write-once act ledger holds this act's settlement —
            the console renders « Acte complété » in ANY session and never
            re-offers the settlement button.
        actAmount:
          type: [integer, "null"]
          description: The value the act settled at (null until completed).
        commissionCents:
          type: [integer, "null"]
          description: Nota's commission on the settled act (null until completed).
    AcceptedBid:
      type: object
      description: >-
        What POST /notary/bids/accept hands the retaining notary: the released
        dossier plus the mise en relation `client` contact block (ADR 0010 §4).
        The payout fields are present only with billing configured and an
        authorized card.
      required: [id, courriel, dossier, client]
      properties:
        id:
          type: string
        courriel:
          type: [string, "null"]
          description: The client's private email, released on retention (also inside `client`).
        dossier:
          type: [object, "null"]
          additionalProperties: true
        client:
          $ref: "#/components/schemas/ClientContact"
        paid:
          type: boolean
          description: Present with billing on — true when the pay-on-accept capture succeeded.
        commissionCents:
          type: integer
          description: Nota's commission on the captured act, in cents (present when `paid` is true).
        netCents:
          type: integer
          description: The amount transferred to the notary, in cents (present when `paid` is true).
        paymentError:
          type: string
          description: A machine-readable capture-failure code (present when `paid` is false).
    Tier:
      type: string
      description: Timing tier derived from days-to-date (ascending urgency).
      enum: [standard, rapide, prioritaire, urgence, extreme]
    Status:
      type: string
      description: Lifecycle of a bid. `annulee` = withdrawn by the client.
      enum: [ouverte, retenue, annulee]
    ServiceId:
      type: string
      description: >-
        The catalogue is the financing family — `refinancement` and
        `financement` (ADR 0010: testament and procuration were retired;
        historical bids for retired acts are filtered out rather than served).
      enum: [refinancement, financement]
    PartnerRegistration:
      type: object
      required: [partenaire]
      properties:
        partenaire:
          type: object
          required: [code, type, courriel]
          properties:
            code:
              type: string
              description: The NORMALIZED code (uppercased, separators dropped).
              example: EVEROY
            type:
              type: string
              enum: [agent_immobilier, courtier_hypothecaire, autre_professionnel]
            courriel:
              type: string
              format: email
            createdAt:
              type: string
              format: date
            confirmedAt:
              type: string
              format: date
              description: >-
                The date the code's email was verified (ADR 0011). Only a
                confirmed partner is a payee of record.
    ConnectInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: The notary's email; used as the Stripe customer email.
          example: notaire@example.ca
        parrain:
          type: string
          writeOnly: true
          description: >-
            OPTIONAL, PRIVATE (write-only). Partner referral code from a
            `?ref=CODE` link or typed by hand (ADR 0011), same rules as on
            POST /bids: normalized server-side, stored on the notary record
            only when valid, silently dropped otherwise — a broken referral
            link must never fail a signup. A SELF-REFERRAL (the code's
            registered partner signing up with their own email) is likewise
            silently dropped. Never exposed in any notary-facing or public
            payload; a referred notary earns their partner the flat notary
            reward once, when they retain their first act. Surfaces only,
            aggregated, in the admin referral ledger.
          example: EVEROY
    OfferInput:
      type: object
      required: [serviceId, dateISO, montant, prefixe]
      properties:
        serviceId:
          $ref: "#/components/schemas/ServiceId"
        dateISO:
          type: string
          format: date
          description: Requested signing date, ISO YYYY-MM-DD (must not be in the past).
          example: "2026-08-20"
        montant:
          type: integer
          minimum: 1
          description: >-
            Offer in whole Canadian dollars. Must be >= the offer's dynamic
            floor (the service base plus the pricing-criteria adds; 2 000 $ for
            an uncomplicated refinancement) and <= 3× that floor (the premium
            cap).
          example: 2400
        anonyme:
          type: boolean
          default: true
          description: When true (default), the bid is published without a name.
        nom:
          type: string
          maxLength: 120
          description: Display name; stored only when anonyme is false.
        prefixe:
          type: string
          minLength: 3
          maxLength: 3
          pattern: "^[A-Za-z][0-9][A-Za-z]$"
          description: >-
            REQUIRED postal sector (the FSA — first 3 characters of the
            client's postal code, e.g. "G1R"). The bid's only location signal:
            it anchors the declared déplacement band to a real sector so a
            notary's travel radius means something. Normalized to uppercase
            server-side; missing → 422 `prefixe_requis`, malformed → 422
            `prefixe_invalide`.
        courriel:
          type: string
          format: email
          maxLength: 254
          description: >-
            OPTIONAL. Private client email used only for notifications (offer
            published, date approaching, offer retained). Stored server-side and
            NEVER returned in the public Bid projection. Empty/absent is allowed;
            a non-empty value must be a valid email or the offer is rejected with
            `courriel_invalide`.
          example: client@example.ca
        telephone:
          type: string
          writeOnly: true
          description: >-
            OPTIONAL, PRIVATE (write-only). The client's phone for the mise en
            relation (ADR 0010 §4): released ONLY to the notary who retains the
            bid, alongside the dossier — never in the public Bid projection,
            never to a notary browsing open bids, never echoed back. Loose
            validation: after stripping formatting, 10–11 digits are required
            (else 422 `telephone_invalide`); the value is stored as typed,
            trimmed.
          example: "418 555-1234"
        parrain:
          type: string
          writeOnly: true
          description: >-
            OPTIONAL, PRIVATE (write-only). Partner referral code from a
            `?ref=CODE` link or typed by hand in the booking form (ADR 0011)
            — 4–12 letters/digits, case-insensitive, separators ignored.
            Normalized and stored on the bid only when valid; an INVALID code
            is silently dropped (a broken referral link must never fail a
            booking), and a SELF-REFERRAL (the code's registered partner
            booking with their own email) is likewise dropped. Never present in any
            response: not on the public carnet, not in notary projections, not
            echoed on POST /bids or GET /client/bid. It only ever surfaces,
            aggregated, in the admin referral ledger.
          example: EVEROY
    Bid:
      type: object
      description: Public projection of a bid. Private dossier data is never included.
      required: [id, serviceId, dateISO, montant, tier, premium, status, anonyme]
      properties:
        id:
          type: string
        serviceId:
          $ref: "#/components/schemas/ServiceId"
        dateISO:
          type: string
          format: date
        montant:
          type: integer
        tier:
          $ref: "#/components/schemas/Tier"
        premium:
          type: number
          description: montant / prix de départ (>= 1.0, <= 10.0).
        status:
          $ref: "#/components/schemas/Status"
        etude:
          type: [string, "null"]
          description: Retaining notary's practice, present only when status is retenue.
        anonyme:
          type: boolean
        nom:
          type: [string, "null"]
          description: Always null when anonyme is true.
        prefixe:
          type: [string, "null"]
        createdAt:
          type: string
          format: date
        annulation:
          type: [object, "null"]
          description: >-
            What a cancellation actually kept (ADR 0023) — only on a cancelled
            bid whose late withdrawal carried a fee, null everywhere else.
          properties:
            taux:
              type: number
              description: Share of the retained montant kept (e.g. 0.3).
            frais:
              type: number
              description: Fee kept, in dollars.
            joursAvant:
              type: integer
              description: Civil days left before the signing at cancel time.
            chargeId:
              type: [string, "null"]
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          enum:
            - service_inconnu
            - montant_invalide
            - date_invalide
            - date_passee
            - sous_prix_depart
            - plafond_depasse
            - mois_invalide
            - json_invalide
            - courriel_invalide
            - signature_invalide
            - introuvable
            - non_autorise
            - interdit
            - deja_retenue
            - offre_non_ouverte
            - proposition_inferieure
            - message_trop_long
            - documents_requis
            - document_inconnu
            - proposition_introuvable
            - proposition_close
            - dossier_invalide
            - parametre_requis
            - telephone_invalide
            - type_inconnu
            - code_invalide
            - code_deja_pris
            - lien_invalide
            - compte_requis
            - message_requis
            - offre_annulee
            - corps_trop_grand
            - id_manquant
            - acte_non_autorise
            - offre_non_retenue
            - expediteur_invalide
        message:
          type: string
          description: Human-readable message (fr-CA).
    NotaryRating:
      type: [object, "null"]
      description: >-
        Public evaluation average of a notary — null before the first
        evaluation (never zero stars). `note` is the one-decimal mean.
      properties:
        note:
          type: number
          minimum: 1
          maximum: 5
        avis:
          type: integer
          minimum: 1
    NotaryProfil:
      type: object
      description: >-
        The notary's own profile, as the console edits it: the CNQ fiche link
        (ADR 0016) plus the declared travel radius and online-urgency opt-in
        (ADR 0017) that gate which demandes the feed offers.
      required: [lienCNQ, rayonKm, urgences]
      properties:
        lienCNQ:
          type: [string, "null"]
          description: Official fiche URL on cnq.org, null when none is attached.
        rayonKm:
          type: integer
          enum: [0, 25, 50]
          default: 0
          description: >-
            Declared travel radius in km (NOTARY_RADII). 0 — the default — a
            notary who said nothing travels nowhere.
        urgences:
          type: boolean
          default: false
          description: True when the notary opted into 100 %-online urgency acts.
        prefixe:
          type: [string, "null"]
          description: >-
            The étude's postal sector (FSA, ADR 0025), null when none is
            declared — the feed then keeps the declarative travel rules.
    NotaryCommission:
      type: [object, "null"]
      description: >-
        The commission this notary earns today (ADR 0016): the configured base
        rate, the effective rate after the best rating-earned bonus, and the
        next reachable tier (null at the top). Null when billing is not
        configured — never a fake rate.
      properties:
        taux:
          type: number
          description: Base commission rate (NOTA_COMMISSION_RATE).
        tauxEffectif:
          type: number
          description: Rate actually charged, after the rating-earned bonus, floored.
        bonus:
          type: number
          description: The reduction earned (taux − tauxEffectif).
        prochain:
          type: [object, "null"]
          description: The least-demanding tier that would still lower the rate.
          properties:
            note:
              type: number
            avis:
              type: integer
            tauxEffectif:
              type: number
    EvaluationResponse:
      type: object
      required: [evaluation]
      properties:
        evaluation:
          type: object
          required: [note]
          properties:
            note:
              type: integer
              minimum: 1
              maximum: 5
            commentaire:
              type: [string, "null"]
    ErrorResponse:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/Error"

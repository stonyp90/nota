openapi: 3.1.0
info:
  title: Nota API
  version: 0.1.0
  description: >-
    HTTP API for the Nota marketplace: the public carnet of notarial-act bids for
    Quebec City. Every offer is revalidated server-side through @nota/domain; the
    client's tier, premium and total are never trusted, and a bid marked
    `anonyme` never leaks its `nom`.


    NOTE: this specification is kept in sync with `apps/api/src/handler.js` **by
    hand** for now. When a route or field changes there, update it here in the
    same change (see AGENTS.md).
  license:
    name: UNLICENSED
servers:
  - url: /api
    description: Same-origin path fronted by CloudFront (production).
  - url: http://localhost:8788
    description: Local dev server (apps/api/local-server.js).
# Public intake and sign-in requests accept the standard Accept-Language header.
# Supported languages: fr and en, honoring quality weights; unsupported -> fr.
# New recipients retain this language for notifications. Anonymous requests never
# overwrite a saved preference; verified sign-in and preference updates can.
paths:
  /signing-beta/capabilities:
    get:
      summary: Read signing rehearsal capabilities; never CNQ approval or a legal signature
      operationId: signingBetaCapabilities
      responses:
        '200':
          description: Explicit rehearsal capability flags; enabled is false unless configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningBetaCapabilities'
  /signing-beta/sessions:
    get:
      summary: Poll the current retained-bid rehearsal using a recently email-verified bearer token
      operationId: signingBetaRead
      security: [{ notarySession: [] }, { clientToken: [] }]
      parameters:
        - { name: bidId, in: query, required: true, schema: { type: string } }
        - { name: dateISO, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Current session, own role, peer-only SDP, own one-use proof challenge and admitted TURN credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SigningBetaResponse' }
        default: { $ref: '#/components/responses/SigningBetaError' }
    post:
      summary: Notary creates a thirty-minute test-document rehearsal for a retained bid
      operationId: signingBetaCreate
      security: [{ notarySession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/SigningBetaCommand' }
                - { required: [publicKeyJwk] }
      responses:
        '201':
          description: Immutable test document and empty two-person room created; existing active room conflicts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SigningBetaResponse' }
        default: { $ref: '#/components/responses/SigningBetaError' }
  /signing-beta/sessions/{sessionId}/commands:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    post:
      summary: Join, admit, review, release, pause, acknowledge or close a rehearsal
      description: >-
        Bearer token must have a signed mailbox verifiedAt within sixty minutes.
        Every action requires current revision. The notary admits, reviews and releases;
        review requires observationConfirmed=true. Both roles must report connected media
        within twenty-five seconds before review, release or acknowledgment. Client acknowledgment
        precedes notary acknowledgment. The signature covers exact UTF-8 challenge.message,
        ECDSA P-256 SHA-256, encoded as base64url IEEE P1363. No official signature or billing follows.
      operationId: signingBetaCommand
      security: [{ notarySession: [] }, { clientToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/SigningBetaCommand' }
                - { required: [revision, action] }
      responses:
        '200':
          description: Authoritative session after a conditional update.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SigningBetaResponse' }
        default: { $ref: '#/components/responses/SigningBetaError' }
  /signing-beta/sessions/{sessionId}/signal:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    post:
      summary: Submit one signed, fully gathered SDP offer or answer after admission
      description: >-
        Notary sends offer; client sends answer. Requires current revision, a SHA-256 DTLS
        fingerprint and at most 24000 SDP bytes. Signature is ECDSA P-256 SHA-256 over
        NOTA-SIGNAL-V1, sessionId, role, type and lowercase SHA-256 hex of exact SDP,
        joined by newline. Only latest signals are stored outside bid records; no trickle ICE.
      operationId: signingBetaSignal
      security: [{ notarySession: [] }, { clientToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/SigningBetaCommand' }
                - { required: [revision, type, sdp, signature] }
      responses:
        '200':
          description: Latest signal saved conditionally; peer retrieves through session polling.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SigningBetaResponse' }
        default: { $ref: '#/components/responses/SigningBetaError' }
  /signing-beta/sessions/{sessionId}/heartbeat:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    post:
      summary: Authenticated endpoint reports media connection state every eight seconds
      description: >-
        Body connected is browser telemetry, not independent proof of identity or observation.
        A false report during reviewed/released stages pauses and revokes unconsumed challenges.
        Conditional writes retry contention; revision is not required for a heartbeat.
      operationId: signingBetaHeartbeat
      security: [{ notarySession: [] }, { clientToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/SigningBetaCommand' }
                - { required: [connected] }
      responses:
        '200':
          description: Updated presence and session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SigningBetaResponse' }
        default: { $ref: '#/components/responses/SigningBetaError' }
  /signing-beta/sessions/{sessionId}/evidence:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    get:
      summary: Download independently verifiable test-document acknowledgments
      description: >-
        Same recent bearer authentication and retained ownership as the room. Excludes
        SDP, TURN credentials, tokens and media telemetry. Available while bounded rehearsal
        record remains; this is neither archival custody nor a certified notarial copy.
      operationId: signingBetaEvidence
      security: [{ notarySession: [] }, { clientToken: [] }]
      parameters:
        - { name: bidId, in: query, required: true, schema: { type: string } }
        - { name: dateISO, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Attachment containing test text/digest, participant public keys, proof messages/signatures and events.
          content:
            application/json:
              schema:
                type: object
                required: [format, legalSignatureAvailable, sessionId, document, acknowledgments, verification]
                properties:
                  format: { type: string, const: nota-rehearsal-evidence-v1 }
                  legalSignatureAvailable: { type: boolean, const: false }
                  sessionId: { type: string }
                  document: { type: object }
                  acknowledgments: { type: array, items: { type: object } }
                  verification: { type: object }
        default: { $ref: '#/components/responses/SigningBetaError' }
  /notary/financing/preparation:
    get:
      summary: Read the current private financing analysis, review and customer-context work packet.
      description: >-
        The work packet is rebuilt from the server's current private dossier and
        pricing answers. It is available only after the Nota payment ledger is
        positive; retention or an unpaid completion is not sufficient. It never
        calls a provider on read. Its drafts are unsent; source labels do not imply legal approval.
      security: [{ notarySession: [] }]
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
        - { name: dateISO, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Restricted to the retaining notary after Nota payment; no legal approval is implied.
          content:
            application/json:
              schema:
                type: object
                required: [analysis, workPacket]
                properties:
                  analysis:
                    anyOf:
                      - { $ref: '#/components/schemas/FinancingAIAnalysis' }
                      - { type: 'null' }
                  workPacket: { $ref: '#/components/schemas/FinancingWorkPacketResult' }
        '402':
          $ref: '#/components/responses/NotaPaymentRequired'
        default: { $ref: '#/components/responses/FinancingAIError' }
    post:
      summary: Extract page-evidenced proposals from notary-supplied text.
      description: >-
        Requires a session for the retaining notary, a retained non-erased file,
        NOTA_FINANCING_AI_ENABLED=true, provider configuration and explicit processing
        authorization. No OCR, deed execution, lender connection or training occurs.
        Service comes from the server's bid. Maximum 8 pages, 8000 characters per
        page, 36000 total characters, and the existing 64 KiB HTTP body limit.
        Six newly admitted attempts per notary per hour and a shared UTC-day cap
        (NOTA_FINANCING_AI_MAX_CALLS_PER_DAY, default 100); unavailable counters fail closed.
        Matching validated source text and generation configuration reuse the same
        retaining notary's saved analysis and review without another provider call.
        Concurrent identical requests in one API worker share a generation; this is
        not a distributed exactly-once guarantee. Changed inputs replace the current
        analysis using an optimistic analysis-ID check. Each response rebuilds the
        work packet from the current authorized server file.
        401 unauthorized; 402 Nota payment required; 403 wrong owner; 404 missing; 409 ownership/version/state
        conflict; 413 body limit; 422 input/authorization; 429 rate limit;
        502 unsupported provider output; 503 disabled/provider/counter failure.
      security: [{ notarySession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO, pages, processingAuthorized]
              properties:
                id: { type: string }
                dateISO: { type: string, format: date }
                processingAuthorized: { const: true }
                pages:
                  type: array
                  minItems: 1
                  maxItems: 8
                  items:
                    type: object
                    required: [documentId, page, text]
                    properties:
                      documentId: { type: string, pattern: '^[a-zA-Z0-9_-]{1,80}$' }
                      page: { type: integer, minimum: 1, maximum: 10000 }
                      text: { type: string, minLength: 1, maxLength: 8000 }
      responses:
        '200':
          description: Persisted proposed fields, never a verified deed or signing decision.
          content:
            application/json:
              schema:
                type: object
                required: [ok, analysis, workPacket, reused]
                properties:
                  ok: { const: true }
                  reused:
                    type: boolean
                    description: This request reused a saved analysis or joined an identical generation in this worker. Its analysis may contain an existing review.
                  analysis: { $ref: '#/components/schemas/FinancingAIAnalysis' }
                  workPacket: { $ref: '#/components/schemas/FinancingWorkPacketResult' }
        '402':
          $ref: '#/components/responses/NotaPaymentRequired'
        default: { $ref: '#/components/responses/FinancingAIError' }
  /notary/financing/review:
    post:
      summary: Record the retaining notary's explicit review of every proposed field.
      description: >-
        Requires a current analysis ID and exactly one decision per proposed field.
        Corrections and rejections require a reason. The server stamps reviewer and
        time; the review is immutable for that analysis. The paid Nota ledger is
        required before any generated work packet is read or changed. Review never
        authorizes training, legal execution or funds. 401 unauthorized; 402 Nota
        payment required; 403 wrong owner;
        404 missing; 409 changed/reviewed analysis or unavailable file; 422 invalid review.
      security: [{ notarySession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO, analysisId, decisions]
              properties:
                id: { type: string }
                dateISO: { type: string, format: date }
                analysisId: { type: string }
                activeReviewSeconds: { type: [integer, 'null'], minimum: 0, maximum: 86400 }
                decisions:
                  type: array
                  maxItems: 24
                  items:
                    type: object
                    required: [index, decision]
                    properties:
                      index: { type: integer, minimum: 0 }
                      decision: { enum: [accepted, corrected, rejected] }
                      value: { type: string, minLength: 1, maxLength: 1000 }
                      reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Reviewed values stay in the private file under its retention policy.
          content:
            application/json:
              schema:
                type: object
                required: [ok, review, workPacket]
                properties:
                  ok: { const: true }
                  review: { $ref: '#/components/schemas/FinancingAIReview' }
                  workPacket: { $ref: '#/components/schemas/FinancingWorkPacketResult' }
        '402':
          $ref: '#/components/responses/NotaPaymentRequired'
        default: { $ref: '#/components/responses/FinancingAIError' }
  /notary/acts/preparation:
    get:
      summary: Read the private testament or procuration work packet and AI analysis.
      description: The packet is rebuilt from the server-side dossier only after the Nota payment ledger is positive, and never calls an AI provider on read.
      security: [{ notarySession: [] }]
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
        - { name: dateISO, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Restricted to the retaining notary after Nota payment.
          content:
            application/json:
              schema:
                type: object
                required: [analysis, workPacket]
                properties:
                  analysis: { anyOf: [{ $ref: '#/components/schemas/ActAIAnalysis' }, { type: 'null' }] }
                  workPacket: { $ref: '#/components/schemas/ActWorkPacketResult' }
        '402':
          $ref: '#/components/responses/NotaPaymentRequired'
        default: { $ref: '#/components/responses/FinancingAIError' }
    post:
      summary: Extract evidence-backed testament or procuration intake proposals.
      description: Requires Nota payment and explicit processing authorization. Proposals are private, bounded and require notary review; no legal conclusion or signing decision is produced.
      security: [{ notarySession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO, pages, processingAuthorized]
              properties:
                id: { type: string }
                dateISO: { type: string, format: date }
                processingAuthorized: { const: true }
                pages:
                  type: array
                  minItems: 1
                  maxItems: 8
                  items:
                    type: object
                    required: [documentId, page, text]
                    properties:
                      documentId: { type: string, pattern: '^[a-zA-Z0-9_-]{1,80}$' }
                      page: { type: integer, minimum: 1, maximum: 10000 }
                      text: { type: string, minLength: 1, maxLength: 8000 }
      responses:
        '200':
          description: Evidence-backed proposals persisted in the private act file.
          content:
            application/json:
              schema:
                type: object
                required: [ok, analysis, workPacket, reused]
                properties:
                  ok: { const: true }
                  reused: { type: boolean }
                  analysis: { $ref: '#/components/schemas/ActAIAnalysis' }
                  workPacket: { $ref: '#/components/schemas/ActWorkPacketResult' }
        '402':
          $ref: '#/components/responses/NotaPaymentRequired'
        default: { $ref: '#/components/responses/FinancingAIError' }
  /notary/acts/review:
    post:
      summary: Record the retaining notary's review of testament or procuration proposals.
      description: Exactly one decision is required for every proposal; corrections and rejections require a reason.
      security: [{ notarySession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO, analysisId, decisions]
              properties:
                id: { type: string }
                dateISO: { type: string, format: date }
                analysisId: { type: string }
                activeReviewSeconds: { type: [integer, 'null'], minimum: 0, maximum: 86400 }
                decisions:
                  type: array
                  maxItems: 24
                  items:
                    type: object
                    required: [index, decision]
                    properties:
                      index: { type: integer, minimum: 0 }
                      decision: { enum: [accepted, corrected, rejected] }
                      value: { type: string, minLength: 1, maxLength: 1000 }
                      reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Immutable notary review saved in the private file.
          content:
            application/json:
              schema:
                type: object
                required: [ok, review, workPacket]
                properties:
                  ok: { const: true }
                  review: { $ref: '#/components/schemas/FinancingAIReview' }
                  workPacket: { $ref: '#/components/schemas/ActWorkPacketResult' }
        '402':
          $ref: '#/components/responses/NotaPaymentRequired'
        default: { $ref: '#/components/responses/FinancingAIError' }
  /notary/ai-access:
    get:
      summary: Read the notary's AI beta and subscription entitlement
      description: Returns the usage ledger and published monthly plans. The normal dossier remains available regardless of this entitlement.
      security: [{ notarySession: [] }]
      responses:
        '200':
          description: Current AI access and plans.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, reason, beta, subscription, paidUses, plans, maxPieceQuantity]
                properties:
                  enabled: { type: boolean }
                  reason: { type: string }
                  beta: { type: object, additionalProperties: true }
                  subscription: { type: object, additionalProperties: true }
                  paidUses: { type: integer, minimum: 0 }
                  plans: { type: array, items: { type: object, additionalProperties: true } }
                  maxPieceQuantity: { type: integer, minimum: 1 }
        default: { $ref: '#/components/responses/FinancingAIError' }
  /notary/ai-beta/enroll:
    post:
      summary: Opt the notary into the one-time AI beta
      security: [{ notarySession: [] }]
      responses:
        '200':
          description: Beta activated idempotently.
          content:
            application/json:
              schema:
                type: object
                required: [ok, access]
                properties:
                  ok: { const: true }
                  access: { type: object, additionalProperties: true }
        default: { $ref: '#/components/responses/FinancingAIError' }
  /notary/ai/checkout:
    post:
      summary: Start a hosted Stripe checkout for an AI plan or units
      security: [{ notarySession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, planId]
              properties:
                kind: { type: string, enum: [subscription, usage] }
                planId: { type: string, enum: [essentiel, cabinet, equipe] }
                quantity: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Hosted Checkout URL.
          content:
            application/json:
              schema:
                type: object
                required: [ok, url, sessionId]
                properties:
                  ok: { const: true }
                  url: { type: string, format: uri }
                  sessionId: { type: string }
        default: { $ref: '#/components/responses/FinancingAIError' }
  /notary/ai-feedback:
    post:
      summary: Record structured notary feedback on an AI uncertainty
      description: The question is derived from the server-validated analysis. Feedback is appended as a minimized learning signal and never authorizes a legal or signing decision.
      security: [{ notarySession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO, questionId, decision]
              properties:
                id: { type: string }
                dateISO: { type: string, format: date }
                questionId: { type: string, pattern: '^(missing|conflict):[a-zA-Z0-9_-]{1,80}$' }
                decision: { type: string, enum: [confirmed, resolved, not_applicable, escalated] }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Structured feedback recorded in the learning signal stream.
          content:
            application/json:
              schema:
                type: object
                required: [ok, feedback, recorded]
                properties:
                  ok: { const: true }
                  feedback: { type: object, additionalProperties: true }
                  recorded: { type: boolean }
        default: { $ref: '#/components/responses/FinancingAIError' }
  /auth/oauth/providers:
    get:
      summary: List Google, Microsoft and LinkedIn sign-in availability
      description: Configuration flags only; no credentials. Disabled providers must not start authorization.
      responses:
        '200':
          description: Provider availability; always no-store
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      required: [id, configured]
                      properties:
                        id: { type: string, enum: [google, microsoft, linkedin] }
                        configured: { type: boolean }
  /auth/oauth/{provider}/start:
    post:
      summary: Start account sign-in using a registered OIDC provider
      description: >-
        Requires same-origin JSON. Sets an HttpOnly, Secure (HTTPS), SameSite=Lax
        browser-binding cookie scoped to /api/auth/oauth. Requests only openid,
        profile and email; no calendar scope or offline access. Google and
        Microsoft use PKCE S256; LinkedIn uses its confidential-client code flow.
        State and nonce are single-use and expire after ten minutes.
      parameters:
        - &oauthProvider
          in: path
          name: provider
          required: true
          schema: { type: string, enum: [google, microsoft, linkedin] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [client, notary] }
      responses:
        '200':
          description: Authorization URL and browser-binding Set-Cookie; no-store
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        '400': { description: "Invalid role" }
        '403': { description: "Cross-origin request rejected" }
        '415': { description: "JSON required" }
        '429': { description: "Rate limited" }
        '503': { description: "Provider unconfigured or unavailable" }
  /auth/oauth/{provider}/callback:
    get:
      summary: Consume the provider code and validate its ID token
      description: >-
        Requires the browser-binding cookie and single-use state. Checks RS256
        signature, issuer, audience, authorized party, expiry, nonce and subject.
        Microsoft tenant and signing-key issuers must match. Provider access/ID
        tokens are neither persisted nor returned. Redirects to /#oauth= with a
        short-lived browser-bound completion ticket, or /#oautherror= with a
        sanitized error code. Provider error descriptions are never reflected.
      parameters:
        - *oauthProvider
        - { in: query, name: code, schema: { type: string } }
        - { in: query, name: state, schema: { type: string } }
        - { in: query, name: error, schema: { type: string } }
        - { in: query, name: iss, schema: { type: string } }
      responses:
        '303': { description: "Same-origin fragment redirect; no-store and no-referrer" }
        '429': { description: "Rate limited" }
  /auth/oauth/complete:
    post:
      summary: Complete sign-in or request first-time mailbox proof
      description: >-
        Same-origin JSON and matching browser cookie required. Consumes the ticket
        once. An already linked provider subject opens its saved Nota identity,
        ignoring mutable provider email claims. An unlinked subject receives
        linkRequired and a single-use link-request ticket. No account lookup is
        made using the provider email claim. Notary approval is checked again
        before issuing any session. Client sessions return per-bid tokens only.
      requestBody: &oauthTicketBody
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket]
              properties:
                ticket: { type: string, minLength: 43, maxLength: 43 }
      responses: &oauthSessionResponses
        '200':
          description: >-
            Either {linkRequired:true,ticket,role}, or the existing client session
            verification response {ok,courriel,offres,role}, or the existing
            notary session response {token,feedToken,email,expiresAt,role}.
            Successful session responses clear the OAuth cookie. Always no-store.
        '400': { description: "Invalid, expired, replayed or browser-mismatched ticket" }
        '403': { description: "Origin rejected or notary account not approved" }
        '415': { description: "JSON required" }
        '429': { description: "Rate limited" }
        '503': { description: "Authentication unavailable" }
  /auth/oauth/link/request:
    post:
      summary: Email a one-time confirmation to link a Nota identity
      description: >-
        Same-origin JSON and matching browser cookie required. Consumes a
        link-request ticket. Sends the chosen mailbox an explicit account-linking
        confirmation with /#oauthverify=. The link must be opened in the same
        browser within ten minutes. Verification tickets are never echoed,
        including in development. Delivery failures return 503.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket, email]
              properties:
                ticket: { type: string, minLength: 43, maxLength: 43 }
                email: { type: string, format: email }
      responses:
        '200': { description: "Confirmation accepted for email delivery; {ok:true}" }
        '400': { description: "Invalid email or ticket" }
        '403': { description: "Origin rejected" }
        '415': { description: "JSON required" }
        '429': { description: "Rate limited" }
        '503': { description: "Email or authentication unavailable" }
  /auth/oauth/link/verify:
    post:
      summary: Confirm mailbox ownership, link provider subject, and open Nota
      description: >-
        Consumes the emailed ticket with the same browser cookie. Atomically
        creates an immutable provider-subject-to-email link, scoped to the OAuth
        client ID and issuer; conflicting links are rejected. Reuses existing
        client/notary session verification and notary approval checks. No provider
        token or mutable email claim grants access to an existing account.
      requestBody: *oauthTicketBody
      responses: *oauthSessionResponses
  /notary/calendar/outlook:
    get:
      summary: Read the authenticated notary's Outlook connection status
      security:
        - notarySession: []
      responses:
        '200':
          description: Configuration and connection state; never credentials
        '401':
          description: Missing or invalid notary session
        '503':
          description: Calendar storage unavailable
    delete:
      summary: Disconnect Outlook and invalidate pending authorization
      security:
        - notarySession: []
      responses:
        '200':
          description: Stored credentials removed
        '401':
          description: Missing or invalid notary session
        '409':
          description: Concurrent connection change; retry
        '503':
          description: Calendar service unavailable or unconfigured
  /notary/calendar/outlook/connect:
    post:
      summary: Begin browser-bound Outlook authorization with PKCE
      security:
        - notarySession: []
      responses:
        '200':
          description: Microsoft authorization URL and secure HttpOnly binding cookie
        '401':
          description: Missing or invalid notary session
        '409':
          description: Concurrent connection change; retry
        '503':
          description: Calendar service unavailable or unconfigured
  /calendar/outlook/callback:
    get:
      summary: Consume single-use Outlook authorization state and store encrypted credentials
      parameters:
        - in: query
          name: state
          required: true
          schema:
            type: string
        - in: query
          name: code
          schema:
            type: string
        - in: query
          name: error
          schema:
            type: string
      responses:
        '303':
          description: Connection saved; redirect to the notary console
        '400':
          description: Invalid, expired, replayed or browser-mismatched state, or denied consent
        '409':
          description: Connection changed during authorization
        '503':
          description: Missing configuration, permission or unavailable provider
  /notary/feed.ics:
    get:
      summary: Subscribe to the authenticated notary's retained signings
      description: >-
        Read-only ICS export, not bidirectional Google/Outlook synchronization.
        Every event is checked against the current bid ownership and retained
        status using a strongly consistent read. Stale, missing, cancelled and
        reassigned records are omitted. A storage outage returns 503 rather
        than a successful empty calendar. External client refresh intervals apply.
        When the public site URL is configured, URL and DESCRIPTION link directly
        to the corresponding file in Nota; notary authentication is required.
      parameters:
        - in: query
          name: token
          required: true
          description: FEED-scoped token from session verification; SESSION tokens are rejected.
          schema: { type: string }
      responses:
        '200':
          description: Read-only bilingual iCalendar subscription; no email addresses or document contents.
          content:
            text/calendar:
              schema: { type: string }
        '401':
          description: Invalid, expired or incorrectly scoped token.
        '503':
          description: Calendar temporarily unavailable; retry without clearing locally cached events.
          headers:
            Retry-After:
              schema: { type: string }
              description: Suggested retry delay in seconds.
  /carnet/feed.ics:
    get:
      summary: Subscribe to the public carnet
      description: >-
        Read-only bilingual ICS export of live, non-cancelled offers in the
        forward calendar window. Contains only the public projection and does
        not accept changes made in external calendar applications.
        When the public site URL is configured, URL and bilingual DESCRIPTION
        link directly to each request in the notary console. Retaining requires
        notary authentication and explicit confirmation in Nota.
      responses:
        '200':
          description: Public iCalendar subscription.
          content:
            text/calendar:
              schema: { type: string }
  /notification-preferences:
    parameters:
      - in: query
        name: id
        schema: { type: string }
        description: Bid ID when authenticating with a client token
      - in: query
        name: dateISO
        schema: { type: string, format: date }
        description: Bid date when authenticating with a client token
    get:
      summary: Read email preferences and the notification catalog
      description: Accepts a signed email preference token, an authenticated notary session, or a client token with its matching id and dateISO. Grants no dossier access.
      security:
        - notificationPreferenceToken: []
      responses:
        '200':
          description: Notification catalog and boolean preferences keyed by template name
          content:
            application/json:
              schema:
                type: object
                properties:
                  catalog:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        labelFr: { type: string }
                        labelEn: { type: string }
                        required: { type: boolean }
                  emailLanguage: { type: string, enum: [fr, en], nullable: true }
                  preferences:
                    type: object
                    additionalProperties: { type: boolean }
        '401': { description: Invalid signed identity }
    post:
      summary: Update the recipient's email language or per-template preferences
      description: Omitted fields are preserved. Language updates require a verified identity. Does not reverse a global marketing unsubscribe. Login messages cannot be disabled.
      security:
        - notificationPreferenceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              anyOf:
                - required: [preferences]
                - required: [emailLanguage]
              properties:
                emailLanguage: { type: string, enum: [fr, en] }
                preferences:
                  type: object
                  additionalProperties: { type: boolean }
      responses:
        '200': { description: Updated catalog and preferences, same shape as GET }
        '400': { description: Invalid JSON }
        '401': { description: Invalid signed identity }
        '422': { description: Unknown template, non-boolean value, or disabled login message }
  /coverage:
    get:
      summary: Aggregate geographic coverage by active notaries; not date availability.
      parameters:
        - { in: query, name: prefixe, required: true, schema: { type: string } }
        - { in: query, name: deplacement, required: true, schema: { type: string } }
      responses:
        "200":
          description: Coverage without identifying any notary; unknown when coordinates are missing.
          content:
            application/json:
              schema:
                type: object
                required: [status, count, incomplete]
                properties:
                  status: { type: string, enum: [covered, none, unknown] }
                  count: { type: [integer, "null"], minimum: 0, description: Confirmed geographic matches; null when no count can be confirmed. }
                  incomplete: { type: boolean, description: Some active notaries have unknown coordinates; a positive count is a lower bound. }
        "422": { description: Invalid sector or travel band. }
        "503": { description: Coverage temporarily unavailable. }
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe.
      responses:
        "200":
          description: Service is up; echoes the server's current date.
          content:
            application/json:
              schema:
                type: object
                required: [ok, today]
                properties:
                  ok:
                    type: boolean
                    const: true
                  today:
                    type: string
                    format: date
                    description: Server "today" as ISO YYYY-MM-DD.
              example:
                ok: true
                today: "2026-08-12"
  /bids:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
    get:
      operationId: listBids
      summary: List the public bids for a month.
      parameters:
        - name: month
          in: query
          required: false
          description: Month to read, `YYYY-MM`. Defaults to the current month.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          example: "2026-08"
      responses:
        "200":
          description: The bids posted in that month (public projection).
          content:
            application/json:
              schema:
                type: object
                required: [month, bids, experience]
                properties:
                  month:
                    type: string
                    pattern: '^\d{4}-\d{2}$'
                  bids:
                    type: array
                    items:
                      $ref: "#/components/schemas/Bid"
                  experience:
                    $ref: "#/components/schemas/CustomerExperience"
        "400":
          description: Malformed `month` parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: mois_invalide
                    message: month doit être AAAA-MM.
    post:
      operationId: createBid
      summary: Post a bid on a date.
      description: >-
        Revalidates the offer through @nota/domain. `anonyme` defaults to true;
        `nom` is never returned for an anonymous bid (it is stored privately for
        the mise en relation with the retaining notary, ADR 0010 §4). The
        write-only `telephone` (private contact) and `parrain` (partner
        referral code, ADR 0011) ride along here and are never echoed by any
        response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferInput"
      responses:
        "201":
          description: >-
            Bid created (public projection) plus the client's per-bid token.
            The client has no account: `clientToken` (scope `client`, valid
            ~400 days, `sub` = bid id) is their only key to the `/client/*`
            routes — it is returned ONCE here and never echoed again. With
            billing on, `paymentStatus` (pending) and `checkoutUrl` are added.
            `checkoutUrl` opens a hosted Stripe page whose shape depends on the
            signing date (ADR 0035): a PAYMENT session (manual capture) when
            the date is already within `CAUTION_LEAD_DAYS`, otherwise a SETUP
            session that only registers the card — the caution is then placed
            by the daily worker, close enough that it survives to the signing.
          content:
            application/json:
              schema:
                type: object
                required: [bid, clientToken]
                properties:
                  bid:
                    $ref: "#/components/schemas/Bid"
                  clientToken:
                    type: string
                    description: Per-bid client token; sent as a Bearer Authorization header.
                  paymentStatus:
                    type: string
                    enum: [pending]
                  checkoutUrl:
                    type: string
                    format: uri
        "400":
          description: Body was not valid JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: json_invalide
                    message: Corps JSON invalide.
        "422":
          description: >-
            The offer failed domain validation. One or more typed errors are
            returned; the client renders them inline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: sous_prix_depart
                    message: L’offre doit être d’au moins 2 000 $.
  /partenaires:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      operationId: requestPartnerClaim
      summary: Request an email-verified claim on a partner referral code (step 1 of 2, ADR 0011).
      description: >-
        The referral program's front door — now EMAIL-VERIFIED to close two fraud
        vectors (code squatting and harvest-then-claim). Step 1 of a two-step,
        mailbox-proven handshake mirroring the notary sign-in: validate the
        partner type, courriel and desired code, per-IP rate-limit, then mint a
        single-use challenge and EMAIL a confirmation link. NO partner record is
        written yet, so an unverified claim never becomes the payee and never
        permanently blocks the true owner. Enumeration honesty: a code already
        CONFIRMED by another courriel answers 409 `code_deja_pris` (you cannot
        claim a taken code — the one unavoidable disclosure); the SAME courriel
        re-requesting its own confirmed code gets `{ confirmed: true }` with what
        is on file; a FREE code and a merely-PENDING code are indistinguishable —
        both get the generic `{ ok: true }` (+ `devLink`/`devToken` outside
        production, NEVER in production). Redeem the link at `/partenaires/verify`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, courriel, code]
              properties:
                type:
                  type: string
                  description: Partner category id from the domain's REFERRAL.partners.
                  enum: [agent_immobilier, courtier_hypothecaire, autre_professionnel]
                courriel:
                  type: string
                  format: email
                  maxLength: 254
                  description: The partner's contact email (lowercased server-side).
                code:
                  type: string
                  description: Desired referral code — 4–12 letters/digits, case-insensitive, separators ignored.
                  example: eve-roy
      responses:
        "200":
          description: >-
            The claim was accepted and a confirmation link emailed (generic
            `{ ok: true }` — identical for a free or a merely-pending code), OR
            the same courriel re-requested its own ALREADY-confirmed code
            (`{ confirmed: true }` with the registration on file).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
                  ttlMinutes:
                    type: integer
                    description: How many minutes the emailed confirmation link stays valid (the pane shows it).
                  confirmed:
                    type: boolean
                    description: Present and true only when the same courriel already owns this confirmed code.
                  partenaire:
                    $ref: "#/components/schemas/PartnerRegistration"
                  devLink:
                    type: string
                    description: NON-PRODUCTION ONLY — the full confirmation link, for local dev/tests.
                  devToken:
                    type: string
                    description: NON-PRODUCTION ONLY — the raw challenge token, redeemed at /partenaires/verify.
              example:
                ok: true
        "400":
          description: Body was not valid JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The code is already CONFIRMED by another courriel (`code_deja_pris`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            Typed validation errors: `type_inconnu`, `courriel_invalide`,
            `code_invalide` — and `notaire_non_admissible` when the courriel
            already belongs to a notary. ADR 0030: art. 33 of the Code de
            déontologie forbids a notary from receiving "any other advantage"
            related to practising, and a referral reward is one; the claim is
            refused rather than turned into a breach.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Per-IP rate limit exceeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  throttled:
                    type: boolean
                    const: true
              example:
                ok: true
                throttled: true
        "503":
          description: >-
            The deployment cannot build a usable link (no site URL configured),
            so no email is sent — `configuration_incomplete`. A link with no
            host is unusable from an inbox, and outside development the emailed
            link is the only way in; failing loudly beats sending a dead promise.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /partenaires/rappel:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      operationId: partnerCodeReminder
      summary: Email a partner their existing code back.
      description: >-
        Recovery, not a claim: nothing is created and nothing is modified. A
        partner's code, link and type lived only in one device's localStorage,
        so clearing the browser lost them for good — and the only way back was
        to re-claim the very code you had just lost. Only CONFIRMED partners
        are reminded (a merely claimed code belongs to no one). Rate-limited
        per source IP and enumeration-safe: the response never reveals whether
        the address is a partner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courriel]
              properties:
                courriel:
                  type: string
                  format: email
      responses:
        "200":
          description: Acknowledged — identical whether or not the address is a partner.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "422":
          description: The address is not a valid email; nothing is sent.
        "429":
          description: Per-IP ceiling reached.
        "400":
          description: Invalid JSON body.
  /partenaires/verify:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      operationId: verifyPartnerClaim
      summary: Confirm an email-verified partner code claim (step 2 of 2, ADR 0011).
      description: >-
        Step 2 of the partner code claim. Verifies the single-use CHALLENGE token
        from the emailed link (or the dev echo), atomically consumes it (a replay
        or an expired link is rejected, a forged/tampered token never verifies),
        and only THEN writes the confirmed partner record (write-once, first
        verify wins) — the payee of record. Sends the welcome + operator mails
        exactly once. Mirrors `/notary/session/verify`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: The CHALLENGE token from the emailed confirmation link (or the dev echo).
      responses:
        "201":
          description: The claim was confirmed; the stored (normalized) registration is echoed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerRegistration"
        "200":
          description: >-
            Idempotent — the same courriel already confirmed this code (a race the
            write-once create lost); what is on file is echoed with `confirmed: true`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  confirmed:
                    type: boolean
                    const: true
                  partenaire:
                    $ref: "#/components/schemas/PartnerRegistration"
        "401":
          description: The token is invalid, expired, tampered, or already used (`lien_invalide`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Another verified owner claimed the code first (`code_deja_pris`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /notaries/connect:
    post:
      operationId: startConnectOnboarding
      summary: Start a notary's FREE Stripe Connect onboarding.
      description: >-
        Opens a fresh Stripe Connect onboarding link for the authenticated
        notary's own email. Joining is free. Card data stays with Stripe.
        Repeated requests reuse the connected account but issue a new single-use
        onboarding URL. Account readiness is updated by verified Stripe webhooks.
      security:
        - notarySession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectInput"
      responses:
        "401": { description: A valid notary session is required. }
        "403": { description: The email does not belong to the signed-in notary. }
        "503": { description: Payment onboarding is unavailable. }
        "200":
          description: Onboarding link created; redirect the notary to `url`.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    format: uri
                    description: Stripe-hosted Checkout URL.
                example:
                  url: https://checkout.stripe.com/c/pay/cs_test_a1b2c3
        "422":
          description: The email failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: courriel_invalide
                    message: Un courriel valide est requis.
  /stripe/webhook:
    post:
      operationId: stripeWebhook
      summary: Stripe webhook receiver (account + payment lifecycle).
      description: >-
        Verifies the raw request body against the platform webhook signing
        secret or the optional connected-account webhook signing secret using
        the `stripe-signature` header, then applies the event — `account.updated`
        flips the notary ACTIVE once charges are enabled,
        `account.application.deauthorized` restricts them, and
        `checkout.session.completed` / `checkout.session.expired` /
        `payment_intent.canceled` bind or void a client's offer authorization.
        Since ADR 0035 a `checkout.session.completed` carrying no PaymentIntent
        (setup mode) and `setup_intent.succeeded` REGISTER the client's card
        instead — the offer goes live with no money held, and the caution is
        placed by the daily worker two days before the signing.
        Processing is idempotent by event id, so a redelivered event is a no-op.
        Authenticated events from the other Stripe mode are acknowledged without
        changing records or sending notifications, including test Connect events
        delivered to a live destination.
        Not called by browsers.
      parameters:
        - name: stripe-signature
          in: header
          required: true
          description: Stripe signature used to verify the payload.
          schema:
            type: string
      requestBody:
        required: true
        description: The raw Stripe event payload (verified, not parsed as trusted JSON).
        content:
          application/json:
            schema:
              type: object
              description: An opaque Stripe Event object.
      responses:
        "200":
          description: Event verified and processed (or ignored/duplicated).
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received:
                    type: boolean
                    const: true
              example:
                received: true
        "400":
          description: Missing or invalid Stripe signature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: signature_invalide
                    message: Signature Stripe invalide.
  /notary/session/request:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      operationId: requestNotarySignInLink
      summary: Request a passwordless sign-in link for the notary console (step 1 of 2).
      description: >-
        Step 1 of the notary console sign-in. Proves mailbox ownership BEFORE any
        session token is minted (the old one-shot route trusted a bare, unverified
        request email). Per-IP rate-limited and ENUMERATION-SAFE: an active
        notary, an inactive one and a stranger all receive the SAME generic
        `{ ok: true }`, so the response never reveals whether an address is a
        notary. Only an ACTIVE notary (or the dev/demo hatch) actually mints a
        single-use, ~15-minute challenge and is emailed the link. Outside
        production the response also carries `devLink`/`devToken` so local dev and
        the test suite complete the flow with no mailbox; NEVER in production.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  description: The notary's professional email.
      responses:
        "200":
          description: >-
            Generic acknowledgement — identical whether or not the address is a
            notary. `throttled` is never true here (the rate limit maps to 429).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
                  devLink:
                    type: string
                    description: NON-PRODUCTION ONLY — the full magic link, for local dev/tests.
                  devToken:
                    type: string
                    description: NON-PRODUCTION ONLY — the raw challenge token, redeemed at /notary/session/verify.
              example:
                ok: true
        "422":
          description: The email failed validation (leaks nothing about who is a notary).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: courriel_invalide
                    message: Le courriel n’est pas valide.
        "429":
          description: Per-IP rate limit exceeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  throttled:
                    type: boolean
                    const: true
              example:
                ok: true
                throttled: true
        "503":
          description: >-
            The deployment cannot build a usable link (no site URL configured),
            so no email is sent — `configuration_incomplete`. A link with no
            host is unusable from an inbox, and outside development the emailed
            link is the only way in; failing loudly beats sending a dead promise.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notary/session/verify:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      operationId: verifyNotarySignInLink
      summary: Redeem a magic link for a notary session (step 2 of 2).
      description: >-
        Step 2 of the notary console sign-in. Verifies the single-use CHALLENGE
        token, atomically consumes it (a replay or an expired link is rejected),
        re-checks the notary is still ACTIVE, then issues the stateless SESSION +
        FEED tokens. Preserves the notary profile upsert (stable étude label).
        Per-IP rate limited (20 redemptions / 15 min, wider than the 5 links of
        step 1 because a prefetching mail client legitimately replays the same
        link): every redemption now writes an audit entry, and an unbounded
        anonymous flood would land on the single `AUDIT#<day>` partition key
        that also carries the money trail (ADR 0036). Fails OPEN if the counter
        errors — a notary's sign-in does not depend on an abuse counter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: The CHALLENGE token from the emailed link (or the dev echo).
      responses:
        "200":
          description: The link was valid and unredeemed; a session is issued.
          content:
            application/json:
              schema:
                type: object
                required: [token, feedToken, email, expiresAt]
                properties:
                  token:
                    type: string
                    description: SESSION token — sent in the Authorization header, never in a URL.
                  feedToken:
                    type: string
                    description: Read-only FEED token, safe to embed in a webcal URL.
                  email:
                    type: string
                    format: email
                    description: The authenticated notary's own address.
                  expiresAt:
                    type: string
                    format: date-time
        "401":
          description: The token is invalid, expired, tampered, or already used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: lien_invalide
                    message: Lien invalide ou déjà utilisé.
        "403":
          description: The notary is no longer active (deactivated between request and verify).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: compte_requis
                    message: Un compte notaire actif est requis pour accéder à la console. L’inscription est gratuite.
        "429":
          description: >-
            Too many redemptions from this source address in the window. Only
            the crossing itself is audited — one entry, not one per blocked
            request, so the log cannot be inflated by the flood it records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: trop_de_tentatives
                    message: Trop de tentatives. Réessayez dans quinze minutes.
  /notary/bids:
    get:
      operationId: listNotaryBids
      summary: Open bids for the notary console (+ this notary's retained bids).
      security:
        - notarySession: []
      parameters:
        - name: service
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ServiceId"
      responses:
        "200":
          description: >-
            Open, live bids in the forward month window (minus the ones this
            notary declined), each with THIS notary's own latest proposition
            and document request (never another notary's) and the dossier items
            still missing. The feed only offers what this notary can serve
            (ADR 0017/0025, `notaryCanServe`): when both the bid's postal
            sector and the étude's are known, the MEASURED distance decides
            (it must fit the declared band, and the notary's `rayonKm` when
            the notary travels); otherwise the declarative proxy applies — a
            travel band beyond the declared `rayonKm`, or an online urgency
            they never opted into, is filtered out server-side; bids predating
            the déplacement question reach everyone. Each bid carries
            `distanceKm`, the ≈ km between the two sectors (null when either
            sector is unknown). `retained` lists the bids in the window retained by
            this notary — including those retained through a proposition the
            client accepted (`viaProposition`), which the console never
            accepted itself — each with the `client` contact block (mise en
            relation, ADR 0010 §4), the live thread, and `annulation` — what
            a client cancellation TODAY would hand this notary (ADR 0033).
            Open bids never carry client contact. Alongside: `profil` (the
            notary's own record, with `complet`/`manquants` — the gate on
            retaining), `tarif` (what the CLIENT pays Nota, ADR 0031 — never
            a share of the honoraires), `conditions` (what retaining commits
            the notary to, ADR 0033) and `fenetre` (the months `retained`
            covers, so the console can prune entries the server no longer
            returns — cancelled acts).
          content:
            application/json:
              schema:
                type: object
                required: [bids, retained, rating, cote, tarif, profil, conditions, fenetre]
                properties:
                  bids:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotaryBid"
                  retained:
                    type: array
                    items:
                      $ref: "#/components/schemas/RetainedBid"
                  rating:
                    $ref: "#/components/schemas/NotaryRating"
                  cote:
                    $ref: "#/components/schemas/NotaryCote"
                  tarif:
                    $ref: "#/components/schemas/NotaryTarif"
                  profil:
                    $ref: "#/components/schemas/NotaryProfil"
                  conditions:
                    $ref: "#/components/schemas/NotaryConditions"
                  fenetre:
                    type: array
                    description: The forward month window (`YYYY-MM`) the feed and `retained` cover.
                    items:
                      type: string
                      pattern: "^[0-9]{4}-[0-9]{2}$"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /notary/evaluations:
    get:
      operationId: listNotaryEvaluations
      summary: The notary's own track record — every client evaluation, newest first.
      description: >-
        The anonymized evaluation ledger (ADR 0021): each entry is the note,
        the optional comment, the act's service and date, and the instant the
        client submitted it — never the client's identity. Evaluations
        submitted before the ledger existed are not backfilled; they remain
        counted in `rating`. The response also carries the notary's `cote`
        (ADR 0028) and, service by service, the record behind it.
      security:
        - notarySession: []
      responses:
        "200":
          description: The aggregate the clients see, and the entries behind it.
          content:
            application/json:
              schema:
                type: object
                required: [rating, cote, services, evaluations]
                properties:
                  rating:
                    $ref: "#/components/schemas/NotaryRating"
                  cote:
                    $ref: "#/components/schemas/NotaryCote"
                  services:
                    type: array
                    description: >-
                      One row per catalogue service (`domain.notaryServiceRecord`),
                      always the WHOLE catalogue: a service never rendered reads
                      at zero acts and zero reviews, never with a fake average.
                    items:
                      type: object
                      required: [serviceId, nom, nomEn, actes, avis, note]
                      properties:
                        serviceId:
                          $ref: "#/components/schemas/ServiceId"
                        nom:
                          type: string
                        nomEn:
                          type: string
                        actes:
                          type: integer
                          minimum: 0
                          description: Acts this notary settled for that service.
                        avis:
                          type: integer
                          minimum: 0
                        note:
                          type: [number, "null"]
                          description: One-decimal mean for that service, null with no review.
                  evaluations:
                    type: array
                    items:
                      type: object
                      required: [note]
                      properties:
                        note:
                          type: integer
                          minimum: 1
                          maximum: 5
                        commentaire:
                          type: [string, "null"]
                        serviceId:
                          type: [string, "null"]
                        dateISO:
                          type: [string, "null"]
                          description: The act's date (the signing the note rates).
                        createdAt:
                          type: [string, "null"]
                          description: When the client submitted the evaluation.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /notary/profile:
    post:
      operationId: updateNotaryProfile
      summary: Update the notary's profile — identity, CNQ fiche, travel radius, urgency opt-in, alerts.
      description: >-
        The editable fields of the notary's profile. `nom`, `etude`,
        `telephone`, `adresse` (ADR 0033) are the identity a retained client
        receives — all optional at save time, but nom, téléphone and adresse
        must be on the profile before the notary may retain or propose
        (`profil_incomplet` otherwise). `lienCNQ` (ADR 0016) is
        the link of their official fiche in the Chambre des notaires du Québec
        directory — the domain is the authority on what counts as a fiche
        (https on the `cnq.org` host or a subdomain, nothing else), and an
        empty value clears the fiche (and the « CNQ » badge clients see).
        `rayonKm` and `urgences` (ADR 0017) declare how far the notary travels
        for in-person signatures and whether they take 100 %-online urgency
        acts — the two levers that widen (or narrow) the demandes the feed
        offers them. `prefixe` (ADR 0025) is the étude's postal sector (FSA):
        optional — empty clears it — but when present it turns the feed's
        declarative travel rules into measured client↔étude distances.
        `alertes` (ADR 0033 §7) is how new demandes reach the notary.
        A field ABSENT from the body keeps its stored value; a field present
        but empty clears it — the console edits the profile from more than
        one form, and a block posting only its own fields never wipes the
        others. The write spreads the existing profile record, so the billing
        identity and the rating aggregates survive.
      security:
        - notarySession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nom:
                  type: [string, "null"]
                  maxLength: 120
                  description: « Me Prénom Nom »; over 120 chars → 422 `nom_invalide`.
                etude:
                  type: [string, "null"]
                  maxLength: 120
                  description: The firm's name; over 120 chars → 422 `etude_invalide`.
                telephone:
                  type: [string, "null"]
                  description: >-
                    Any human formatting; stripped, 10–11 digits must remain
                    (`domain.validateTelephone`), else 422 `telephone_invalide`.
                adresse:
                  type: [string, "null"]
                  maxLength: 200
                  description: One line; over 200 chars → 422 `adresse_invalide`.
                alertes:
                  $ref: "#/components/schemas/NotaryAlertes"
                lienCNQ:
                  type: [string, "null"]
                  description: Official fiche URL on cnq.org, or empty to clear.
                rayonKm:
                  type: integer
                  enum: [0, 25, 50]
                  default: 0
                  description: Declared travel radius in km (NOTARY_RADII); absent means 0.
                urgences:
                  type: boolean
                  default: false
                  description: Opt into 100 %-online urgency acts (strictly boolean true).
                prefixe:
                  type: [string, "null"]
                  maxLength: 3
                  description: >-
                    The étude's postal sector (FSA, e.g. "G1V"), normalized
                    server-side; empty/absent clears it. Malformed → 422
                    `prefixe_invalide`.
                token:
                  type: string
                  description: Session token fallback when the Authorization header is absent.
      responses:
        "200":
          description: The stored profile.
          content:
            application/json:
              schema:
                type: object
                required: [profil]
                properties:
                  profil:
                    $ref: "#/components/schemas/NotaryProfil"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: >-
            The link is not a fiche on the Chambre's own site
            (`lien_cnq_invalide`), the radius is not 0, 25 or 50
            (`rayon_invalide`), the étude sector is not letter-digit-letter
            (`prefixe_invalide`), an identity field is oversized
            (`nom_invalide`, `etude_invalide`, `adresse_invalide`), the phone
            is not dialable (`telephone_invalide`), or the alert preferences
            are malformed (`alertes_invalides`, `alerte_rythme_invalide`).
            A refused write never touches the stored record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /notary/bids/accept:
    post:
      operationId: acceptBid
      summary: Retain an open bid at the client's price (accepter l'offre).
      description: >-
        The console's one-click retain. A conditional retain (`retainFor`) closes
        the TOCTOU race — two notaries accepting the same open bid concurrently
        both read `ouverte`, but only ONE write wins; the loser gets 409
        `deja_retenue`. Idempotent for the winner: a re-accept by the SAME notary
        re-returns the released dossier (settling a pending pay-on-accept capture
        if billing is on). The response hands the retaining notary the dossier
        and the mise en relation `client` contact block (ADR 0010 §4); `courriel`
        stays at the top level for existing callers. With billing configured and
        an authorized card, the payout fields (`paid` + `commissionCents`/
        `netCents`, or `paid:false` + `paymentError`) are added.
      security:
        - notarySession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO]
              properties:
                id:
                  type: string
                dateISO:
                  type: string
                  format: date
                token:
                  type: string
                  description: Session token fallback when no Authorization header is sent.
      responses:
        "200":
          description: The bid is retained by this notary; the released dossier is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedBid"
        "400":
          description: Body was not valid JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            `profil_incomplet` (ADR 0033): the notary's profile lacks a name,
            a phone or the étude's address — the client could not reach them;
            `manquants` lists the fields still empty with their labels. Or
            `deplacement_non_couvert` (ADR 0017): the bid's déplacement band
            is beyond this notary's declared radius, or an online urgency they
            never opted into. A notary who already retained the bid keeps the
            idempotent re-accept regardless of either.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                profilIncomplet:
                  value:
                    errors:
                      - code: profil_incomplet
                        message: Complétez votre profil (nom, téléphone, adresse de l’étude) avant de retenir une demande.
                        manquants:
                          - id: telephone
                            label: Votre téléphone
                deplacement:
                  value:
                    errors:
                      - code: deplacement_non_couvert
                        message: Cette demande exige un déplacement ou une urgence en ligne que votre profil ne couvre pas.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AlreadyRetained"
        "410":
          description: The bid was cancelled (`offre_annulee`) or expired / missing a valid deadline (`offre_expiree`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /notary/bids/propose:
    post:
      operationId: proposeCounterOffer
      summary: Propose a higher price to the client (proposition de prix).
      description: >-
        Validated by the domain (`validateCounterOffer`): the amount must exceed
        the client's offer and stay under the premium cap; the date must not be
        past. A new proposition by the same notary marks their previous
        `en_attente` one `remplacee`. The client is emailed (`propositionRecue`)
        and answers through `/client/propositions/accept|decline`.
      security:
        - notarySession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO, montant]
              properties:
                id:
                  type: string
                dateISO:
                  type: string
                  format: date
                montant:
                  type: integer
                  minimum: 1
                message:
                  type: string
                  maxLength: 500
                token:
                  type: string
                  description: Session token fallback when no Authorization header is sent.
      responses:
        "200":
          description: Proposition recorded (notary projection).
          content:
            application/json:
              schema:
                type: object
                required: [proposition]
                properties:
                  proposition:
                    $ref: "#/components/schemas/NotaryProposition"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            `profil_incomplet` (ADR 0033): a proposition is an offer to take
            the act — same gate as a retain (name, phone, address; `manquants`
            lists what is missing). Or `deplacement_non_couvert` (ADR 0017):
            the bid's déplacement band is beyond this notary's declared
            radius, or an online urgency they never opted into.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                profilIncomplet:
                  value:
                    errors:
                      - code: profil_incomplet
                        message: Complétez votre profil (nom, téléphone, adresse de l’étude) avant de retenir une demande.
                        manquants:
                          - id: adresse
                            label: L’adresse de votre étude
                deplacement:
                  value:
                    errors:
                      - code: deplacement_non_couvert
                        message: Cette demande exige un déplacement ou une urgence en ligne que votre profil ne couvre pas.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AlreadyRetained"
        "410":
          description: Offer expired or has no valid expiry date (offre_expiree).
        "422":
          description: >-
            Domain errors: `offre_non_ouverte`, `montant_invalide`, `date_passee`,
            `proposition_inferieure`, `plafond_depasse`, `message_trop_long`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /notary/bids/documents:
    post:
      operationId: requestDocuments
      summary: Ask the client for dossier documents/fields (demande de documents).
      description: >-
        `documents` are ids from the service's requestable items (documents and
        intake fields). Allowed while the bid is open, or when THIS notary
        retained it; a bid retained by another notary answers 409. The client
        is emailed the list (`documentsDemandes`).
      security:
        - notarySession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO, documents]
              properties:
                id:
                  type: string
                dateISO:
                  type: string
                  format: date
                documents:
                  type: array
                  minItems: 1
                  items:
                    type: string
                message:
                  type: string
                  maxLength: 500
                token:
                  type: string
      responses:
        "200":
          description: Request recorded (notary projection).
          content:
            application/json:
              schema:
                type: object
                required: [demande]
                properties:
                  demande:
                    $ref: "#/components/schemas/NotaryDemande"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AlreadyRetained"
        "410":
          description: Offer expired or has no valid expiry date (offre_expiree).
        "422":
          description: >-
            Domain errors: `service_inconnu`, `documents_requis`,
            `document_inconnu`, `message_trop_long`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: notaryReadDocument
      summary: Ouvrir une autorisation de lecture d'un document.
      description: >-
        L'acces est decide ICI, au serveur : une URL signee est un secret
        porteur, jamais une frontiere d'autorisation. L'autorisation dure deux
        minutes et force une piece jointe — un document depose par un inconnu ne
        doit jamais s'executer dans l'origine de Nota. Chaque lecture laisse une
        trace d'audit.
      security:
        - notarySession: []
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
        - name: dateISO
          in: query
          required: true
          schema: { type: string, format: date }
        - name: documentId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Le document et son autorisation de lecture.
          content:
            application/json:
              schema:
                type: object
                required: [document, lecture]
                properties:
                  document: { $ref: "#/components/schemas/ChatDocument" }
                  lecture: { $ref: "#/components/schemas/LectureAutorisation" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Aucun stockage configure sur ce deploiement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
  /client/bid/documents:
    post:
      operationId: clientOpenDocumentUpload
      summary: Ouvrir une autorisation de depot de document dans la conversation.
      description: >-
        ADR 0032. Les octets ne traversent JAMAIS l'API : le navigateur televerse
        directement vers le stockage avec l'autorisation signee rendue ici, qui
        porte une seule cle, un seul type, une seule taille et quelques minutes.
        La conversation n'existe qu'apres retention. Le document reste
        `en_attente` jusqu'a ce que le serveur CONSTATE le depot
        (`/documents/confirme`) : une piece annoncee n'est pas une piece recue.
        Repond 503 quand aucun stockage n'est configure — jamais une URL inventee.
      security:
        - clientBidToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO, nom, taille, type]
              properties:
                id: { type: string }
                dateISO: { type: string, format: date }
                nom: { type: string, maxLength: 120 }
                taille:
                  type: integer
                  description: Taille declaree, en octets. Bornee a 15 Mo par le domaine.
                type:
                  type: string
                  description: >-
                    Type MIME declare. Il doit s'accorder a l'extension du nom,
                    et il est FIGE dans l'autorisation signee : une autorisation
                    emise pour un PDF ne peut pas servir a deposer autre chose.
      responses:
        "200":
          description: Le document cree et son autorisation de depot.
          content:
            application/json:
              schema:
                type: object
                required: [document, depot]
                properties:
                  document: { $ref: "#/components/schemas/ChatDocument" }
                  depot: { $ref: "#/components/schemas/DepotAutorisation" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          description: Aucun stockage configure sur ce deploiement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
    get:
      operationId: clientReadDocument
      summary: Ouvrir une autorisation de lecture d'un document.
      description: >-
        L'acces est decide ICI, au serveur : une URL signee est un secret
        porteur, jamais une frontiere d'autorisation. L'autorisation dure deux

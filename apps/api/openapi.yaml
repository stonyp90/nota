        - name: documentId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Le document et son autorisation de lecture.
          content:
            application/json:
              schema:
                type: object
                required: [document, lecture]
                properties:
                  document: { $ref: "#/components/schemas/ChatDocument" }
                  lecture: { $ref: "#/components/schemas/LectureAutorisation" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Aucun stockage configure sur ce deploiement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
  /client/bid/documents/confirme:
    post:
      operationId: clientConfirmDocument
      summary: Confirmer qu'un document est bien arrive dans le stockage.
      description: >-
        Le serveur CONSTATE le depot ; il ne croit pas le navigateur sur parole.
        Sans cela, n'importe qui pourrait faire apparaitre dans le fil une piece
        jamais televersee. Le document passe alors a `pret` et devient visible
        pour l'autre partie.
      security:
        - clientBidToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dateISO, documentId]
              properties:
                id: { type: string }
                dateISO: { type: string, format: date }
                documentId: { type: string }
      responses:
        "200":
          description: Le document, desormais pret.
          content:
            application/json:
              schema:
                type: object
                required: [document]
                properties:
                  document: { $ref: "#/components/schemas/ChatDocument" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          description: Aucun stockage configure sur ce deploiement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
  /notary/bids/documents/depot:
    post:
      operationId: notaryOpenDocumentUpload

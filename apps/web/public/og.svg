<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Nota">
  <!-- Brand values = the production Nota Québec lockup. -->
  <rect width="1200" height="630" fill="#ffffff" />
  <rect width="1200" height="12" fill="#386888" />
  <!-- The lockup (ADR 0048, variant C · design 02 « Signal repris par le badge »
       · optical sizing at 48%): one transform group per element, every
       geometry derived from the TILE (96 px here = 64 units × 1.5) by the same
       five ratios styles.css declares as its lockup custom properties: word caps .48 × tile,
       centred on the tile; tile→word gap .12; word→badge gap .16; badge
       font-size .16. This file is standalone: no <use>, no web font for the word. -->
  <g id="og-lockup" transform="translate(96 150)">
    <!-- Tile: the #nota-logomark drawing, verbatim, at ×1.5. -->
    <g id="og-tile" transform="scale(1.5)">
      <rect width="64" height="64" rx="7" fill="#264961"/>
      <g fill="#ffffff">
        <rect x="16" y="15" width="9.5" height="34" rx="1"/>
        <rect x="38.5" y="15" width="9.5" height="34" rx="1"/>
        <polygon points="16,15 26.2,15 48,49 37.8,49"/>
      </g>
      <rect x="40" y="8" width="16" height="16" rx="3" fill="#407598" stroke="#264961" stroke-width="3"/>
    </g>
    <!-- Word: the shared OTA paths, cap height .48 × 96 = 46.08, centred on the tile. -->
    <g id="og-word" transform="translate(107.5200000000 19.2000000000) scale(1.6457142857)" fill="#101b26" fill-rule="evenodd">
      <path d="M0 8.5a5 5 0 0 1 5-5H22a5 5 0 0 1 5 5V26.5a5 5 0 0 1-5 5H5a5 5 0 0 1-5-5ZM7.8 12.8v9.4a1.5 1.5 0 0 0 1.5 1.5h8.4a1.5 1.5 0 0 0 1.5-1.5V12.8a1.5 1.5 0 0 0-1.5-1.5H9.3a1.5 1.5 0 0 0-1.5 1.5Z" />
      <path d="M31 3.5H57.6V11.3H48.2V27.02L40.4 31.5V11.3H31Z"/>
      <path d="M65.17 6.7L70.74 3.5H72.5L84.1 31.5H75.77L73.93 25.89H64.95L63.23 31.5H54.9ZM69.5 10L73 20.3H66Z"/>
      <rect x="87.4" y="27.1" width="4.4" height="4.4" rx="1" fill="#407598"/>
    </g>
    <!-- Badge: the signal colour (nota-blue-500) with white text, font-size
         .16 × 96 = 15.36, padding .55em / .7em, radius 3 × 1.5; starts .16 × 96
         after the word, at x 273.96, centred on the tile. -->
    <g id="og-badge" transform="translate(273.9565714286 31)">
      <rect width="96" height="34" rx="4.5" fill="#407598" />
      <text x="48" y="22.5" text-anchor="middle" font-family="Inter, sans-serif" font-size="15.36" font-weight="800" fill="#ffffff" letter-spacing="1.54">QUÉBEC</text>
    </g>
  </g>
  <text x="96" y="380" font-family="'Sora', Inter, sans-serif" font-size="72" font-weight="800" fill="#101b26" letter-spacing="-2">Un notaire, à la date qu’il</text>
  <text x="96" y="462" font-family="'Sora', Inter, sans-serif" font-size="72" font-weight="800" fill="#101b26" letter-spacing="-2">vous faut.</text>
  <text x="96" y="536" font-family="Inter, sans-serif" font-size="30" font-weight="500" fill="#526b78">Refinancement · Financement hypothécaire — publier est gratuit</text>
</svg>

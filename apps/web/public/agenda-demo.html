<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Nota dans votre agenda — Démonstration</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="agenda-demo.css">
  <script defer src="i18n.js"></script>
  <script defer src="agenda-demo.js"></script>
</head>
<body>
  <main class="calendar-demo-page">
    <a href="/#t=notaires" aria-label="Retour à l’espace notaire"><img src="nota-logo-light.svg" width="120" height="50" alt="Nota"></a>
    <div data-lang-seg data-i18n-skip><button type="button" data-set-lang="fr">FR</button><button type="button" data-set-lang="en">EN</button></div>
    <h1>Ajoutez Nota à votre agenda.</h1>
    <figure class="nc-calendar-teaser">
      <video class="nc-calendar-video" muted loop playsinline preload="none"
        poster="media/nota-agenda-fr.png?v=ac58af6fd6"
        data-film-fr="media/nota-agenda-fr.mp4?v=ee910c3b6d" data-film-en="media/nota-agenda-en.mp4?v=d29a95937b"
        data-poster-fr="media/nota-agenda-fr.png?v=ac58af6fd6" data-poster-en="media/nota-agenda-en.png?v=f213bcb6e3"
        aria-label="Un notaire ajoute Nota à son agenda, reçoit une nouvelle offre, l’ouvre dans Nota et confirme sa prise en charge. Démonstration avec l’application réelle."></video>
      <figcaption><span>Illustration · Sans son</span><button class="nc-calendar-play" type="button">Lire l’animation</button></figcaption>
    </figure>
    <a class="btn" href="/#t=notaires">Ajouter Nota à mon agenda</a>
  </main>
</body>
</html>

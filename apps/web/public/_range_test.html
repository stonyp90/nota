<!doctype html><meta charset="utf-8">
<input type="range" id="r" min="0" max="100" value="50" step="1">
<input type="number" id="n" min="0" max="100" value="50">
<pre id="out">pending</pre>
<script>
  var r = document.getElementById('r');
  var n = document.getElementById('n');
  var before = r.value;
  r.min = 80;                 // raise the floor above current value
  var afterRange = r.value;   // real browsers clamp UP to 80
  n.min = 80;
  var afterNumber = n.value;  // number inputs do NOT clamp
  document.getElementById('out').textContent = JSON.stringify({
    rangeBefore: before,
    rangeAfterMin80: afterRange,
    rangeClampsUp: Number(afterRange) === 80,
    branch_valueLessThanBase_fires: Number(afterRange) < 80,
    numberAfterMin80: afterNumber
  }, null, 2);
</script>
